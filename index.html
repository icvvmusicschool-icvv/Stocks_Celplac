/* =====================================================================
   CONSULTA GUIADA — Espécie › Bitola › Dimensões › Estoque
   Ochapasões derivadas do cadastro real (vw_estoque já carregado e atualizado
   em tempo real). Nada fixo no código. Seleções ficam só na memória da
   sessão (S.consulta) — nada é gravado no navegador.
   ===================================================================== */
S.consulta = { especie: null, espessura: null, dim: null, aviso: null };
const PASSOS = ['Espécie', 'Bitola', 'Dimensões', 'Estoque'];
const LAMINAS = [['#EAD6A6', '#D1B072'], ['#CF9873', '#AC6D4D'], ['#A3744C', '#7A5032']];
const mmDe = m => Math.round(Number(m) * 1000);
const dimKey = p => `${mmDe(p.comprimento_m)}x${mmDe(p.largura_m)}`;
const dimTexto = k => { const [c, l] = k.split('x').map(Number); return `${nfI.format(c)} x ${nfI.format(l)} mm`; };
const bitolaTexto = e => { const n = Number(e); return (Number.isInteger(n) ? String(n).padStart(2, '0') : String(n).replace('.', ',')) + ' mm'; };
const baseConsulta = () => S.estoque.filter(p => p.ativo || p.saldo !== 0);
const resumoDe = l => ({ itens: l.length, pc: l.reduce((a, p) => a + p.saldo, 0), m3: l.reduce((a, p) => a + Number(p.m3_total), 0) });
function opcoesEspecie() {
  const base = baseConsulta();
  return S.ref.especies.map(e => ({ id: e.id, nome: e.nome, ...resumoDe(base.filter(p => p.especie_id === e.id)) })).filter(o => o.itens > 0);
}
function opcoesBitola(esp) {
  const base = baseConsulta().filter(p => p.especie_id === esp);
  return [...new Set(base.map(p => Number(p.espessura_mm)))].sort((a, b) => a - b)
    .map(v => ({ v, ...resumoDe(base.filter(p => Number(p.espessura_mm) === v)) }));
}
function opcoesDim(esp, bit) {
  const base = baseConsulta().filter(p => p.especie_id === esp && Number(p.espessura_mm) === bit);
  return [...new Set(base.map(dimKey))]
    .sort((a, b) => { const [c1, l1] = a.split('x').map(Number), [c2, l2] = b.split('x').map(Number); return c1 - c2 || l1 - l2; })
    .map(k => { const l = base.filter(p => dimKey(p) === k); return { k, cats: [...new Set(l.map(p => p.categoria))], ...resumoDe(l) }; });
}
const produtosDaConsulta = C => baseConsulta().filter(p => p.especie_id === C.especie && Number(p.espessura_mm) === C.espessura && dimKey(p) === C.dim);

// Se uma ochapasão deixou de existir no cadastro, limpa a seleção e avisa
function validarConsulta() {
  const C = S.consulta;
  if (C.especie && !opcoesEspecie().some(o => o.id === C.especie)) {
    Object.assign(C, { especie: null, espessura: null, dim: null, aviso: 'A espécie selecionada não tem mais produtos cadastrados. Selecione novamente.' });
  }
  if (C.especie && C.espessura != null && !opcoesBitola(C.especie).some(o => o.v === C.espessura)) {
    Object.assign(C, { espessura: null, dim: null, aviso: 'A bitola selecionada não está mais cadastrada para esta espécie. Selecione novamente.' });
  }
  if (C.espessura != null && C.dim && !opcoesDim(C.especie, C.espessura).some(o => o.k === C.dim)) {
    Object.assign(C, { dim: null, aviso: 'A dimensão selecionada não está mais cadastrada para esta bitola. Selecione novamente.' });
  }
}
const etapaMaxima = () => { const C = S.consulta; return !C.especie ? 1 : C.espessura == null ? 2 : !C.dim ? 3 : 4; };
function irEtapa(e) { const h = `#/consulta?e=${e}`; if (location.hash === h) renderConsulta(); else location.hash = h; }
function novaConsulta() { S.consulta = { especie: null, espessura: null, dim: null, aviso: null }; irEtapa(1); }

function renderConsulta() {
  validarConsulta();
  const C = S.consulta;
  const pedida = +new URLSearchParams(location.hash.split('?')[1] || '').get('e') || 1;
  const e = Math.min(Math.max(pedida, 1), etapaMaxima());
  if (e !== pedida) history.replaceState(null, '', `#/consulta?e=${e}`);
  const esp = S.ref.especies.find(x => x.id === C.especie);
  const escolhas = [esp?.nome, C.espessura != null ? bitolaTexto(C.espessura) : null, C.dim ? dimTexto(C.dim) : null];
  const aviso = C.aviso; C.aviso = null;

  const passos = PASSOS.map((nome, i) => {
    const n = i + 1, atual = n === e, feito = !atual && n < 4 && !!escolhas[i], pode = n <= etapaMaxima();
    return `<button class="passo ${atual ? 'atual' : ''} ${feito ? 'feito' : ''}" data-ir="${n}" ${pode && !atual ? '' : 'disabled'} ${atual ? 'aria-current="step"' : ''}>
      <span class="n">${n}</span><span class="t">${nome}<small>${esc(escolhas[i] || (atual ? (n === 4 ? 'Resultado' : 'Escolha') : ''))}</small></span></button>`;
  }).join('');
  const trilha = ['Estoque', ...escolhas.slice(0, e - 1)].map((t, i) =>
    i === 0 ? `<span>${esc(t)}</span>` : `<a href="#/consulta?e=${i}">${esc(t).replace(' x ', ' <span style="text-transform:none">x</span> ')}</a>`).join('<span class="sep" aria-hidden="true">›</span>');

  let corpo = '', podeAvancar = false;
  if (e === 1) {
    const ops = opcoesEspecie(); podeAvancar = !!C.especie;
    corpo = `<h3 class="perg">Qual espécie?</h3>` + (ops.length ? `<div class="cards especies">${ops.map((o, i) => {
      const [a, b] = LAMINAS[i % LAMINAS.length];
      return `<button class="cartao esp ${o.id === C.especie ? 'sel' : ''}" data-v="${o.id}" aria-pressed="${o.id === C.especie}">
        <span class="lamina" style="background:repeating-linear-gradient(180deg,${a} 0 7px,${b} 7px 14px)"></span>
        <span class="nome">${esc(o.nome)}</span>
        <span class="det">${pc(o.itens)} itens · ${pc(o.pc)} chapas · ${m3(o.m3)} m³</span><span class="ok" aria-hidden="true">✓</span></button>`;
    }).join('')}</div>` : '<div class="msg">Nenhum produto cadastrado. Cadastre produtos em Cadastros › Produtos.</div>');
  } else if (e === 2) {
    const ops = opcoesBitola(C.especie); podeAvancar = C.espessura != null;
    corpo = `<h3 class="perg">Qual bitola de ${esc(esp.nome)}?</h3>` + (ops.length ? `<div class="cards">${ops.map(o => `
      <button class="cartao ${o.v === C.espessura ? 'sel' : ''} ${o.pc <= 0 ? 'zero' : ''}" data-v="${o.v}" aria-pressed="${o.v === C.espessura}">
        <span class="nome num">${bitolaTexto(o.v)}</span>
        <span class="det">${pc(o.itens)} ${o.itens > 1 ? 'itens' : 'item'} · ${o.pc > 0 ? `${pc(o.pc)} chapas · ${m3(o.m3)} m³` : 'sem saldo'}</span><span class="ok" aria-hidden="true">✓</span></button>`).join('')}${podeLancar() ? '<button class="cartao novo" id="c-novo"><span class="nome">+ Nova bitola</span><span class="det">Chapa produzida que ainda não tem cadastro</span></button>' : ''}</div>`
      : '<div class="msg">Nenhuma bitola cadastrada para esta espécie.</div>');
  } else if (e === 3) {
    const ops = opcoesDim(C.especie, C.espessura); podeAvancar = !!C.dim;
    corpo = `<h3 class="perg">Qual dimensão? <span class="muted">comprimento x largura</span></h3>` + (ops.length ? `<div class="cards">${ops.map(o => `
      <button class="cartao ${o.k === C.dim ? 'sel' : ''} ${o.pc <= 0 ? 'zero' : ''}" data-v="${o.k}" aria-pressed="${o.k === C.dim}">
        <span class="nome num dim">${dimTexto(o.k)}</span>
        <span class="det">${esc(o.cats.join(' e '))} · ${pc(o.itens)} ${o.itens > 1 ? 'itens' : 'item'}</span>
        <span class="det">${o.pc > 0 ? `${pc(o.pc)} chapas · ${m3(o.m3)} m³` : 'sem saldo'}</span><span class="ok" aria-hidden="true">✓</span></button>`).join('')}${podeLancar() ? '<button class="cartao novo" id="c-novo"><span class="nome">+ Nova dimensão</span><span class="det">Chapa produzida que ainda não tem cadastro</span></button>' : ''}</div>`
      : '<div class="msg">Nenhuma dimensão cadastrada para esta bitola.</div>');
  } else {
    corpo = '<div id="c-res"><div class="vazio">Consultando estoque…</div></div>';
  }

  $('#main').innerHTML = cabecalho('Consultar estoque', 'Escolha a espécie, a bitola e a dimensão para ver o saldo.') + `
    <nav class="passos" aria-label="Etapas da consulta">${passos}</nav>
    ${aviso ? `<div class="msg" style="margin-bottom:14px">${esc(aviso)}</div>` : ''}
    <div class="trilha" aria-label="Caminho">${trilha}</div>
    ${corpo}
    <div class="rodape-passo">
      <button class="btn lg" id="c-voltar" ${e === 1 ? 'disabled' : ''}>Voltar</button>
      <span style="flex:1"></span>
      ${C.especie ? '<button class="btn lg ghost" id="c-nova">Nova consulta</button>' : ''}
      ${e < 4 ? `<button class="btn lg pri" id="c-avancar" ${podeAvancar ? '' : 'disabled'}>Avançar</button>` : ''}
    </div>`;
  atualizarLive();

  $$('.passo[data-ir]').forEach(b => b.addEventListener('click', () => irEtapa(+b.dataset.ir)));
  $('#c-voltar').addEventListener('click', () => irEtapa(e - 1));
  $('#c-nova')?.addEventListener('click', novaConsulta);
  $('#c-avancar')?.addEventListener('click', () => irEtapa(e + 1));
  $('#c-novo')?.addEventListener('click', () => cadastroRapido({ especie_id: C.especie, espessura: e === 3 ? C.espessura : null, aoCriar: p => {
    if (!p) return;
    Object.assign(C, { especie: p.especie_id, espessura: Number(p.espessura_mm), dim: dimKey(p) });
    modal(`<h3>Chapa cadastrada</h3><p><span class="cod">${esc(p.codigo)}</span> — ${esc(p.descricao)} ${esc(qualidade(p))}</p><p class="muted">Quer lançar a produção desta chapa agora?</p>
      <div class="acoes"><button class="btn" data-fechar id="cn-ver">Ver no estoque</button><button class="btn in lg" id="cn-ent">Lançar entrada</button></div>`, {
      onMount: (el, close) => {
        $('#cn-ver', el).addEventListener('click', () => irEtapa(4));
        $('#cn-ent', el).addEventListener('click', () => {
          close(); const R = S.rascunhos.ENTRADA ||= novoRascunho('ENTRADA');
          if (!R.linhas.some(l => l.produto_id === p.id)) R.linhas.push({ produto_id: p.id, quantidade: 1 });
          location.hash = '#/entrada'; toast('Chapa adicionada à entrada. Ajuste a quantidade de chapas e registre.');
        });
      }
    });
  } }));
  $$('.cartao[data-v]').forEach(b => {
    const escolher = () => {
      const v = b.dataset.v;
      if (e === 1 && +v !== C.especie) Object.assign(C, { especie: +v, espessura: null, dim: null });
      if (e === 2 && +v !== C.espessura) Object.assign(C, { espessura: +v, dim: null });
      if (e === 3) C.dim = v;
      $$('.cartao[data-v]').forEach(x => { x.classList.toggle('sel', x === b); x.setAttribute('aria-pressed', x === b); });
      const av = $('#c-avancar'); if (av) av.disabled = false;
      $$('.passo .t small').forEach((s, i) => { if (i === e - 1) s.textContent = b.querySelector('.nome').textContent; });
    };
    b.addEventListener('click', escolher);
    b.addEventListener('dblclick', () => { escolher(); irEtapa(e + 1); });
  });
  if (e === 4) desenharResultado({ ...C });
}

async function desenharResultado(C) {
  const prods = produtosDaConsulta(C);
  const box = $('#c-res');
  if (!prods.length) {
    box.innerHTML = `<div class="msg">Não há produto cadastrado para esta combinação. Escolha outra dimensão ou cadastre o produto em Cadastros › Produtos.</div>`;
    return;
  }
  const tok = S._tokConsulta = (S._tokConsulta || 0) + 1;
  const ids = prods.map(p => p.id);
  const [rs, rr] = await Promise.all([
    sb.from('saldos').select('produto_id,local_id,quantidade').in('produto_id', ids),
    sb.from('reservas').select('produto_id,local_id,quantidade,consumida,liberada').eq('status', 'ATIVA').in('produto_id', ids)]);
  if (tok !== S._tokConsulta || !$('#c-res')) return;
  const error = rs.error || rr.error, data = rs.data;
  if (error) { $('#c-res').innerHTML = `<div class="msg erro">${esc(erroTexto(error))}</div>`; return; }
  const resDe = (pid, loc) => rr.data.filter(x => x.produto_id === pid && x.local_id === loc).reduce((a, x) => a + x.quantidade - x.consumida - x.liberada, 0);
  const locNome = id => S.ref.locais.find(l => l.id === id)?.nome || 'Sem localização';
  const grupos = prods.map(p => {
    const pos = data.filter(s => s.produto_id === p.id).sort((a, b) => a.local_id - b.local_id);
    const posicoes = (pos.length ? pos : [{ local_id: null, quantidade: 0 }]).map(s => ({ ...s, reservado: s.local_id ? resDe(p.id, s.local_id) : 0 }));
    const total = posicoes.reduce((a, s) => a + s.quantidade, 0), reservado = posicoes.reduce((a, s) => a + s.reservado, 0);
    return { p, posicoes, total, reservado, disponivel: total - reservado };
  });
  const totPc = grupos.reduce((a, g) => a + g.total, 0), totRes = grupos.reduce((a, g) => a + g.reservado, 0), totDisp = totPc - totRes;
  const totM3 = grupos.reduce((a, g) => a + g.disponivel * Number(g.p.m3_peca), 0);
  const nLocais = new Set(grupos.flatMap(g => g.posicoes.filter(s => s.quantidade !== 0).map(s => s.local_id))).size;
  const semEstoque = totDisp <= 0;
  const qtd = n => `<span class="${n < 0 ? 'neg' : n === 0 ? 'muted' : ''}">${pc(n)}</span>`;
  const celulasProd = p => `<td class="cod">${esc(p.codigo)}</td><td class="desc">${esc(p.descricao)} <span class="muted">${esc(qualidade(p))}</span></td>
    <td>${esc(p.especie)}</td><td class="r num">${bitolaTexto(p.espessura_mm)}</td><td class="r num">${nfI.format(mmDe(p.comprimento_m))} mm</td><td class="r num">${nfI.format(mmDe(p.largura_m))} mm</td>`;
  const linhas = grupos.map(g => {
    if (g.posicoes.length === 1) {
      const s = g.posicoes[0];
      return `<tr class="click" data-p="${g.p.id}">${celulasProd(g.p)}<td>${esc(s.local_id ? locNome(s.local_id) : '—')}</td><td class="r num">${qtd(s.quantidade - s.reservado)}</td><td>chapas</td>
        <td class="r num">${s.reservado ? pc(s.reservado) : '<span class="muted">—</span>'}</td><td class="r num"><b>${qtd(s.quantidade)}</b></td></tr>`;
    }
    return `<tr class="consol click" data-p="${g.p.id}">${celulasProd(g.p)}<td>Consolidado (${g.posicoes.length} locais)</td><td class="r num">${qtd(g.disponivel)}</td><td>chapas</td>
        <td class="r num">${g.reservado ? pc(g.reservado) : '<span class="muted">—</span>'}</td><td class="r num"><b>${qtd(g.total)}</b></td></tr>`
      + g.posicoes.map(s => `<tr class="sub"><td colspan="6"></td><td>↳ ${esc(locNome(s.local_id))}</td><td class="r num">${qtd(s.quantidade - s.reservado)}</td><td>chapas</td><td class="r num">${s.reservado ? pc(s.reservado) : '<span class="muted">—</span>'}</td><td class="r num">${qtd(s.quantidade)}</td></tr>`).join('');
  }).join('');
  const cartoes = grupos.map(g => `<div class="res-card">
      <div class="topo-card"><span class="cod">${esc(g.p.codigo)}</span><b class="num">${qtd(g.disponivel)} chapas</b></div>
      ${g.reservado ? `<div class="muted">${pc(g.total)} no estoque · ${pc(g.reservado)} reservadas</div>` : ''}
      <div>${esc(g.p.descricao)} <span class="muted">${esc(qualidade(g.p))}</span></div>
      ${g.posicoes.map(s => `<div class="pos"><span>${esc(s.local_id ? locNome(s.local_id) : 'Sem localização')}</span><span class="num">${qtd(s.quantidade)} chapas · ${m3(s.quantidade * g.p.m3_peca)} m³</span></div>`).join('')}
      ${g.posicoes.length > 1 ? `<div class="pos tot"><span>Total consolidado</span><span class="num">${qtd(g.total)} chapas</span></div>` : ''}
      ${podeLancar() ? `<div class="acao"><button class="btn sm" data-reservar="${g.p.id}">Reservar</button></div>` : ''}
    </div>`).join('');

  $('#c-res').innerHTML = `
    ${semEstoque ? `<div class="sem-estoque">NÃO EXISTE ESTOQUE DISPONÍVEL PARA ESTA COMBINAÇÃO.<small>${prods.length > 1 ? `Os ${prods.length} produtos abaixo estão cadastrados` : 'O produto abaixo está cadastrado'}, mas sem saldo.</small></div>`
      : `<div class="res-kpis"><div class="kpi estoque"><div class="v num">${pc(totDisp)}<small>chapas</small></div><div class="l">Disponível nesta combinação${totRes ? ` · ${pc(totRes)} reservadas` : ''}</div></div>
         <div class="kpi"><div class="v num">${m3(totM3)}<small>m³</small></div><div class="l">Volume disponível</div></div>
         <div class="kpi"><div class="v num">${pc(prods.length)}<small>${prods.length > 1 ? 'itens' : 'item'}</small></div><div class="l">em ${nLocais} ${nLocais === 1 ? 'localização' : 'localizações'}</div></div></div>`}
    <div class="tw res-tabela"><table><thead><tr><th>Código</th><th>Descrição</th><th>Espécie</th><th class="r">Bitola</th><th class="r">Compr.</th><th class="r">Largura</th>
      <th>Localização</th><th class="r">Disponível</th><th>Unid.</th><th class="r">Reservado</th><th class="r">Total</th></tr></thead>
      <tbody>${linhas}</tbody>
      <tfoot><tr><td colspan="7">${pc(prods.length)} ${prods.length > 1 ? 'itens' : 'item'}</td><td class="r num">${qtd(totDisp)}</td><td>chapas</td><td class="r num">${pc(totRes)}</td><td class="r num">${qtd(totPc)}</td></tr></tfoot></table></div>
    <div class="res-cartoes">${cartoes}</div>
    <p class="muted" style="font-size:13px;margin-top:10px">Disponível = total − reservado. Clique em um item para ver as movimentações ou reservar.</p>`;
  $$('#c-res [data-p]').forEach(tr => tr.addEventListener('click', () => detalheProduto(+tr.dataset.p)));
  $$('#c-res [data-reservar]').forEach(b => b.addEventListener('click', () => reservarProduto(S.estoqueMap.get(+b.dataset.reservar))));
}

/* =====================================================================
   SELETOR DE PRODUTO (usado nos modais) e CADASTRO RÁPIDO DE CHAPA
   ===================================================================== */
function seletorProduto(box, { onEscolher, placeholder = 'Buscar chapa: código, bitola, espécie… ex.: 18 pinus 2,2', permitirNovo = podeLancar(), novoPadrao = {} } = {}) {
  box.innerHTML = `<div class="picker"><input class="inp" autocomplete="off" placeholder="${esc(placeholder)}"><div class="lista hidden" role="listbox"></div></div>`;
  const inp = $('input', box), lista = $('.lista', box);
  let ops = [], cur = 0;
  const escolher = p => { inp.value = ''; lista.classList.add('hidden'); onEscolher(p); };
  const desenhar = () => {
    const toks = norm(inp.value).split(/\s+/).filter(Boolean);
    ops = toks.length ? S.estoque.filter(p => p.ativo && toks.every(t => p._busca.includes(t))).slice(0, 30) : [];
    cur = 0;
    lista.classList.toggle('hidden', !toks.length);
    lista.innerHTML = ops.map((p, i) => `<div class="op ${i === 0 ? 'sel' : ''}" data-i="${i}"><span class="cod">${esc(p.codigo)}</span><span class="d">${esc(p.descricao)}</span>
        <span class="q num"><b>${pc(p.saldo)}</b> chapas</span><span class="x">${esc(qualidade(p))}</span></div>`).join('')
      + (ops.length ? '' : '<div class="vazio" style="padding:14px">Nenhuma chapa encontrada.</div>')
      + (permitirNovo ? '<div class="op novo" data-novo="1"><span class="cod">+</span><span class="d"><b>Chapa sem cadastro?</b> Cadastrar agora</span></div>' : '');
    $$('.op[data-i]', lista).forEach(o => o.addEventListener('mousedown', e => { e.preventDefault(); escolher(ops[+o.dataset.i]); }));
    $('.op[data-novo]', lista)?.addEventListener('mousedown', e => { e.preventDefault(); lista.classList.add('hidden'); cadastroRapido({ ...novoPadrao, aoCriar: escolher }); });
  };
  inp.addEventListener('input', desenhar);
  inp.addEventListener('blur', () => setTimeout(() => lista.classList.add('hidden'), 150));
  inp.addEventListener('keydown', e => {
    if (lista.classList.contains('hidden') || !ops.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); cur = (cur + (e.key === 'ArrowDown' ? 1 : -1) + ops.length) % ops.length;
      $$('.op[data-i]', lista).forEach((o, i) => o.classList.toggle('sel', i === cur));
    }
    if (e.key === 'Enter') { e.preventDefault(); escolher(ops[cur]); }
  });
  return inp;
}

function cadastroRapido({ especie_id = null, espessura = null, aoCriar } = {}) {
  if (!podeLancar()) return;
  const opt = (lista, val, vazio) => `${vazio != null ? `<option value="">${vazio}</option>` : ''}${lista.filter(x => x.ativo).map(x => `<option value="${x.id}" ${x.id === val ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}`;
  modal(`<h3>Cadastrar chapa nova</h3>
    <p class="muted" style="margin:-6px 0 14px">Use quando a produção trouxer uma bitola ou dimensão que ainda não existe no estoque.${ehAdmin() ? '' : ' O administrador revisa o cadastro depois.'}</p>
    <form id="f-cr" class="grid">
      <div class="grid g2">
        <label class="campo"><span>Tipo</span><select class="inp" name="categoria">${opt(S.ref.categorias, S.ref.categorias.find(c => c.ativo)?.id)}</select></label>
        <label class="campo"><span>Espécie</span><select class="inp" name="especie">${opt(S.ref.especies, especie_id)}</select></label>
      </div>
      <div class="grid g3">
        <label class="campo"><span>Bitola (mm)</span><input class="inp num" name="bitola" type="number" step="0.1" min="0.1" required value="${espessura ?? ''}" inputmode="decimal"></label>
        <label class="campo"><span>Comprimento (mm)</span><input class="inp num" name="comp" type="number" step="1" min="1" required placeholder="ex.: 2440" inputmode="numeric"></label>
        <label class="campo"><span>Largura (mm)</span><input class="inp num" name="larg" type="number" step="1" min="1" required placeholder="ex.: 1220" inputmode="numeric"></label>
      </div>
      <div class="grid g3">
        <label class="campo"><span>Classificação</span><select class="inp" name="classif">${opt(S.ref.classificacoes, null, 'Sem classificação')}</select></label>
        <label class="campo"><span>Acabamento / linha</span><select class="inp" name="acab">${opt(S.ref.acabamentos, null, 'Nenhum')}</select></label>
        <label class="campo"><span>Camadas (opcional)</span><input class="inp" name="camadas" type="number" step="1" min="1" inputmode="numeric"></label>
      </div>
      <div id="cr-prev" class="muted" style="min-height:22px"></div>
      <div class="acoes"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn pri" id="cr-ok">Cadastrar chapa</button></div>
    </form>`, {
    wide: true, onMount: (el, close) => {
      const f = $('#f-cr', el);
      const ler = () => ({ cat: +f.categoria.value, esp: +f.especie.value, bit: Number(f.bitola.value), comp: Number(f.comp.value), larg: Number(f.larg.value),
        cl: f.classif.value ? +f.classif.value : null, ac: f.acab.value ? +f.acab.value : null, cam: f.camadas.value ? +f.camadas.value : null });
      const existente = v => S.estoque.find(p => p.categoria_id === v.cat && p.especie_id === v.esp && Number(p.espessura_mm) === v.bit
        && mmDe(p.comprimento_m) === v.comp && mmDe(p.largura_m) === v.larg && (p.camadas ?? null) === v.cam
        && (p.classificacao_id ?? null) === v.cl && (p.acabamento_id ?? null) === v.ac);
      const prev = () => {
        const v = ler();
        if (!(v.bit > 0 && v.comp > 0 && v.larg > 0)) { $('#cr-prev', el).textContent = ''; return; }
        const ex = existente(v);
        $('#cr-prev', el).innerHTML = ex ? `<span class="tag aj">Já cadastrada</span> <span class="cod">${esc(ex.codigo)}</span> — ${esc(ex.descricao)}${qualidade(ex) !== '—' ? ' ' + esc(qualidade(ex)) : ''}. Ela será usada.`
          : `Nova chapa: <b>${esc(bitolaTexto(v.bit))} · ${dimTexto(`${v.comp}x${v.larg}`)}</b> · ${(v.bit / 1000 * v.comp / 1000 * v.larg / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 5 })} m³ por chapa`;
        $('#cr-ok', el).textContent = ex ? 'Usar esta chapa' : 'Cadastrar chapa';
      };
      f.addEventListener('input', prev); f.addEventListener('change', prev); prev();
      f.addEventListener('submit', async e => {
        e.preventDefault();
        const v = ler();
        if (!(v.bit > 0 && v.bit <= 100)) return toast('Informe a bitola em milímetros.', 'erro');
        if (!(v.comp > 0 && v.comp <= 20000 && v.larg > 0 && v.larg <= 20000)) return toast('Informe comprimento e largura em milímetros (ex.: 2440 e 1220).', 'erro');
        const btn = $('#cr-ok', el); btn.disabled = true;
        const { data, error } = await sb.rpc('cadastrar_produto_rapido', { p_categoria_id: v.cat, p_especie_id: v.esp, p_espessura_mm: v.bit,
          p_comprimento_m: v.comp / 1000, p_largura_m: v.larg / 1000, p_camadas: v.cam, p_classificacao_id: v.cl, p_acabamento_id: v.ac });
        btn.disabled = false;
        if (error) return toast(erroTexto(error), 'erro');
        await carregarEstoque();
        const p = S.estoqueMap.get(data.id);
        close();
        toast(data.existente ? `A chapa ${data.codigo} já existia e foi selecionada.` : `Chapa ${data.codigo} cadastrada${ehAdmin() ? '' : ' — o administrador vai revisar'}.`, 'ok');
        aoCriar?.(p);
      });
    }
  });
}

/* =====================================================================
   RESERVAS
   ===================================================================== */
function reservarProduto(p) {
  if (!podeLancar()) return;
  const livre = Math.max(p.disponivel, 0);
  modal(`<h3>Reservar <span class="cod">${esc(p.codigo)}</span></h3>
    <p class="muted" style="margin:-6px 0 14px">${esc(p.descricao)} ${esc(qualidade(p))}</p>
    <div class="trio"><div><small>Saldo</small><b class="num">${pc(p.saldo)} chapas</b></div><div><small>Já reservado</small><b class="num">${pc(p.reservado)} chapas</b></div><div><small>Livre para reservar</small><b class="num">${pc(livre)} chapas</b></div></div>
    <form id="f-res" class="grid">
      <div class="grid g2">
        <label class="campo"><span>Quantidade a reservar (chapas)</span><input class="inp qtd-inp" name="qtd" type="number" min="1" max="${livre}" step="1" required inputmode="numeric"></label>

        ${g.itens.map(i => `<tr><td class="cod">${esc(i.codigo)}</td><td class="desc">${esc(i.descricao)} <span class="muted">${esc([i.classificacao, i.acabamento].filter(Boolean).join(' '))}</span></td>

        $$('[data-rm]', el).forEach(b => b.addEventListener('click', () => { st.saidas.splice(+b.dataset.rm, 1); desenhar(); }));
        resumo();
      };
      seletorProduto($('#c-sel', el), {
        placeholder: 'Buscar a chapa resultante… ex.: 18 pinus 2,2',
        novoPadrao: { especie_id: S.estoqueMap.get(i.produto_id)?.especie_id, espessura: Number(S.estoqueMap.get(i.produto_id)?.espessura_mm) || null },
        onEscolher: p => {
          if (!st.saidas.some(s => s.id === p.id)) st.saidas.push({ id: p.id, q: Math.max((Number(f.proc.value) || 0) - (Number(f.perda.value) || 0), 1) });

        if (!Number.isInteger(perda) || perda < 0 || perda > proc) return toast('A perda não pode ser maior que as chapas processadas.', 'erro');
        if (!st.saidas.length && perda < proc) return toast('Adicione o produto resultante, ou informe a perda igual às chapas processadas.', 'erro');
        const btn = $('#c-ok', el); btn.disabled = true; btn.textContent = 'Gravando…';
        const { data, error } = await sb.rpc('concluir_processo', { p_id: st.id, p_item_id: i.id, p_processado: proc, p_perda: perda,
          p_saidas: st.saidas.map(s => ({ produto_id: s.id, quantidade: s.q })), p_data: f.data.value || hojeISO(), p_observacao: f.obs.value.trim() || null });
        btn.disabled = false; btn.textContent = 'Concluir e lançar resultado';
        if (error) return toast(erroTexto(error), 'erro');

        toast(data.duplicado ? 'Esta conclusão já estava gravada; nada foi duplicado.'
          : `Pendência nº ${data.processo}: ${pc(proc)} chapas concluídas${data.entrada ? `, entrada nº ${data.entrada.numero} lançada` : ''}.${data.restam ? ` Restam ${pc(data.restam)} chapas.` : ' Pendência encerrada.'}`, 'ok');
        await carregarEstoque(); atualizarPendencias(); renderPendencias();
      });
    }
  });
}

/* =====================================================================
   APONTAMENTO DE PRODUÇÃO — utilitários
   ===================================================================== */
const setorPorId = id => S.ref.setores_producao.find(s => s.id === id);
const formsDoSetor = id => S.ref.formularios_producao.filter(f => f.setor_id === id && f.ativo).sort((a, b) => a.ordem - b.ordem);
const recursosDoSetor = id => S.ref.recursos_producao.filter(r => r.setor_id === id && r.ativo).sort((a, b) => a.ordem - b.ordem);
const setoresAtivos = () => S.ref.setores_producao.filter(s => s.ativo).sort((a, b) => a.ordem - b.ordem);
const nf2 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const numBR = n => (Number(n) || 0).toLocaleString('pt-BR', { maximumFractionDigits: 3 });
const pct = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'percent', maximumFractionDigits: 0 });
const TURNOS = { 1: '1º turno', 2: '2º turno', 3: '3º turno' };
// valor de um apontamento na unidade do setor
const valorDe = (a, setor) => Number((setor?.unidade === 'm³' ? a.m3 : a.quantidade) ?? 0);
function medidaTexto(d) {
  if (!d?.comprimento_m) return '';
  return `${numBR(d.comprimento_m)} x ${numBR(d.largura_m)} m · ${numBR(d.espessura_mm)} mm`;
}
// resumo curto de um lançamento, para listas
function resumoApontamento(a) {
  const d = a.dados || {};
  const p = [];
  if (a.recurso) p.push(a.recurso);
  if (a.turno) p.push(TURNOS[a.turno]);
  if (a.especie) p.push(a.especie);
  if (d.insumo) p.push(d.insumo);
  if (d.tipo_cola) p.push(d.tipo_cola);
  if (d.origem) p.push(d.origem);
  if (d.qualidade) p.push(d.qualidade);
  if (d.classe) p.push(d.classe);
  if (d.fornecedor) p.push(d.fornecedor);
  if (d.comprimento_m) p.push(medidaTexto(d));
  return p.join(' · ');
}
function valorTexto(a) {
  const u = a.unidade, out = [];
  if (a.m3 != null) out.push(`${m3(a.m3)} m³`);
  if (a.quantidade != null && !(a.m3 != null && u === 'm³' && a.quantidade == null)) {
    const uq = a.formulario_codigo === 'GRAMATURA' ? 'g/m²' : a.setor_codigo === 'PREP_COLA' || a.formulario_codigo === 'BATIDA' ? 'kg' : u === 'm³' ? 'pç' : u;
    out.push(`${numBR(a.quantidade)} ${uq}`);
  }
  if (a.m3 == null && a.quantidade == null && a.dados?.m3_tora) out.push(`${m3(a.dados.m3_tora)} m³ de tora`);
  return out.join(' · ') || '—';
}

/* =====================================================================
   APONTAR — escolha do setor e formulário (pensado para celular/tablet)
   ===================================================================== */
function renderApontar() {
  const q = new URLSearchParams(location.hash.split('?')[1] || '');
  const fid = +q.get('f') || null;
  if (fid) { const f = S.ref.formularios_producao.find(x => x.id === fid); if (f) return formApontamento(f); }

  if (sid) {
    const fs = formsDoSetor(sid);
    if (fs.length === 1) return formApontamento(fs[0]);
    if (fs.length) return escolherFormulario(setorPorId(sid), fs);
  }
  const setores = setoresAtivos();
  $('#main').innerHTML = cabecalho('Apontar produção', 'Escolha o setor em que você vai lançar.') + `
    <div class="cards setores">${setores.map(s => {
      const fs = formsDoSetor(s.id), nf = fs.length;
      // sem repetir o nome do setor quando o formulário se chama igual
      const det = nf > 1 ? `${nf} tipos de apontamento`
        : norm(fs[0]?.nome || '') === norm(s.nome) ? `Medido em ${esc(s.unidade || '')}`.trim()
        : esc(fs[0]?.nome || '');
      return `<a class="cartao setor" href="#/apontar?s=${s.id}">
        <span class="nome">${esc(s.nome)}</span>

    <div class="painel" style="margin-top:18px"><h3>Seus lançamentos de hoje</h3><div id="ap-hoje"><div class="muted">Carregando…</div></div></div>`;
  atualizarLive();
  listaDoDia($('#ap-hoje'), { usuario: S.perfil.id });
}
function escolherFormulario(setor, fs) {
  $('#main').innerHTML = cabecalho(setor.nome, 'O que você vai apontar?',
    '<a class="btn" href="#/apontar">Trocar de setor</a>') + `
    <div class="cards">${fs.map(f => `<a class="cartao" href="#/apontar?f=${f.id}">
      <span class="nome" style="font-size:22px">${esc(f.nome)}</span>
      <span class="det">${esc(f.descricao || '')}</span></a>`).join('')}</div>`;
  atualizarLive();
}

/* =====================================================================
   APONTAR — formulário gerado a partir da definição do banco
   ===================================================================== */
function campoHTML(c, setorId, valor) {
  const id = 'c-' + c.chave;
  const v = valor == null ? '' : valor;
  const lab = `<span>${esc(c.rotulo)}${c.obrigatorio ? '' : ' <i class="opc">opcional</i>'}</span>`;
  const suf = c.sufixo ? `<i class="suf">${esc(c.sufixo)}</i>` : '';
  if (c.tipo === 'turno') return `<div class="campo"><span>${esc(c.rotulo)}</span>
    <div class="seg grande" data-campo="${c.chave}">${[1, 2, 3].map(t => `<button type="button" data-v="${t}" class="${String(v) === String(t) ? 'on' : ''}">${t}º</button>`).join('')}</div></div>`;
  if (c.tipo === 'especie') {
    const lista = S.ref.especies.filter(e => e.ativo);
    return `<div class="campo">${lab}<div class="seg grande" data-campo="${c.chave}">${lista.map(e => `<button type="button" data-v="${e.id}" class="${String(v) === String(e.id) ? 'on' : ''}">${esc(e.nome)}</button>`).join('')}</div></div>`;
  }
  if (c.tipo === 'recurso') {
    const lista = recursosDoSetor(setorId);
    return `<div class="campo">${lab}<div class="seg grande" data-campo="${c.chave}">${lista.map(r => `<button type="button" data-v="${r.id}" class="${String(v) === String(r.id) ? 'on' : ''}">${esc(r.nome)}</button>`).join('')}</div></div>`;
  }
  if (c.tipo === 'lista') {
    const op = c.opcoes || [];
    if (op.length <= 4) return `<div class="campo">${lab}<div class="seg grande" data-campo="${c.chave}">${op.map(o => `<button type="button" data-v="${esc(o)}" class="${v === o ? 'on' : ''}">${esc(o)}</button>`).join('')}</div></div>`;
    return `<label class="campo">${lab}<select class="inp" id="${id}" name="${c.chave}"><option value="">Escolha…</option>${op.map(o => `<option ${v === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`;
  }
  if (c.tipo === 'hora') return `<label class="campo">${lab}<input class="inp" type="time" id="${id}" name="${c.chave}" value="${esc(String(v).slice(0, 5))}"></label>`;
  if (c.tipo === 'texto') return `<label class="campo">${lab}<input class="inp" type="text" maxlength="200" id="${id}" name="${c.chave}" value="${esc(v)}" placeholder="${esc(c.ajuda || '')}"></label>`;
  return `<label class="campo num-campo">${lab}<span class="num-box"><input class="inp qtd-inp" type="number" inputmode="decimal" step="${c.tipo === 'inteiro' ? '1' : 'any'}" min="0" id="${id}" name="${c.chave}" value="${esc(v)}">${suf}</span></label>`;
}
function formApontamento(form, editando) {
  const setor = setorPorId(form.setor_id);
  const campos = form.campos || [];
  const base = campos.filter(c => !c.grupo), extras = campos.filter(c => c.grupo);
  const grupo = extras[0]?.grupo;
  const vals = editando ? valoresDe(editando, campos) : {};
  const voltar = editando ? '' : formsDoSetor(setor.id).length > 1 ? `<a class="btn" href="#/apontar?s=${setor.id}">Trocar tipo</a>` : '<a class="btn" href="#/apontar">Trocar de setor</a>';
  const corpo = `
    <form id="f-ap" class="grid ap-form">
      <div class="grid g2">
        <label class="campo"><span>Data</span><input class="inp" type="date" name="data" max="${hojeISO()}" value="${editando ? editando.data : hojeISO()}"></label>
        <div class="campo"><span>&nbsp;</span><div class="seg grande" id="ap-atalho"><button type="button" data-d="0">Hoje</button><button type="button" data-d="-1">Ontem</button></div></div>
      </div>
      ${base.map(c => campoHTML(c, setor.id, vals[c.chave])).join('')}
      ${extras.length ? `<details class="mais" ${extras.some(c => vals[c.chave] != null) ? 'open' : ''}><summary>${esc(grupo)}</summary><div class="grid g2" style="margin-top:12px">${extras.map(c => campoHTML(c, setor.id, vals[c.chave])).join('')}</div></details>` : ''}
      <label class="campo"><span>Observação <i class="opc">opcional</i></span><textarea class="inp" name="observacao" maxlength="300">${esc(editando?.observacao || '')}</textarea></label>
      <div id="ap-calc" class="calc hidden"></div>
      <div class="acoes-ap">
        <button class="btn lg pri" id="ap-ok" style="flex:1">${editando ? 'Salvar correção' : 'Registrar apontamento'}</button>
      </div>
    </form>`;
  if (editando) return { corpo, campos, form, setor, vals };

  $('#main').innerHTML = cabecalho(form.nome, `${setor.nome} — ${form.descricao || ''}`, voltar) + corpo + `
    <div class="painel" style="margin-top:18px"><h3>Lançado hoje neste setor</h3><div id="ap-hoje"><div class="muted">Carregando…</div></div></div>`;
  atualizarLive();
  ligarForm($('#f-ap'), { form, campos, setor, aoGravar: async valores => {
    const id = uuid();
    const { data, error } = await sb.rpc('registrar_apontamento', {
      p_id: id, p_formulario_id: form.id, p_data: valores.data, p_valores: valores.valores, p_observacao: valores.observacao || null });
    if (error) return { erro: erroTexto(error) };
    return { ok: data.duplicado ? 'Este apontamento já estava gravado; nada foi duplicado.'
      : `${form.nome} nº ${data.numero} registrado${data.m3 != null ? ` · ${m3(data.m3)} m³`
          : data.quantidade != null ? ` · ${numBR(data.quantidade)} ${setor.unidade || ''}`.trimEnd() : ''}.` };
  } });
  listaDoDia($('#ap-hoje'), { setor: setor.id });
}
// extrai os valores de um apontamento gravado de volta para o formulário
function valoresDe(a, campos) {
  const v = {};
  campos.forEach(c => {
    const k = c.chave;
    v[k] = ['quantidade', 'm3', 'horas', 'turno', 'especie_id', 'recurso_id'].includes(k) ? a[k]
      : k === 'hora' ? (a.hora || '') : (a.dados || {})[k];
  });
  return v;
}
function ligarForm(f, { form, campos, setor, aoGravar }) {
  const seg = {};
  $$('.seg[data-campo]', f).forEach(d => {
    const on = $('button.on', d); seg[d.dataset.campo] = on ? on.dataset.v : null;
    $$('button', d).forEach(b => b.addEventListener('click', () => {
      seg[d.dataset.campo] = seg[d.dataset.campo] === b.dataset.v ? null : b.dataset.v;
      $$('button', d).forEach(x => x.classList.toggle('on', x.dataset.v === seg[d.dataset.campo]));
      calcular();
    }));
  });
  const marcarAtalho = () => $$('#ap-atalho button').forEach(b => b.classList.toggle('on', hojeISO(+b.dataset.d) === f.data.value));
  $$('#ap-atalho button').forEach(b => b.addEventListener('click', () => { f.data.value = hojeISO(+b.dataset.d); marcarAtalho(); }));
  f.data.addEventListener('change', marcarAtalho); marcarAtalho();

  const lerValores = () => {
    const v = {};
    campos.forEach(c => {
      if (['turno', 'especie', 'recurso'].includes(c.tipo) || (c.tipo === 'lista' && (c.opcoes || []).length <= 4)) {
        if (seg[c.chave] != null) v[c.chave] = ['turno', 'especie', 'recurso'].includes(c.tipo) ? Number(seg[c.chave]) : seg[c.chave];
      } else {
        const el = f.elements[c.chave];
        if (el && String(el.value).trim() !== '') v[c.chave] = c.tipo === 'numero' || c.tipo === 'inteiro' ? Number(el.value) : el.value;
      }
    });
    return v;
  };
  function calcular() {
    const v = lerValores(), box = $('#ap-calc', f);
    if (!box) return;
    const partes = [];
    if (form.calcula_m3 && v.quantidade > 0 && v.comprimento_m > 0 && v.largura_m > 0 && v.espessura_mm > 0) {
      partes.push(`Volume: <b class="num">${m3(v.quantidade * v.espessura_mm / 1000 * v.comprimento_m * v.largura_m)} m³</b>`);
    }
    if (form.codigo === 'BATIDA') {
      const t = (v.resina_kg || 0) + (v.trigo_kg || 0) + (v.agua_kg || 0);
      if (t > 0) partes.push(`Total da batida: <b class="num">${numBR(t)} kg</b>`);
    }
    if (['q1', 'q2', 'q3'].some(k => v[k] != null)) {
      const soma = (v.q1 || 0) + (v.q2 || 0) + (v.q3 || 0);
      const falta = (v.quantidade || 0) - soma;
      partes.push(`Separado: <b class="num">${numBR(soma)}</b> de ${numBR(v.quantidade || 0)} chapas${falta < 0 ? ' <b class="neg">— passou do total</b>' : falta > 0 ? ` · faltam ${numBR(falta)}` : ''}`);
    }
    box.classList.toggle('hidden', !partes.length);
    box.innerHTML = partes.join(' &nbsp;·&nbsp; ');
  }
  f.addEventListener('input', calcular); calcular();

  f.addEventListener('submit', async e => {
    e.preventDefault();
    const v = lerValores();
    const falta = campos.find(c => c.obrigatorio && (v[c.chave] == null || v[c.chave] === ''));
    if (falta) return toast(`Informe ${falta.rotulo.toLowerCase()}.`, 'erro');
    const btn = $('#ap-ok', f) || $('button.pri', f); const txt = btn.textContent;
    btn.disabled = true; btn.textContent = 'Gravando…';
    const res = await aoGravar({ data: f.data.value, valores: v, observacao: f.observacao.value.trim() });
    btn.disabled = false; btn.textContent = txt;
    if (res.erro) return toast(res.erro, 'erro');
    toast(res.ok, 'ok');
    if (res.fechar) return;
    // limpa para o próximo lançamento, mantendo data, turno, mesa e espécie
    const manter = ['turno', 'recurso_id', 'especie_id', 'insumo', 'tipo_cola'];
    campos.forEach(c => {
      if (manter.includes(c.chave)) return;
      if (seg[c.chave] !== undefined) { seg[c.chave] = null; $$(`.seg[data-campo="${c.chave}"] button`, f).forEach(x => x.classList.remove('on')); }
      const el = f.elements[c.chave]; if (el && el.type !== 'date') el.value = '';
    });
    f.observacao.value = ''; calcular();
    const alvo = campos.find(c => c.obrigatorio && !['turno', 'especie', 'recurso'].includes(c.tipo));
    if (alvo) f.elements[alvo.chave]?.focus();
    listaDoDia($('#ap-hoje'), { setor: setor.id });
  });
}

/* =====================================================================
   Lista do dia (abaixo do formulário) e correções
   ===================================================================== */
async function listaDoDia(box, { setor, usuario } = {}) {
  if (!box) return;
  if (setor) box.dataset.setor = setor; else delete box.dataset.setor;
  let q = sb.from('vw_apontamentos').select('*').eq('data', hojeISO()).eq('cancelado', false)
    .order('criado_em', { ascending: false }).limit(60);
  if (setor) q = q.eq('setor_id', setor);
  if (usuario) q = q.eq('usuario_id', usuario);
  const { data, error } = await q;
  if (!box.isConnected) return;
  if (error) return box.innerHTML = `<div class="msg erro">${esc(erroTexto(error))}</div>`;
  box.innerHTML = data.length ? `<div class="lista-ap">${data.map(a => `
    <div class="item-ap"><div>
      <b>${esc(setor ? a.formulario : a.setor)}</b> <span class="muted">${esc(resumoApontamento(a))}</span>
      <div class="muted" style="font-size:12.5px">nº ${a.numero} · ${esc(a.usuario_nome)} · ${horaBR(a.criado_em).slice(-5)}${a.edicoes ? ' · corrigido' : ''}</div>
    </div>
    <div style="text-align:right;white-space:nowrap"><b class="num">${valorTexto(a)}</b>
      ${podeCorrigir(a) ? `<div><button class="btn sm ghost" data-ed="${a.id}">Corrigir</button><button class="btn sm ghost" data-ca="${a.id}">Cancelar</button></div>` : ''}
    </div></div>`).join('')}</div>`
    : '<div class="muted">Nada lançado hoje ainda.</div>';
  $$('[data-ed]', box).forEach(b => b.addEventListener('click', () => corrigirApontamento(data.find(a => a.id === b.dataset.ed))));
  $$('[data-ca]', box).forEach(b => b.addEventListener('click', () => cancelarApontamento(data.find(a => a.id === b.dataset.ca))));
}
function podeCorrigir(a) {
  if (a.cancelado || !podeApontar()) return false;
  if (ehAdmin()) return true;
  return a.usuario_id === S.perfil.id && String(a.criado_em).slice(0, 10) === hojeISO();
}
function corrigirApontamento(a) {
  const form = S.ref.formularios_producao.find(f => f.id === a.formulario_id);
  const pacote = formApontamento(form, a);
  modal(`<h3>Corrigir ${esc(form.nome)} nº ${a.numero}</h3>
    <p class="muted" style="margin:-6px 0 12px">${esc(a.setor)} · lançado por ${esc(a.usuario_nome)} em ${horaBR(a.criado_em)}</p>
    ${pacote.corpo}`, {
    wide: true, onMount: (el, close) => {
      const f = $('#f-ap', el);
      ligarForm(f, { ...pacote, aoGravar: async valores => {
        const { error } = await sb.rpc('editar_apontamento', {
          p_id: a.id, p_data: valores.data, p_valores: valores.valores, p_observacao: valores.observacao || null });
        if (error) return { erro: erroTexto(error) };
        close(); await recarregarProducao();
        return { ok: `Apontamento nº ${a.numero} corrigido.`, fechar: true };
      } });
    }
  });
}
function cancelarApontamento(a) {
  modal(`<h3>Cancelar apontamento nº ${a.numero}</h3>
    <p style="margin-top:-6px">${esc(a.setor)} — ${esc(a.formulario)}<br><span class="muted">${esc(resumoApontamento(a))} · ${valorTexto(a)}</span></p>
    <p class="muted">O lançamento continua no histórico, marcado como cancelado, e deixa de contar nos indicadores.</p>
    <label class="campo"><span>Motivo</span><textarea class="inp" id="ca-motivo" maxlength="300"></textarea></label>
    <div class="acoes"><button class="btn" data-fechar>Voltar</button><button class="btn out" id="ca-ok">Cancelar apontamento</button></div>`, {
    onMount: (el, close) => $('#ca-ok', el).addEventListener('click', async () => {
      const mot = $('#ca-motivo', el).value.trim();
      if (mot.length < 5) return toast('Escreva o motivo do cancelamento.', 'erro');
      const { error } = await sb.rpc('cancelar_apontamento', { p_id: a.id, p_motivo: mot });
      if (error) return toast(erroTexto(error), 'erro');
      close(); toast(`Apontamento nº ${a.numero} cancelado.`, 'ok'); await recarregarProducao();
    })
  });
}
async function recarregarProducao() {
  if (S.rota === 'apontar') { const b = $('#ap-hoje'); if (b) listaDoDia(b, b.dataset.setor ? { setor: +b.dataset.setor } : { usuario: S.perfil.id }); }
  if (['producao', 'lancamentos', 'conferencia'].includes(S.rota)) ROTAS[S.rota].render();
}

/* =====================================================================
   PAINEL DE PRODUÇÃO — metas e realizado
   ===================================================================== */
const periodoProd = { modo: 'mes' };
function faixaPeriodo() {
  const hoje = hojeISO();
  if (periodoProd.modo === 'hoje') return [hoje, hoje];
  if (periodoProd.modo === 'semana') return [hojeISO(-6), hoje];
  const d = new Date(); return [new Date(d.getFullYear(), d.getMonth(), 1).toLocaleDateString('sv-SE'), hoje];
}
async function renderPainelProducao() {
  const [de, ate] = faixaPeriodo();
  $('#main').innerHTML = cabecalho('Painel de produção', `De ${dataBR(de)} a ${dataBR(ate)}`, `
    <div class="seg" id="pp-periodo">
      <button data-v="hoje" class="${periodoProd.modo === 'hoje' ? 'on' : ''}">Hoje</button>
      <button data-v="semana" class="${periodoProd.modo === 'semana' ? 'on' : ''}">7 dias</button>
      <button data-v="mes" class="${periodoProd.modo === 'mes' ? 'on' : ''}">Mês</button>
    </div>`) + '<div id="pp-corpo"><div class="vazio">Carregando…</div></div>';
  atualizarLive();
  $$('#pp-periodo button').forEach(b => b.addEventListener('click', () => { periodoProd.modo = b.dataset.v; renderPainelProducao(); }));

  const [rs, rm] = await Promise.all([
    sb.rpc('resumo_producao', { p_de: de, p_ate: ate }),
    sb.rpc('resumo_recurso', { p_setor: setoresAtivos().find(s => s.codigo === 'MONTAGEM')?.id, p_de: de, p_ate: ate }),
  ]);
  if (S.rota !== 'producao' || !$('#pp-corpo')) return;
  if (rs.error) return $('#pp-corpo').innerHTML = `<div class="msg erro">${esc(erroTexto(rs.error))}</div>`;

  const porSetor = {};
  rs.data.forEach(l => {
    const o = porSetor[l.setor_id] ||= { ...l, m3: 0, quantidade: 0, meta: 0, lancamentos: 0, dias: 0, serie: [] };
    o.m3 += Number(l.m3); o.quantidade += Number(l.quantidade); o.meta += Number(l.meta || 0);
    o.lancamentos += Number(l.lancamentos); if (l.util) o.dias++;
    o.serie.push({ data: l.data, v: Number(l.campo_meta === 'quantidade' ? l.quantidade : l.m3), meta: Number(l.meta || 0), util: l.util });
  });
  const lista = Object.values(porSetor).sort((a, b) => a.ordem - b.ordem);
  // sem meta cadastrada, mede pela unidade natural do setor
  const campo = o => o.meta ? o.campo_meta : (o.unidade === 'm³' ? 'm3' : 'quantidade');
  const real = o => campo(o) === 'quantidade' ? o.quantidade : o.m3;
  const un = o => campo(o) === 'quantidade' ? o.unidade : 'm³';
  const extra = o => campo(o) === 'quantidade' && o.m3 ? ` · ${m3(o.m3)} m³` : '';

  $('#pp-corpo').innerHTML = `
    <div class="grid g3" style="margin-bottom:16px">
      ${['LAMINACAO', 'MONTAGEM', 'PRENSAGEM'].map(cod => {
        const o = lista.find(x => x.setor_codigo === cod); if (!o) return '';
        return `<div class="painel kpi-prod"><div class="l">${esc(o.setor)}</div>
          <div class="v num">${numBR(real(o))}<small>${esc(un(o))}</small></div>
          <div class="l">${o.meta ? `meta ${numBR(o.meta)} · ${pct(real(o) / o.meta)} atingido` : `${o.lancamentos} lançamentos${extra(o)}`}</div></div>`;
      }).join('')}
    </div>
    <div class="painel" style="margin-bottom:16px"><h3>Realizado contra a meta</h3>
      <div class="metas">${lista.map(o => {
        const v = real(o), p = o.meta ? v / o.meta : null;
        return `<div class="meta-linha ${p == null ? 'sem' : p >= 1 ? 'ok' : p >= 0.8 ? 'quase' : 'baixo'}">
          <span class="s">${esc(o.setor)}</span>
          <span class="t"><i style="width:${p == null ? 0 : Math.min(p, 1) * 100}%"></i>${p != null && p > 1 ? '<em>+</em>' : ''}</span>
          <span class="v num">${numBR(v)} <small>${esc(un(o))}</small></span>
          <span class="m num">${o.meta ? `${pct(p)} de ${numBR(o.meta)}` : `<span class="muted">sem meta${extra(o)}</span>`}</span>
        </div>`;
      }).join('')}</div>
      <p class="muted" style="font-size:13px;margin:12px 0 0">A meta considera só os dias úteis do período. Ajuste em Setores e metas.</p>
    </div>
    ${rm.data?.length ? `<div class="painel" style="margin-bottom:16px"><h3>Montagem por mesa</h3>
      <div class="metas">${Object.values(rm.data.reduce((acc, l) => {
        const o = acc[l.recurso_id] ||= { nome: l.recurso, v: 0, meta: 0 };
        o.v += Number(l.m3); o.meta += Number(l.meta || 0); return acc;
      }, {})).map(o => {
        const p = o.meta ? o.v / o.meta : null;
        return `<div class="meta-linha ${p == null ? 'sem' : p >= 1 ? 'ok' : p >= 0.8 ? 'quase' : 'baixo'}">
          <span class="s">${esc(o.nome)}</span><span class="t"><i style="width:${p == null ? 0 : Math.min(p, 1) * 100}%"></i></span>
          <span class="v num">${m3(o.v)} <small>m³</small></span>
          <span class="m num">${o.meta ? `${pct(p)} de ${numBR(o.meta)}` : '<span class="muted">sem meta</span>'}</span></div>`;
      }).join('')}</div></div>` : ''}
    <div class="painel"><h3>Dia a dia</h3><div class="tw" style="max-height:60vh">${tabelaDiaria(rs.data)}</div></div>`;
}
function tabelaDiaria(linhas) {
  const setores = [...new Map(linhas.map(l => [l.setor_id, l])).values()].sort((a, b) => a.ordem - b.ordem);
  const dias = [...new Set(linhas.map(l => l.data))].sort().reverse();
  const mapa = {}; linhas.forEach(l => mapa[`${l.data}|${l.setor_id}`] = l);
  const comDado = dias.filter(d => setores.some(s => Number(mapa[`${d}|${s.setor_id}`]?.lancamentos || 0) > 0));
  if (!comDado.length) return '<div class="vazio">Nenhum apontamento neste período.</div>';
  return `<table class="larga"><thead><tr><th>Data</th>${setores.map(s => `<th class="r">${esc(s.setor)}<small class="muted" style="display:block;font-weight:500">${esc((s.meta ? s.campo_meta : (s.unidade === 'm³' ? 'm3' : 'quantidade')) === 'quantidade' ? s.unidade : 'm³')}</small></th>`).join('')}</tr></thead><tbody>
    ${comDado.map(d => `<tr><td>${dataBR(d)}${dia_util_txt(mapa, d, setores)}</td>${setores.map(s => {
      const l = mapa[`${d}|${s.setor_id}`];
      const q = l && (l.meta ? l.campo_meta : (l.unidade === 'm³' ? 'm3' : 'quantidade'));
      const v = Number(q === 'quantidade' ? l?.quantidade : l?.m3) || 0;
      return `<td class="r num ${v ? '' : 'muted'}">${v ? numBR(v) : '—'}</td>`;
    }).join('')}</tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td>${setores.map(s => {
      const q = s.meta ? s.campo_meta : (s.unidade === 'm³' ? 'm3' : 'quantidade');
      const t = linhas.filter(l => l.setor_id === s.setor_id).reduce((a, l) => a + Number(q === 'quantidade' ? l.quantidade : l.m3), 0);
      return `<td class="r num">${numBR(t)}</td>`;
    }).join('')}</tr></tfoot></table>`;
}
const dia_util_txt = (mapa, d, setores) => (mapa[`${d}|${setores[0]?.setor_id}`]?.util ? '' : ' <span class="tag">não útil</span>');

async function buscarLancamentos() {

function exportarApontamentos() {

   CONFERÊNCIA — cruzamento entre setores (aba PIN_EUCA_TRP da planilha)
   ===================================================================== */
async function renderConferencia() {
  const [de, ate] = faixaPeriodo();
  $('#main').innerHTML = cabecalho('Conferência', 'Cruzamento entre os setores, para achar diferença de apontamento.', `
    <div class="seg" id="cf-periodo">
      <button data-v="hoje" class="${periodoProd.modo === 'hoje' ? 'on' : ''}">Hoje</button>
      <button data-v="semana" class="${periodoProd.modo === 'semana' ? 'on' : ''}">7 dias</button>
      <button data-v="mes" class="${periodoProd.modo === 'mes' ? 'on' : ''}">Mês</button>
    </div>`) + '<div id="cf-corpo"><div class="vazio">Carregando…</div></div>';
  atualizarLive();
  $$('#cf-periodo button').forEach(b => b.addEventListener('click', () => { periodoProd.modo = b.dataset.v; renderConferencia(); }));
  const { data, error } = await sb.from('vw_apontamentos').select('data,setor_codigo,formulario_codigo,especie,m3,quantidade')
    .gte('data', de).lte('data', ate).eq('cancelado', false).limit(5000);
  if (S.rota !== 'conferencia' || !$('#cf-corpo')) return;
  if (error) return $('#cf-corpo').innerHTML = `<div class="msg erro">${esc(erroTexto(error))}</div>`;
  if (!data.length) return $('#cf-corpo').innerHTML = '<div class="vazio">Nenhum apontamento neste período.</div>';

  const dias = [...new Set(data.map(l => l.data))].sort().reverse();
  const soma = (d, cod, campo, esp) => data.filter(l => l.data === d && l.setor_codigo === cod && (!esp || l.especie === esp))
    .reduce((a, l) => a + Number(l[campo] || 0), 0);
  const especies = [...new Set(data.filter(l => l.setor_codigo === 'MONTAGEM').map(l => l.especie).filter(Boolean))].sort();
  const linha = (d) => {
    const mont = soma(d, 'MONTAGEM', 'm3'), chapasM = soma(d, 'MONTAGEM', 'quantidade');
    const chapasP = soma(d, 'PRENSAGEM', 'quantidade'), lam = soma(d, 'LAMINACAO', 'm3'), sec = soma(d, 'SECAGEM', 'm3');
    const pend = chapasM - chapasP;
    return `<tr><td>${dataBR(d)}</td>
      ${especies.map(e => `<td class="r num">${soma(d, 'MONTAGEM', 'm3', e) ? m3(soma(d, 'MONTAGEM', 'm3', e)) : '<span class="muted">—</span>'}</td>`).join('')}
      <td class="r num"><b>${m3(mont)}</b></td>
      <td class="r num">${numBR(chapasM)}</td><td class="r num">${numBR(chapasP)}</td>
      <td class="r num ${pend > 0 ? 'neg' : pend < 0 ? 'warn-t' : ''}">${pend === 0 ? 'OK' : numBR(pend)}</td>
      <td class="r num">${m3(lam)}</td><td class="r num">${m3(sec)}</td>
      <td class="r num ${lam && sec > lam ? 'warn-t' : ''}">${lam ? numBR(sec / lam * 100) + '%' : '<span class="muted">—</span>'}</td></tr>`;
  };
  $('#cf-corpo').innerHTML = `
    <div class="painel"><h3>Montagem, prensagem, laminação e secagem</h3>
    <div class="tw" style="max-height:65vh"><table class="larga"><thead>
      <tr><th rowspan="2">Data</th><th colspan="${especies.length + 1}" class="r">Montagem (m³)</th><th colspan="3" class="r">Chapas</th><th colspan="3" class="r">Lâminas (m³)</th></tr>
      <tr>${especies.map(e => `<th class="r">${esc(e)}</th>`).join('')}<th class="r">Total</th>
        <th class="r">Montadas</th><th class="r">Prensadas</th><th class="r">A prensar</th>
        <th class="r">Laminação</th><th class="r">Secagem</th><th class="r">Secagem/Laminação</th></tr></thead>
      <tbody>${dias.map(linha).join('')}</tbody></table></div>
    <p class="muted" style="font-size:13px;margin:12px 0 0">"A prensar" é o que foi montado e ainda não foi prensado no mesmo dia. Número negativo significa que a prensa trabalhou chapas montadas em dias anteriores.</p></div>`;
}

            meta_diaria: Number(f.meta_diaria.value), campo: f.campo.value, vigencia_inicio: f.vigencia_inicio.value });
          if (error) return toast(/duplicate/i.test(error.message) ? 'Já existe uma meta para este setor com esta data de início.' : erroTexto(error), 'erro');
        }
        close(); toast('Meta salva.', 'ok'); await carregarRef(); renderProdCadastros();
      });
    }
  });
  $('#pm-novo').addEventListener('click', () => form(null));
  $$('[data-m]').forEach(b => b.addEventListener('click', () => form(metas.find(x => x.id === +b.dataset.m))));
}
async function pcCalendario() {
  const d = new Date(), de = new Date(d.getFullYear(), d.getMonth(), 1).toLocaleDateString('sv-SE');
  const ate = new Date(d.getFullYear(), d.getMonth() + 1, 0).toLocaleDateString('sv-SE');
  $('#pc').innerHTML = '<div class="vazio">Carregando…</div>';
  const { data } = await sb.from('calendario_producao').select('*').gte('data', de).lte('data', ate);
  const excecoes = Object.fromEntries((data || []).map(x => [x.data, x]));
  const dias = []; for (let x = new Date(de + 'T12:00:00'); x.toLocaleDateString('sv-SE') <= ate; x.setDate(x.getDate() + 1)) dias.push(x.toLocaleDateString('sv-SE'));
  $('#pc').innerHTML = `<p class="muted">Dias úteis contam a meta no painel. Por padrão, de segunda a sexta. Marque aqui feriados e paradas do mês.</p>
    <div class="cal">${dias.map(dt => {
      const semana = new Date(dt + 'T12:00:00').getDay();
      const ex = excecoes[dt]; const util = ex ? ex.util : semana >= 1 && semana <= 5;
      return `<button class="cal-dia ${util ? 'util' : 'folga'} ${ex ? 'ex' : ''}" data-d="${dt}">
        <b>${dt.slice(8, 10)}</b><span>${['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][semana]}</span>
        <i>${util ? 'útil' : ex?.tipo || (semana === 0 ? 'domingo' : 'sábado')}</i></button>`;
    }).join('')}</div>`;
  $$('.cal-dia').forEach(b => b.addEventListener('click', async () => {
    const dt = b.dataset.d, semana = new Date(dt + 'T12:00:00').getDay();
    const ex = excecoes[dt]; const util = ex ? ex.util : semana >= 1 && semana <= 5;
    const { error } = await sb.from('calendario_producao').upsert({ data: dt, util: !util, tipo: !util ? 'Útil' : 'Parada' });
    if (error) return toast(erroTexto(error), 'erro');
    pcCalendario();
  }));
}

}

async function detalheEtapa(codigo) {
  const mes = S.mesRef;
  $('#main').innerHTML = cabecalho('Indicadores de produção', 'Detalhe da etapa',
    `<button class="btn" id="dt-voltar">Voltar aos indicadores</button>`) + '<div id="dt"><div class="vazio">Carregando…</div></div>';
  atualizarLive();
  $('#dt-voltar').addEventListener('click', () => irPara('indicadores'));

  const [cad, cst, ene, bas] = await Promise.all([
    sb.rpc('indicadores_cadeia', { p_mes: mes }),
    sb.rpc('custos_mes', { p_mes: mes }),
    sb.rpc('energia_mes', { p_mes: mes }),
    sb.rpc('base_diaria', { p_mes: mes }),
  ]);
  if (S.rota !== 'indicadores') return;
  const e = (cad.data || []).find(x => x.codigo === codigo);
  if (!e) return $('#dt').innerHTML = '<div class="vazio">Etapa não encontrada neste mês.</div>';
  const c = (cst.data || []).find(x => x.codigo === codigo) || {};
  const en = (ene.data || []).find(x => x.codigo === codigo) || {};
  const dias = (bas.data || []).filter(x => x.codigo === codigo);
  const pico = Math.max(1, ...dias.map(x => Number(x.m3)));

  // recursos (mesas/prensas/máquinas) do setor apontado, quando houver
  let recursos = [];
  const setor = S.ref.setores_producao.find(s => s.id === (S.ref.setores_custo || []).find(x => x.codigo === codigo)?.setor_id);
  if (setor && recursosDoSetor(setor.id).length) {
    const { data } = await sb.rpc('resumo_recurso', { p_setor: setor.id, p_de: mes, p_ate: fimDoMes(mes) });
    recursos = Object.values((data || []).reduce((acc, l) => {
      const o = acc[l.recurso_id] ||= { nome: l.recurso, m3: 0, qtd: 0, meta: 0, dias: 0 };
      o.m3 += Number(l.m3); o.qtd += Number(l.quantidade); o.meta += Number(l.meta || 0);
      if (Number(l.m3) || Number(l.quantidade)) o.dias++;
      return acc;
    }, {}));
  }

  const comps = [['Matéria-prima: tora', c.tora], ['Lâminas compradas', c.laminas], ['Cola', c.cola],
    ['Embalagem e acabamento', c.embalagem], ['Mão de obra', c.mao_obra], ['Energia elétrica', c.energia],
    ['Vapor da caldeira', c.vapor], ['Manutenção', c.manutencao], ['Consumíveis', c.consumiveis],
    ['Combustível', c.combustivel], ['Depreciação', c.depreciacao], ['Custos indiretos', c.indiretos]]
    .filter(([, v]) => Number(v) > 0);

  $('#dt').innerHTML = `
    <div class="topo-etapa">
      <div><h2 style="margin:0">${esc(e.etapa)}</h2>
        <div class="sub">${mesBR(mes)} · ${e.origem} · dados até ${dataBR(e.data_corte)}</div></div>
      <span class="situ grande ${CORSTATUS[e.status] || 'sem'}">${esc(e.status)}</span>
    </div>
    <div class="kpis ind">
      <div class="kpi estoque"><div class="v num">${numBR(e.volume_m3)}<small>m³</small></div>
        <div class="l">${e.dias_com_producao} dia(s) com produção${e.quantidade > 0 ? ` · ${numBR(e.quantidade)} un.` : ''}</div></div>
      <div class="kpi"><div class="v num">${e.meta_mes ? pct(e.pct) : '—'}<small>da meta</small></div>
        <div class="l">${e.meta_mes ? `${num1(e.volume_m3)} de ${num0(e.meta_mes)} m³` : 'etapa sem meta cadastrada'}</div></div>
      <div class="kpi"><div class="v num">${num0(e.projecao)}<small>m³ projetados</small></div>
        <div class="l">${e.pct_projecao != null ? `${pct(e.pct_projecao)} da meta` : 'sem meta'} · faltam ${e.dias_restantes} dias úteis</div></div>
      <div class="kpi"><div class="v num">${e.media_dia != null ? numBR(e.media_dia) : '—'}<small>m³/dia</small></div>
        <div class="l">melhor dia ${e.melhor_dia != null ? numBR(e.melhor_dia) + ' m³' : '—'}</div></div>
    </div>
    <div class="grid g2" style="margin-bottom:16px">
      <div class="painel"><h3>Dia a dia do mês</h3>
        ${dias.some(x => Number(x.m3) > 0) ? `<div class="colunas">${dias.map(x => `
          <div class="col ${x.util ? '' : 'nu'} ${Number(x.m3) ? '' : 'zero'}" title="${dataBR(x.data)} — ${numBR(x.m3)} m³${x.meta ? ` (meta ${numBR(x.meta)})` : ''}">
            <i style="height:${Math.round(Number(x.m3) / pico * 100)}%"></i>
            ${Number(x.meta) ? `<u style="bottom:${Math.min(Math.round(Number(x.meta) / pico * 100), 100)}%"></u>` : ''}
            <span>${String(x.data).slice(8)}</span></div>`).join('')}</div>
          <p class="muted" style="font-size:13px;margin:10px 0 0">A linha tracejada é a meta do dia. Barras claras são dias não úteis.</p>`
          : '<div class="vazio">Sem apontamento nesta etapa no mês.</div>'}
      </div>
      <div class="painel"><h3>Fluxo</h3>
        <div class="fluxo">
          <div><span class="l">Entrou na etapa</span><span class="v num">${e.entrada_m3 != null ? numBR(e.entrada_m3) : '—'} m³</span></div>

        ${veCustos() ? `<div class="fluxo custo"><div><span class="l">Custo próprio</span><span class="v num">${e.custo_m3 != null ? rs(e.custo_m3) : '—'}/m³</span></div>
          <div class="seta-fluxo">+</div>
          <div><span class="l">Vem das etapas anteriores</span><span class="v num">${e.custo_acumulado_m3 != null && e.custo_m3 != null ? rs(Number(e.custo_acumulado_m3) - Number(e.custo_m3)) : '—'}/m³</span></div>
          <div class="seta-fluxo">=</div>
          <div><span class="l">Acumulado na saída</span><span class="v num"><b>${e.custo_acumulado_m3 != null ? rs(e.custo_acumulado_m3) : '—'}</b>/m³</span></div></div>` : ''}
      </div>
    </div>
    ${recursos.length ? `<div class="painel" style="margin-bottom:16px"><h3>Por máquina</h3>
      <div class="metas">${recursos.map(o => { const p = o.meta ? o.m3 / o.meta : null;

          <span class="m num">${o.meta ? `${pct(p)} de ${numBR(o.meta)}` : `<span class="muted">${o.dias} dia(s)</span>`}</span></div>`;
      }).join('')}</div></div>` : ''}
    ${veCustos() && comps.length ? `<div class="painel"><h3>Custo da etapa no mês — ${rs(c.custo_total)}</h3>
      <div class="tw"><table><thead><tr><th>Componente</th><th class="r">R$</th><th class="r">% da etapa</th><th class="r">R$/m³</th></tr></thead><tbody>
        ${comps.map(([n, v]) => `<tr><td>${n}</td><td class="r num">${rs(v)}</td>
          <td class="r num">${pct(Number(v) / Number(c.custo_total))}</td>

      </tbody><tfoot><tr><td>Total</td><td class="r num">${rs(c.custo_total)}</td><td class="r num">100%</td>

  $('#main').innerHTML = cabecalho('Custos', `Fechamento de ${mesBR(mes)}. Cada número vem do que foi apontado e do fechamento do mês.`, seletorMes('cu-mes'))

          <td class="r num">${rs0(x.mao_obra)}</td><td class="r num">${rs0(x.energia)}</td>

        <p class="muted" style="font-size:13px;margin:10px 0 0">% fixo da manutenção em fração (0,6 = 60%). O que sobrar rateia pela potência instalada.

      </div>

  $('#f-fech').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = $('#f-fech button[type=submit]'); btn.disabled = true;

      const num = v => v === '' || v == null ? null : Number(v);
      const corpo = { mes };
      $$('#f-fech > .painel:nth-child(-n+3) input[name]').forEach(() => {});
      ['tora_pinus_valor','tora_pinus_m3st','tora_euca_valor','tora_euca_m3st','resina_preco','trigo_preco',
       'resina_consumo_kg','trigo_consumo_kg','aditivos_valor','embalagem_valor','energia_conta','energia_kwh_fatura',
       'cavaco_preco_t','cavaco_comprado_t','caldeira_outros','indiretos_valor','manutencao_total','dias_uteis']
        .forEach(k => { const el = $(`#f-fech [name="${k}"]`); if (el) corpo[k] = num(el.value); });
      ['tora_pinus_valor','tora_pinus_m3st','tora_euca_valor','tora_euca_m3st','resina_preco','trigo_preco',
       'aditivos_valor','embalagem_valor','energia_conta','energia_kwh_fatura','cavaco_preco_t','cavaco_comprado_t',
       'caldeira_outros','indiretos_valor','manutencao_total'].forEach(k => corpo[k] ??= 0);
      corpo.atualizado_por = S.perfil.nome; corpo.atualizado_em = new Date().toISOString();
      const r1 = await sb.from('parametros_mes').upsert(corpo, { onConflict: 'mes' });
      if (r1.error) throw r1.error;

      const lams = $$('#f-fech tr[data-lam]').map(tr => ({
        mes, especie: tr.dataset.lam,
        valor_com_imposto: num($('[name=valor_com_imposto]', tr).value) ?? 0,
        m3_comprada: num($('[name=m3_comprada]', tr).value) ?? 0,
        frete: num($('[name=frete]', tr).value) ?? 0,
        imposto_pct: num($('[name=imposto_pct]', tr).value) ?? 0,
        m3_propria: num($('[name=m3_propria]', tr).value),
      }));
      const r2 = await sb.from('laminas_mes').upsert(lams, { onConflict: 'mes,especie' });
      if (r2.error) throw r2.error;

      const cst = $$('#f-fech tr[data-sc]').map(tr => ({
        mes, setor_custo_id: +tr.dataset.sc,
        mao_obra: num($('[name=mao_obra]', tr).value) ?? 0,
        funcionarios: num($('[name=funcionarios]', tr).value) ?? 0,
        valor_maquinas: num($('[name=valor_maquinas]', tr).value) ?? 0,
        vida_util_anos: num($('[name=vida_util_anos]', tr).value),
        consumiveis: num($('[name=consumiveis]', tr).value) ?? 0,
        manutencao_pct_fixo: num($('[name=manutencao_pct_fixo]', tr).value),
        rendimento_padrao: num($('[name=rendimento_padrao]', tr).value),
        incluir: $('[name=incluir]', tr).checked,
      }));
      const r3 = await sb.from('custos_setor_mes').upsert(cst, { onConflict: 'mes,setor_custo_id' });
      if (r3.error) throw r3.error;
      toast(`Fechamento de ${mesBR(mes)} gravado.`);
      renderFechamento();
    } catch (e) { toast(erroTexto(e), 'erro'); btn.disabled = false; }
  });
}
