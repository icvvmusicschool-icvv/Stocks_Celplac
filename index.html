<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Celplac Estoque</title>
<meta name="theme-color" content="#1E2A2F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231E2A2F'/%3E%3Crect x='6' y='8' width='20' height='3' fill='%23E3C88E'/%3E%3Crect x='6' y='12.5' width='20' height='3' fill='%23A9844A'/%3E%3Crect x='6' y='17' width='20' height='3' fill='%23E3C88E'/%3E%3Crect x='6' y='21.5' width='20' height='3' fill='%23A9844A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --ink:#1E2A2F; --ink-2:#2B3A40; --ink-3:#33454B; --paper:#F2F3EF; --panel:#FFFFFF; --line:#D9DDD6; --line-2:#E8EAE5;
  --muted:#5D6A6D; --brand:#2E6F6A; --brand-soft:#E1EEEC;
  --veneer:#C9A15A; --veneer-l:#E3C88E; --veneer-d:#A9844A;
  --in:#2F7D5B; --in-soft:#E3F1EA; --out:#A8323E; --out-soft:#F6E3E5; --warn:#A86F0C; --warn-soft:#FAEFD9;
  --radius:10px; --radius-s:6px;
  --f:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fc:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{--sw:252px;font-family:var(--f);font-size:15px;line-height:1.45;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
body.rail{--sw:78px}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--fc);font-variant-numeric:tabular-nums}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* marca: chapa vista de topo, lâminas cruzadas */
.mark{display:inline-grid;gap:2px;width:30px;flex:none}
.mark i{display:block;height:4px;border-radius:1px}
.mark i:nth-child(odd){background:var(--veneer-l)}
.mark i:nth-child(even){background:var(--veneer-d)}
.mark i:nth-child(2){margin-left:3px}.mark i:nth-child(4){margin-right:3px}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:var(--ink)}
.login-card{width:100%;max-width:400px;background:var(--panel);border-radius:14px;padding:32px 28px 26px}
.login-card h1{font-family:var(--fc);font-size:28px;line-height:1.1;margin:18px 0 4px;font-weight:700}
.login-card>p{margin:0 0 22px;color:var(--muted)}
.login-edge{height:10px;margin:-32px -28px 24px;border-radius:14px 14px 0 0;background:repeating-linear-gradient(180deg,var(--veneer-l) 0 2px,var(--veneer-d) 2px 4px)}

/* ---------- menu lateral ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--sw);background:var(--ink);color:#D3DCDE;display:flex;flex-direction:column;padding:14px 12px;z-index:50;transition:width .16s ease}
.brand{display:flex;align-items:center;gap:10px;padding:4px 4px 18px 8px;min-height:50px}
.brand .txt{flex:1;min-width:0;color:#fff;line-height:1.15}
.brand b{font-family:var(--fc);font-size:20px;font-weight:700;display:block}
.brand small{font-size:12.5px;color:#9FB0B3}
.ico-btn{position:relative;background:none;border:0;color:#AFC0C3;width:36px;height:36px;border-radius:8px;cursor:pointer;display:grid;place-items:center;flex:none}
.ico-btn:hover{background:var(--ink-2);color:#fff}
.ico-btn svg{width:20px;height:20px}
.rapidas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 18px}
.rapida{position:relative;display:flex;flex-direction:column;gap:6px;padding:12px 12px 11px;border-radius:10px;color:#fff;text-decoration:none;font-weight:700;font-size:15px;outline-offset:3px;border:2px solid transparent}
.rapida svg{width:20px;height:20px}
.rapida.e{background:var(--in)}.rapida.s{background:var(--out)}.rapida.a{background:var(--brand)}
.rapida.a:hover{background:#265D59}
.topbar .mini.a{background:var(--brand)}
.rapida.e:hover{background:#286c4e}.rapida.s:hover{background:#912b35}
.rapida.ativo{border-color:#fff}
.nav{display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.nav a{position:relative;display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:999px;color:#D3DCDE;text-decoration:none;font-weight:500;font-size:15.5px}
.nav a svg{width:20px;height:20px;flex:none}
.nav a:hover{background:var(--ink-2);color:#fff}
.nav a.ativo{background:var(--brand);color:#fff;font-weight:700}
.nav .sep{height:1px;background:var(--ink-3);margin:8px 10px}
.usuario{margin-top:auto;padding-top:12px;border-top:1px solid var(--ink-3);position:relative}
.usuario .card{position:relative;display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#fff;padding:8px;border-radius:10px;cursor:pointer;text-align:left}
.usuario .card:hover{background:var(--ink-2)}
.usuario .info{min-width:0;flex:1;line-height:1.25}
.usuario .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.usuario .info small{color:#9FB0B3;font-size:13px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--veneer-l);color:var(--ink);display:grid;place-items:center;font-weight:700;font-family:var(--fc);font-size:15px;flex:none}
.menu-user{position:absolute;bottom:calc(100% + 6px);left:0;min-width:210px;background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.28);padding:6px;display:none;z-index:60}
.menu-user.on{display:block}
.menu-user button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:7px;cursor:pointer;font-weight:500}
.menu-user button:hover{background:var(--paper)}
/* menu recolhido: só ícones, nome aparece ao passar o mouse */
body.rail .brand{flex-direction:column;gap:10px;padding:4px 0 16px}
body.rail .brand .txt,body.rail .nav a span,body.rail .rapida span,body.rail .usuario .info{display:none}
body.rail .rapidas{grid-template-columns:1fr}
body.rail .rapida{align-items:center;padding:11px 0}
body.rail .nav a{justify-content:center;padding:12px 0}
body.rail .usuario .card{justify-content:center;padding:8px 0}
body.rail .menu-user{left:calc(100% + 10px);bottom:0}
body.rail [data-label]:hover::after{content:attr(data-label);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);background:#0F1719;color:#fff;padding:6px 10px;border-radius:6px;white-space:nowrap;font-size:13.5px;font-weight:600;pointer-events:none;z-index:70}
.veu{display:none}
.topbar{display:none}

/* ---------- conteúdo ---------- */
.main{margin-left:var(--sw);padding:24px 32px 60px;max-width:calc(1400px + var(--sw));transition:margin .16s ease}
.topo{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:20px}
.topo h2{font-family:var(--fc);font-size:30px;line-height:1.1;margin:0;font-weight:700}
.topo .sub{color:var(--muted);margin-top:4px;max-width:70ch}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:#9AA5A7}
.live.on i{background:var(--in);box-shadow:0 0 0 3px var(--in-soft)}

/* ---------- componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:9px 16px;border-radius:var(--radius-s);cursor:pointer;font-weight:600;min-height:40px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#B8BFB6}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:#265D59}
.btn.in{background:var(--in);border-color:var(--in);color:#fff}
.btn.out{background:var(--out);border-color:var(--out);color:#fff}
.btn.lg{min-height:52px;font-size:17px;padding:12px 26px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn.sm{min-height:32px;padding:5px 11px;font-size:13.5px}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo>span{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:var(--radius-s);padding:9px 11px;min-height:42px}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{min-height:70px;resize:vertical}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.painel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.painel h3{font-family:var(--fc);font-size:18px;margin:0 0 12px;font-weight:700}
.msg{padding:12px 14px;border-radius:var(--radius-s);background:var(--warn-soft);color:#6B4706;font-size:14px}
.msg.erro{background:var(--out-soft);color:#7A1E28}
.msg.ok{background:var(--in-soft);color:#1D573E}
.muted{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden;background:#fff;flex-wrap:wrap;justify-self:start}
.seg button{border:0;background:none;padding:9px 16px;cursor:pointer;font-weight:600;min-height:42px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}

/* tabelas */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:14px}
th{position:sticky;top:0;background:#F7F8F5;text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#F7F8F5}
tfoot td{position:sticky;bottom:0;background:#F7F8F5;font-weight:700;border-top:1px solid var(--line)}
table.larga{min-width:1180px}
table.cad-prod{min-width:980px}
table.cad-prod th,table.cad-prod td{white-space:nowrap}
table.cad-prod td.desc{white-space:normal;min-width:230px}
table.cad-prod th:last-child,table.cad-prod td:last-child{position:sticky;right:0;background:#fff;box-shadow:-6px 0 8px -6px rgba(30,42,47,.25)}
table.cad-prod th:last-child{background:#F7F8F5}
table.cad-prod tbody tr:hover td:last-child{background:#F7F8F5}
table.larga td{white-space:nowrap}
table.larga td.desc{white-space:normal;min-width:240px}
.cod{font-family:var(--fc);font-weight:600;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--line-2);color:var(--ink-2)}
.tag.in{background:var(--in-soft);color:var(--in)}.tag.out{background:var(--out-soft);color:var(--out)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.aj{background:var(--brand-soft);color:var(--brand)}
.pos{color:var(--in);font-weight:600}.neg{color:var(--out);font-weight:600}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;overflow:hidden}
.kpi{padding:16px 20px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--fc);font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:17px;font-weight:600;color:var(--muted);margin-left:4px}
.kpi .l{color:var(--muted);font-size:13.5px;margin-top:4px}
.kpi.estoque{background:var(--ink);color:#fff}
.kpi.estoque .l,.kpi.estoque .v small{color:#AFC0C3}
.ply{height:7px;background:repeating-linear-gradient(90deg,var(--veneer-l) 0 18px,var(--veneer-d) 18px 36px);border-radius:0 0 4px 4px;margin-bottom:18px}
.bh{display:grid;grid-template-columns:auto minmax(60px,1fr) auto;gap:9px 12px;align-items:center;font-size:14px}
.bh-t{height:14px;background:var(--line-2);border-radius:3px;overflow:hidden}
.bh-t i{display:block;height:100%;border-radius:3px}
.bh-v{text-align:right;font-weight:600}
.cols{position:relative;display:flex;gap:3px;height:210px}
.col{flex:1;display:flex;flex-direction:column;min-width:0}
.col .barras{flex:1;display:flex;align-items:flex-end;gap:1px;border-bottom:1px solid var(--line)}
.col .barras i{flex:1;border-radius:2px 2px 0 0}
.col span{font-size:11.5px;color:var(--muted);text-align:center;height:18px;line-height:18px;white-space:nowrap;overflow:visible}
i.ce{background:var(--in)}i.cs{background:var(--out)}
.legenda{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:6px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:10px;height:10px;border-radius:2px;display:inline-block}
.cols .vazio-g{position:absolute;inset:0 0 18px;display:grid;place-items:center;color:var(--muted);font-size:14px}
.lista-alerta{display:flex;flex-direction:column}
.lista-alerta div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.lista-alerta div:last-child{border-bottom:0}

/* movimentação */
.mov{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.mov>*{min-width:0}
.picker{position:relative}
.picker .lista{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 30px rgba(30,42,47,.16);max-height:340px;overflow:auto;z-index:30}
.picker .op{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line-2)}
.picker .op:last-child{border-bottom:0}
.picker .op.sel,.picker .op:hover{background:var(--brand-soft)}
.picker .op .d{grid-column:2;font-size:14px}
.picker .op .q{grid-row:1/3;grid-column:3;text-align:right;align-self:center}
.picker .op .x{grid-column:2;font-size:12.5px;color:var(--muted)}
.add-linha{display:grid;grid-template-columns:minmax(0,1fr) 130px auto;gap:10px;align-items:end}
.qtd-inp{font-family:var(--fc);font-size:19px;font-weight:600;text-align:right;height:42px;padding-top:4px;padding-bottom:4px}
.linhas td .inp{min-height:36px;padding:5px 8px;width:96px;text-align:right;font-family:var(--fc);font-size:16px;font-weight:600}
.resumo{position:sticky;top:20px}
.resumo .tot{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line-2)}
.resumo .tot b{font-family:var(--fc);font-size:26px;font-variant-numeric:tabular-nums}
.vazio{padding:34px 16px;text-align:center;color:var(--muted)}
.check{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--out);flex:none}

/* modal, avisos, abas, filtros */
.modal-bg{position:fixed;inset:0;background:rgba(20,28,31,.5);display:grid;place-items:center;padding:16px;z-index:100}
.modal{background:#fff;border-radius:14px;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:22px 24px}
.modal.wide{max-width:960px}
.modal h3{font-family:var(--fc);font-size:22px;margin:0 0 14px}
.modal .acoes{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(420px,calc(100vw - 36px))}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--radius-s);box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:500;border-left:5px solid var(--veneer)}
.toast.ok{border-left-color:#5BC08E}.toast.erro{border-left-color:#E8737E}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.filtros .campo{min-width:140px;flex:1 1 140px}
.filtros .campo.busca{flex:3 1 260px}


/* consulta guiada */
.passos{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.passo{flex:1;display:flex;align-items:center;gap:11px;padding:12px 16px;border:0;border-right:1px solid var(--line);background:none;text-align:left;color:var(--muted);font-weight:700;font-size:15px;min-width:0;cursor:pointer}
.passo:last-child{border-right:0}
.passo:disabled{cursor:default}
.passo .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-family:var(--fc);font-weight:700;flex:none;background:#fff;color:var(--muted)}
.passo .t{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.passo .t small{font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
.passo.feito{color:var(--ink)}
.passo.feito .n{background:var(--brand);border-color:var(--brand);color:#fff}
.passo.feito:hover{background:#F7F8F5}
.passo.atual{color:var(--ink);background:var(--brand-soft);box-shadow:inset 0 -3px 0 var(--brand)}
.passo.atual .n{border-color:var(--brand);color:var(--brand)}
.trilha{font-family:var(--fc);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:0 0 14px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.trilha a{color:var(--ink);text-decoration:none;border-bottom:2px solid var(--veneer-l)}
.trilha a:hover{border-bottom-color:var(--brand)}
.trilha .sep{color:#A3ADAF}
.perg{font-family:var(--fc);font-size:22px;margin:0 0 14px;font-weight:700}
.perg .muted{font-size:16px;font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cards.especies{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.cartao{position:relative;display:flex;flex-direction:column;gap:5px;text-align:left;text-decoration:none;color:inherit;background:#fff;border:2px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;min-height:108px;justify-content:center}
.cartao:hover{border-color:#9DB3B0}
.cartao.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.cartao .nome{font-family:var(--fc);font-size:30px;font-weight:700;line-height:1.05;color:var(--ink)}
.cartao .nome.dim{font-size:22px;white-space:nowrap}
.res-tabela table{font-size:13.5px}.res-tabela th,.res-tabela td{padding:9px 8px}.res-tabela td{white-space:nowrap}.res-tabela td.desc{white-space:normal;min-width:170px}
.cartao .det{color:var(--muted);font-size:14px}
.cartao.zero .nome{color:#8A9597}
.cartao .ok{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:none;place-items:center;font-size:14px;font-weight:700}
.cartao.sel .ok{display:grid}

async function iniciar() {
  aplicarLayout();
  real?.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { S.perfil = null; mostrarLogin(); } });
  ['celplac-demo-sessao', 'celplac-demo-dados-v1', 'celplac-demo-dados-v2'].forEach(k => guardar.apagar(k));   // limpa restos da antiga demonstração
  if (!real) return mostrarLogin('Esta janela não alcança o servidor. Abra o sistema no navegador para entrar.', 'aviso');
  try {
    const { data } = await real.auth.getSession();
    if (data.session) return entrarApp(data.session);
  } catch {}
  mostrarLogin();
}
function mostrarLogin(msg, tipo = 'erro') {
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#login-msg').innerHTML = msg ? `<div class="msg ${tipo}">${esc(msg)}</div>` : '';
}
$('#form-login').addEventListener('submit', async e => {
  e.preventDefault();
  if (!real) return mostrarLogin('Esta janela não alcança o servidor. Abra o sistema no navegador para entrar.');
  const f = e.target, btn = $('button', f);
  btn.disabled = true; btn.textContent = 'Entrando…'; $('#login-msg').innerHTML = '';
  let res;
  try { res = await real.auth.signInWithPassword({ email: f.email.value.trim(), password: f.senha.value }); }
  catch (err) { res = { error: err }; }
  btn.disabled = false; btn.textContent = 'Entrar';
  if (res.error) {
    const m = res.error.message || '';
    if (/Invalid login/i.test(m)) return mostrarLogin('E-mail ou senha incorretos.');
    if (/fetch|network|load failed/i.test(m) || res.error.status === 0)
      return mostrarLogin('Não foi possível falar com o servidor a partir desta janela. Verifique a internet ou abra o sistema no navegador.');
    return mostrarLogin(erroTexto(res.error));
  }
  f.senha.value = '';
  await entrarApp(res.data.session, true);
});
async function entrarApp(sessao, novoLogin = false) {
  S.sessao = sessao;
  const { data: perfil, error } = await sb.from('perfis').select('*').eq('id', sessao.user.id).maybeSingle();
  if (error || !perfil || !perfil.ativo) {
    await sb.auth.signOut();
    return mostrarLogin(error ? erroTexto(error) : 'Seu acesso ainda não foi liberado. Peça ao administrador para ativar seu usuário.');
  }
  S.perfil = perfil;
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  montarMenu(); aplicarLayout();
  $('#main').innerHTML = '<div class="vazio">Carregando estoque…</div>';
  try { await Promise.all([carregarRef(), veEstoque() ? carregarEstoque() : Promise.resolve()]); }
  catch (e) { $('#main').innerHTML = `<div class="msg erro">${esc(erroTexto(e))}</div>`; return; }
  ligarTempoReal();
  if (novoLogin) {
    S.consulta = { especie: null, espessura: null, dim: null, aviso: null };
    const sol = solucoesDisponiveis();
    history.replaceState(null, '', sol.length === 1 ? `#/${rotaInicial(sol[0])}` : '#/inicio');
  }
  navegar();
  if (veEstoque()) atualizarPendencias(true);
}

const REF_ORDEM = { classificacoes: 'ordem', setores_producao: 'ordem', recursos_producao: 'ordem', formularios_producao: 'ordem' };
async function carregarRef() {
  const tabelas = Object.keys(S.ref);
  const res = await Promise.all(tabelas.map(t => sb.from(t).select('*').order(REF_ORDEM[t] || 'id')));
  res.forEach((r, i) => { if (r.error) throw r.error; S.ref[tabelas[i]] = r.data; });
}
async function carregarEstoque() {
  const { data, error } = await sb.from('vw_estoque').select('*').order('categoria_sigla', { ascending: false })
    .order('especie').order('espessura_mm').order('codigo');
  if (error) throw error;
  data.forEach(p => { p._busca = norm(`${p.codigo} ${p.descricao} ${p.classificacao || ''} ${p.acabamento || ''}`); });
  S.estoque = data; S.estoqueMap = new Map(data.map(p => [p.id, p])); S.carregadoEm = new Date();
}
let recarregaTimer = null;
function ligarTempoReal() {
  if (S.canal) sb.removeChannel(S.canal);
  const aoMudar = () => {
    clearTimeout(recarregaTimer);
    recarregaTimer = setTimeout(async () => {
      if (!veEstoque()) return;
      try { await carregarEstoque(); } catch { return; }
      atualizarLive();
      document.dispatchEvent(new CustomEvent('estoque-atualizado'));
    }, 400);
  };
  S.canal = sb.channel('estoque-celplac')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'saldos' }, aoMudar)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'produtos' }, aoMudar)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'reservas' }, aoMudar)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'processos' }, () => { atualizarPendencias(); if (S.rota === 'pendencias') renderPendencias(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'processo_itens' }, () => { if (S.rota === 'pendencias') renderPendencias(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'apontamentos' }, () => { if (!$('.modal-bg')) recarregarProducao(); })
    .subscribe(st => { S.canalOk = st === 'SUBSCRIBED'; atualizarLive(); });
}
document.addEventListener('estoque-atualizado', () => {
  if (['painel', 'estoque', 'consulta', 'reservas'].includes(S.rota) && !$('.modal-bg')) ROTAS[S.rota].render();
  S.atualizarLinhas?.();
});

function barrasH(itens, cor) {
  const max = Math.max(0, ...itens.map(i => i.v)) || 1;
  return itens.length ? `<div class="bh">${itens.map(i => `<span>${esc(i.k)}</span><span class="bh-t"><i style="width:${(i.v / max * 100).toFixed(1)}%;background:${cor}"></i></span><span class="bh-v num">${m3(i.v)}</span>`).join('')}</div>`
    : '<div class="muted">Sem estoque.</div>';
}
function colunas(dias, e, s) {
  const max = Math.max(0, ...e, ...s);
  return `<div class="cols">${dias.map((d, i) => `<div class="col" title="${dataBR(d)} — entradas ${m3(e[i])} m³ · saídas ${m3(s[i])} m³">
    <div class="barras"><i class="ce" style="height:${max ? (e[i] / max * 100).toFixed(1) : 0}%"></i><i class="cs" style="height:${max ? (s[i] / max * 100).toFixed(1) : 0}%"></i></div>
    <span>${i % 5 === 4 || i === 0 ? d.slice(8, 10) + '/' + d.slice(5, 7) : ''}</span></div>`).join('')}
    ${max ? '' : '<div class="vazio-g">Nenhuma entrada ou saída nos últimos 30 dias.</div>'}</div>
    <div class="legenda"><span><i class="ce"></i>Entradas</span><span><i class="cs"></i>Saídas</span><span>Passe o mouse sobre um dia para ver os valores.</span></div>`;
}
async function renderPainel() {
  const est = S.estoque.filter(p => p.ativo);
  const totPc = est.reduce((a, p) => a + p.saldo, 0), totM3 = est.reduce((a, p) => a + Number(p.m3_total), 0);
  const comCusto = est.filter(p => p.custo_unitario != null);

function filtrarEstoque() {

  return S.estoque.filter(p => (p.ativo || p.saldo !== 0)
    && toks.every(t => p._busca.includes(t))
    && (!filtroEst.categoria || p.categoria === filtroEst.categoria)
    && (!filtroEst.especie || p.especie === filtroEst.especie)
    && (!filtroEst.espessura || Number(p.espessura_mm) === Number(filtroEst.espessura))
    && (!filtroEst.classificacao || p.classificacao === filtroEst.classificacao)
    && (!filtroEst.acabamento || p.acabamento === filtroEst.acabamento)
    && (!filtroEst.status || (filtroEst.status === 'alerta' ? p.status !== 'OK' : filtroEst.status === 'comsaldo' ? p.saldo > 0 : p.status === filtroEst.status)));
}

  $('#m-ref').addEventListener('input', e => R.referencia = e.target.value);
  $('#m-obs').addEventListener('input', e => R.observacao = e.target.value);
  $$('#m-atalho button').forEach(b => b.addEventListener('click', () => { R.data = hojeISO(+b.dataset.d); $('#m-data').value = R.data; marcarAtalho(); }));
  marcarAtalho();

  // seletor de produto
  let escolhido = null, opcoes = [], cursor = 0;
  const busca = $('#m-busca'), lista = $('#m-lista'), qtd = $('#m-qtd');
  const desenharOpcoes = () => {
    const toks = norm(busca.value).split(/\s+/).filter(Boolean);
    opcoes = toks.length ? S.estoque.filter(p => p.ativo && toks.every(t => p._busca.includes(t)))
      .sort((a, b) => (norm(b.codigo).startsWith(toks[0]) - norm(a.codigo).startsWith(toks[0])) || a.codigo.localeCompare(b.codigo)).slice(0, 40) : [];
    cursor = 0;
    lista.classList.toggle('hidden', !toks.length);
    lista.innerHTML = opcoes.length ? opcoes.map((p, i) => `<div class="op ${i === 0 ? 'sel' : ''}" data-i="${i}" role="option">
      <span class="cod">${esc(p.codigo)}</span><span class="d">${esc(p.descricao)}</span>
      <span class="q num"><b>${pc(p.saldo)}</b> pç</span><span class="x">${esc(qualidade(p))}</span></div>`).join('')
      : '<div class="vazio" style="padding:16px">Nenhum produto encontrado com essas palavras.</div>';
    if (modo === 'ENTRADA' && podeLancar()) lista.insertAdjacentHTML('beforeend', '<div class="op novo" data-novo="1"><span class="cod">+</span><span class="d"><b>Chapa sem cadastro?</b> Cadastrar agora</span></div>');
    $$('.op[data-i]', lista).forEach(o => o.addEventListener('mousedown', e => { e.preventDefault(); escolher(opcoes[+o.dataset.i]); }));
    $('.op[data-novo]', lista)?.addEventListener('mousedown', e => { e.preventDefault(); lista.classList.add('hidden'); cadastroRapido({ aoCriar: escolher }); });
  };
  const escolher = p => {
    escolhido = p; busca.value = `${p.codigo} — ${p.descricao} ${qualidade(p)}`; lista.classList.add('hidden');
    $('#m-sel').innerHTML = `Saldo atual: <b class="num">${pc(p.saldo)} pç</b> (${m3(p.m3_total)} m³)${p.reservado ? ` · <b>${pc(p.reservado)} reservadas</b>, ${pc(p.disponivel)} disponíveis${usaDisponivel ? ' para venda' : ''}` : ''} · ${m3(p.m3_peca)} m³ por peça`;
    qtd.focus(); qtd.select();
  };
  busca.addEventListener('input', () => { escolhido = null; $('#m-sel').textContent = ''; desenharOpcoes(); });
  busca.addEventListener('focus', () => { if (!escolhido && busca.value) desenharOpcoes(); });
  busca.addEventListener('blur', () => setTimeout(() => lista.classList.add('hidden'), 120));
  busca.addEventListener('keydown', e => {
    if (lista.classList.contains('hidden') || !opcoes.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); cursor = (cursor + (e.key === 'ArrowDown' ? 1 : -1) + opcoes.length) % opcoes.length;
      $$('.op', lista).forEach((o, i) => o.classList.toggle('sel', i === cursor)); $$('.op', lista)[cursor].scrollIntoView({ block: 'nearest' });
    }
    if (e.key === 'Enter') { e.preventDefault(); escolher(opcoes[cursor]); }
  });
  const adicionar = () => {
    if (!escolhido) { busca.focus(); return toast('Escolha um produto da lista.', 'erro'); }
    const n = Number(qtd.value);
    if (!Number.isInteger(n) || n <= 0) { qtd.focus(); return toast('Informe a quantidade em peças (número inteiro maior que zero).', 'erro'); }
    const ex = R.linhas.find(l => l.produto_id === escolhido.id);
    if (ex) ex.quantidade += n; else R.linhas.push({ produto_id: escolhido.id, quantidade: n });
    escolhido = null; busca.value = ''; qtd.value = ''; $('#m-sel').textContent = '';
    desenharLinhas(); busca.focus();
  };
  $('#m-add').addEventListener('click', adicionar);
  $('#m-novo')?.addEventListener('click', () => cadastroRapido({ aoCriar: escolher }));
  qtd.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); adicionar(); } });

  const sinal = () => modo === 'ENTRADA' || (modo === 'AJUSTE' && R.direcao === 'AJUSTE_POSITIVO') ? 1 : -1;
  function desenharLinhas() {
    if (!$('#m-linhas')) return;
    const s = sinal();
    let tp = 0, tm = 0, faltas = 0;
    R.linhas = R.linhas.filter(l => S.estoqueMap.has(l.produto_id));
    $('#m-linhas').innerHTML = R.linhas.length ? `<table class="linhas"><thead><tr><th>Código</th><th>Descrição</th><th class="r">Peças</th><th class="r">m³</th><th class="r">Saldo</th><th></th></tr></thead><tbody>
      ${R.linhas.map((l, i) => {
        const p = S.estoqueMap.get(l.produto_id); const vm = l.quantidade * Number(p.m3_peca); const base = usaDisponivel ? p.disponivel : p.saldo; const depois = base + s * l.quantidade;
        tp += l.quantidade; tm += vm; if (depois < 0) faltas++;
        return `<tr><td class="cod">${esc(p.codigo)}</td><td>${esc(p.descricao)} <span class="muted">${esc(qualidade(p))}</span></td>
          <td class="r"><input class="inp" type="number" min="1" step="1" inputmode="numeric" data-i="${i}" value="${l.quantidade}" aria-label="Peças"></td>
          <td class="r num">${m3(vm)}</td><td class="r num" style="white-space:nowrap">${pc(base)} → <b class="${depois < 0 ? 'neg' : ''}">${pc(depois)}</b>${usaDisponivel && p.reservado ? `<br><small class="muted">${pc(p.reservado)} reservadas</small>` : ''}</td>
          <td class="r"><button class="btn sm ghost" data-del="${i}">Remover</button></td></tr>`;
      }).join('')}</tbody></table>`
      : `<div class="vazio">Nenhum item ainda. Busque o produto acima, informe as peças e pressione Enter.</div>`;
    $('#r-itens').textContent = pc(R.linhas.length); $('#r-pc').textContent = pc(tp); $('#r-m3').textContent = m3(tm) + ' m³';
    $$('#m-linhas input[data-i]').forEach(inp => inp.addEventListener('change', () => {
      const n = Number(inp.value);
      if (!Number.isInteger(n) || n <= 0) { toast('Quantidade inválida.', 'erro'); inp.value = R.linhas[+inp.dataset.i].quantidade; return; }
      R.linhas[+inp.dataset.i].quantidade = n; desenharLinhas();
    }));
    $$('#m-linhas [data-del]').forEach(b => b.addEventListener('click', () => { R.linhas.splice(+b.dataset.del, 1); desenharLinhas(); }));
    $('#r-aviso').innerHTML = faltas ? `<div class="msg erro">${faltas} ${faltas > 1 ? 'itens ficariam' : 'item ficaria'} sem saldo${usaDisponivel ? ' disponível para venda (chapas reservadas não podem ser vendidas)' : ''}. Corrija a quantidade${ehAdmin() ? ' ou autorize abaixo.' : '.'}</div>
      ${ehAdmin() && s < 0 ? `<label class="check" style="margin-top:10px"><input type="checkbox" id="m-autoriza" ${R.autorizar ? 'checked' : ''}><span>Autorizo como administrador a saída acima do saldo disponível.</span></label>` : ''}` : '';
    $('#m-autoriza')?.addEventListener('change', e => R.autorizar = e.target.checked);
    $('#m-registrar').disabled = !R.linhas.length;
    R._faltas = faltas;
  }
  S.atualizarLinhas = desenharLinhas;
  desenharLinhas();

  $('#m-limpar').addEventListener('click', async () => {
    if (R.linhas.length && !(await confirmar('Limpar lançamento?', '<p>Os itens adicionados serão descartados. Nada foi gravado ainda.</p>', 'Limpar', 'out'))) return;
    S.rascunhos[modo] = novoRascunho(modo); renderMov(modo);
  });

  $('#m-registrar').addEventListener('click', async () => {
    const tipo = modo === 'AJUSTE' ? R.direcao : modo;
    if (!R.linhas.length) return;
    if (!R.data) return toast('Informe a data.', 'erro');
    if (modo !== 'ENTRADA' && !R.motivo_id) return toast('Escolha o motivo.', 'erro');
    if (ehProcesso && !R.setor_id) { $('#m-setor')?.scrollIntoView({ block: 'center' }); return toast('Escolha o setor de destino.', 'erro'); }
    if (modo === 'AJUSTE' && R.observacao.trim().length < 5) { $('#m-obs').focus(); return toast('Escreva a justificativa do ajuste.', 'erro'); }
    if (R._faltas && !(ehAdmin() && R.autorizar)) return toast('Há itens sem saldo suficiente. Corrija as quantidades.', 'erro');
    const motivo = (S.ref.motivos.find(m => m.id === R.motivo_id)?.nome || '') + (ehProcesso ? ' → ' + (setores.find(x => x.id === R.setor_id)?.nome || '') : '');
    const tp = R.linhas.reduce((a, l) => a + l.quantidade, 0);
    const tm = R.linhas.reduce((a, l) => a + l.quantidade * Number(S.estoqueMap.get(l.produto_id).m3_peca), 0);
    const ok = await confirmar(`Confirmar ${TIPO_NOME[tipo].toLowerCase()}?`, `
      <p style="margin-top:0">${esc(motivo || '')} · ${dataBR(R.data)}${R.referencia ? ' · ' + esc(R.referencia) : ''}</p>
      <div class="tw" style="max-height:40vh"><table><tbody>${R.linhas.map(l => { const p = S.estoqueMap.get(l.produto_id);
        return `<tr><td class="cod">${esc(p.codigo)}</td><td>${esc(p.descricao)} <span class="muted">${esc(qualidade(p))}</span></td><td class="r num"><b>${pc(l.quantidade)}</b> pç</td></tr>`; }).join('')}</tbody></table></div>
      <p style="font-size:18px;margin-bottom:0"><b class="num">${pc(tp)} peças · ${m3(tm)} m³</b></p>`, T.btn, T.cls);
    if (!ok) return;
    const btn = $('#m-registrar'); btn.disabled = true; btn.textContent = 'Gravando…';
    const { data, error } = await sb.rpc('registrar_lancamento', {
      p_id: R.id, p_tipo: tipo, p_motivo_id: R.motivo_id, p_data_referencia: R.data,
      p_itens: R.linhas.map(l => ({ produto_id: l.produto_id, quantidade: l.quantidade })),
      p_referencia: R.referencia || null, p_observacao: R.observacao || null, p_local_id: null,
      p_autorizar_sem_saldo: ehAdmin() && R.autorizar && !!R._faltas,
      p_setor_id: ehProcesso ? R.setor_id : null,
    });
    btn.disabled = false; btn.textContent = T.btn;
    if (error) {
      if (error.message === 'SALDO_INSUFICIENTE') {
        let f = []; try { f = JSON.parse(error.details); } catch {}
        await carregarEstoque().catch(() => {}); desenharLinhas();
        return modal(`<h3>Saldo insuficiente</h3><p>Outro lançamento pode ter consumido o saldo. Nada foi gravado.</p>
          <ul>${f.map(x => `<li><span class="cod">${esc(x.codigo)}</span>: saldo ${pc(x.saldo)} pç${x.reservado ? `, reservado ${pc(x.reservado)} pç, disponível ${pc(x.disponivel)} pç` : ''}, solicitado ${pc(x.solicitado)} pç</li>`).join('')}</ul>
          <div class="acoes"><button class="btn pri" data-fechar>Corrigir quantidades</button></div>`);
      }
      return toast(erroTexto(error), 'erro');
    }
    toast(data.duplicado ? `Este lançamento já estava gravado (nº ${data.numero}). Nada foi duplicado.`
      : `${TIPO_NOME[tipo]} nº ${data.numero} registrada: ${pc(data.pecas)} pç · ${m3(data.m3)} m³.${data.processo ? ` Pendência nº ${data.processo} aberta para ${data.setor}.` : ''}`, 'ok');
    if (data.processo) atualizarPendencias();
    const dataAnterior = R.data;
    S.rascunhos[modo] = novoRascunho(modo); S.rascunhos[modo].data = dataAnterior;
    try { await carregarEstoque(); } catch {}
    renderMov(modo);
  });
  atualizarLive();
  if (innerWidth > 760) setTimeout(() => busca.focus(), 50);
}

/* =====================================================================
   HISTÓRICO
   ===================================================================== */
const filtroHist = { de: null, ate: null, tipo: '', motivo: '', usuario: '', produto: '' };
let histDados = [];
async function renderHistorico() {
  filtroHist.de ||= hojeISO(-6); filtroHist.ate ||= hojeISO();
  const { data: usuarios } = await sb.from('perfis').select('id,nome').order('nome');
  if (S.rota !== 'historico') return;
  $('#main').innerHTML = cabecalho('Histórico', 'Todas as movimentações, permanentes e rastreáveis por usuário.',
    `<button class="btn" id="h-xlsx">Exportar Excel</button><button class="btn" id="h-pdf">Exportar PDF</button>`) + `
    <div class="filtros">
      <label class="campo"><span>De</span><input class="inp" type="date" id="h-de" value="${filtroHist.de}"></label>
      <label class="campo"><span>Até</span><input class="inp" type="date" id="h-ate" value="${filtroHist.ate}"></label>
      <label class="campo"><span>Tipo</span><select class="inp" id="h-tipo"><option value="">Todos</option>${Object.entries(TIPO_NOME).map(([k, v]) => `<option value="${k}" ${filtroHist.tipo === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label class="campo"><span>Motivo</span><select class="inp" id="h-motivo"><option value="">Todos</option>${S.ref.motivos.map(m => `<option ${filtroHist.motivo === m.nome ? 'selected' : ''}>${esc(m.nome)}</option>`).join('')}</select></label>
      <label class="campo"><span>Usuário</span><select class="inp" id="h-usuario"><option value="">Todos</option>${(usuarios || []).map(u => `<option value="${u.id}" ${filtroHist.usuario === u.id ? 'selected' : ''}>${esc(u.nome)}</option>`).join('')}</select></label>
      <label class="campo busca"><span>Produto</span><input class="inp" id="h-produto" placeholder="Código ou descrição" value="${esc(filtroHist.produto)}"></label>
      <button class="btn pri" id="h-buscar">Filtrar</button>
    </div>
    <div class="tw" id="h-tab"><div class="vazio">Carregando…</div></div>
    <p class="muted" style="font-size:13px">Datas pela data de referência do lançamento (data da produção ou da saída). Clique no número para ver o lançamento completo.</p>`;
  atualizarLive();
  const ler = () => { ['de', 'ate', 'tipo', 'motivo', 'usuario', 'produto'].forEach(k => filtroHist[k] = $('#h-' + k).value.trim()); buscarHistorico(); };
  $('#h-buscar').addEventListener('click', ler);
  $('#h-produto').addEventListener('keydown', e => { if (e.key === 'Enter') ler(); });
  $('#h-xlsx').addEventListener('click', () => exportarHistorico('xlsx'));
  $('#h-pdf').addEventListener('click', () => exportarHistorico('pdf'));
  buscarHistorico();
}
async function buscarHistorico() {
  let q = sb.from('vw_movimentacoes').select('*').order('criado_em', { ascending: false }).order('codigo').limit(3000);
  if (filtroHist.de) q = q.gte('data_referencia', filtroHist.de);
  if (filtroHist.ate) q = q.lte('data_referencia', filtroHist.ate);
  if (filtroHist.tipo) q = q.eq('tipo', filtroHist.tipo);
  if (filtroHist.motivo) q = q.eq('motivo', filtroHist.motivo);
  if (filtroHist.usuario) q = q.eq('usuario_id', filtroHist.usuario);
  if (filtroHist.produto) { const t = filtroHist.produto.replace(/[%,()]/g, ' ').trim(); q = q.or(`codigo.ilike.%${t}%,descricao.ilike.%${t}%`); }
  const { data, error } = await q;
  const box = $('#h-tab'); if (!box) return;
  if (error) return box.innerHTML = `<div class="msg erro">${esc(erroTexto(error))}</div>`;
  histDados = data;
  const ent = data.filter(m => m.sinal > 0), sai = data.filter(m => m.sinal < 0);
  box.innerHTML = data.length ? `<table class="larga"><thead><tr><th>Data ref.</th><th>Lançado em</th><th>Nº</th><th>Tipo / motivo</th><th>Código</th><th>Descrição</th><th class="r">Peças</th><th class="r">m³</th><th class="r">Saldo após</th><th>Usuário</th><th>Referência</th></tr></thead><tbody>
    ${data.map(m => `<tr><td>${dataBR(m.data_referencia)}</td><td class="muted">${horaBR(m.criado_em)}</td>
      <td><a href="#" data-l="${m.lancamento_id}" class="num">${m.numero}</a>${m.estornado_por_numero ? ` <span class="tag warn">estornado</span>` : ''}</td>
      <td><span class="tag ${TIPO_TAG[m.tipo]}">${TIPO_NOME[m.tipo]}</span> ${esc(m.motivo || '')}</td><td class="cod">${esc(m.codigo)}</td>
      <td class="desc">${esc(m.descricao)} <span class="muted">${esc([m.classificacao, m.acabamento].filter(Boolean).join(' '))}</span></td>
      <td class="r num ${m.sinal > 0 ? 'pos' : 'neg'}">${m.sinal > 0 ? '+' : '−'}${pc(m.quantidade)}</td><td class="r num">${m3(m.m3)}</td>
      <td class="r num">${pc(m.saldo_posterior)}</td><td>${esc(m.usuario_nome)}</td><td>${esc(m.referencia || '')}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="6">${pc(data.length)} movimentações${data.length >= 3000 ? ' (limite atingido — reduza o período)' : ''}</td>
      <td class="r num" colspan="2"><span class="pos">+${m3(ent.reduce((a, m) => a + Number(m.m3), 0))}</span> / <span class="neg">−${m3(sai.reduce((a, m) => a + Number(m.m3), 0))}</span> m³</td><td colspan="3"></td></tr></tfoot></table>`
    : '<div class="vazio">Nenhuma movimentação nesse período. Amplie as datas ou limpe os filtros.</div>';
  $$('#h-tab [data-l]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); detalheLancamento(a.dataset.l); }));
}
async function detalheLancamento(id) {
  const { data, error } = await sb.from('vw_movimentacoes').select('*').eq('lancamento_id', id).order('codigo');
  if (error || !data.length) return toast(error ? erroTexto(error) : 'Lançamento não encontrado.', 'erro');
  const l = data[0];
  const podeEstornar = ehAdmin() && !['ESTORNO', 'IMPLANTACAO'].includes(l.tipo) && !l.estornado_por_numero;
  if (l.tipo === 'SAIDA') sb.from('vw_processo_itens').select('numero,tipo,setor,status,quantidade,processada,perda').eq('lancamento_id', id).then(({ data: pi }) => {
    if (!pi?.length || !$('#l-proc')) return;
    const pend = pi.reduce((a, x) => a + x.quantidade - x.processada, 0);
    $('#l-proc').innerHTML = `<div class="msg" style="margin-bottom:12px">Gerou a <a href="#/pendencias">pendência nº ${pi[0].numero}</a> — ${PROC_NOME[pi[0].tipo]} → ${esc(pi[0].setor)} · ${pi[0].status === 'ABERTO' ? `${pc(pend)} pç pendentes` : pi[0].status === 'CONCLUIDO' ? 'concluída' : 'cancelada'}.</div>`;
  });
  const fechar = modal(`<h3>Lançamento nº ${l.numero} <span class="tag ${TIPO_TAG[l.tipo]}">${TIPO_NOME[l.tipo]}</span></h3>
    <div class="grid g3" style="margin-bottom:14px;font-size:14px">
      <div><div class="muted">Data de referência</div><b>${dataBR(l.data_referencia)}</b></div>
      <div><div class="muted">Lançado por</div><b>${esc(l.usuario_nome)}</b><div class="muted">${horaBR(l.criado_em)}</div></div>
      <div><div class="muted">Motivo / referência</div><b>${esc(l.motivo || '—')}</b><div>${esc(l.referencia || '')}</div></div>
    </div>
    ${l.observacao ? `<div class="msg" style="margin-bottom:12px">${esc(l.observacao)}</div>` : ''}
    ${l.autorizado_sem_saldo ? '<div class="msg erro" style="margin-bottom:12px">Saída autorizada pelo administrador acima do saldo disponível.</div>' : ''}
    <div id="l-proc"></div>
    ${l.estornado_por_numero ? `<div class="msg" style="margin-bottom:12px">Este lançamento foi estornado pelo lançamento nº ${l.estornado_por_numero}.</div>` : ''}
    <div class="tw" style="max-height:44vh"><table><thead><tr><th>Código</th><th>Descrição</th><th class="r">Peças</th><th class="r">m³</th><th class="r">Saldo antes → depois</th></tr></thead><tbody>
      ${data.map(m => `<tr><td class="cod">${esc(m.codigo)}</td><td>${esc(m.descricao)} <span class="muted">${esc([m.classificacao, m.acabamento].filter(Boolean).join(' '))}</span></td>
        <td class="r num ${m.sinal > 0 ? 'pos' : 'neg'}">${m.sinal > 0 ? '+' : '−'}${pc(m.quantidade)}</td><td class="r num">${m3(m.m3)}</td><td class="r num">${pc(m.saldo_anterior)} → ${pc(m.saldo_posterior)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="acoes">${podeEstornar ? '<button class="btn out" id="l-estornar">Estornar lançamento</button>' : ''}<button class="btn pri" data-fechar>Fechar</button></div>`, { wide: true });
  $('#l-estornar')?.addEventListener('click', () => {
    fechar();
    modal(`<h3>Estornar lançamento nº ${l.numero}</h3><p>O lançamento original continua no histórico. Será gravado um novo lançamento com as quantidades invertidas.</p>
      <label class="campo"><span>Justificativa (obrigatória)</span><textarea class="inp" id="e-just" maxlength="500"></textarea></label>
      <div class="acoes"><button class="btn" data-fechar>Voltar</button><button class="btn out" id="e-ok">Estornar</button></div>`, {
      onMount: (el, close) => $('#e-ok', el).addEventListener('click', async () => {
        const j = $('#e-just', el).value.trim();
        if (j.length < 5) return toast('Escreva a justificativa do estorno.', 'erro');
        const { data: r, error: e } = await sb.rpc('estornar_lancamento', { p_lancamento_id: id, p_justificativa: j });
        if (e) return toast(e.message === 'SALDO_INSUFICIENTE' ? 'Não é possível estornar: o saldo atual de algum item ficaria negativo.' : erroTexto(e), 'erro');
        close(); toast(`Estorno registrado (lançamento nº ${r.numero}).`, 'ok');
        await carregarEstoque().catch(() => {});
        if (S.rota === 'historico') buscarHistorico(); else navegar();
      })
    });
  });
}

/* =====================================================================
   EXPORTAÇÕES
   ===================================================================== */
function nomeArquivo(base, ext) { return `${base}_${new Date().toLocaleDateString('sv-SE')}.${ext}`; }
function exportarEstoque(fmt) {
  const lista = filtrarEstoque();
  const linhas = lista.map(p => ({ 'Código': p.codigo, 'Tipo': p.categoria, 'Espécie': p.especie, 'Espessura (mm)': Number(p.espessura_mm),
    'Comprimento (m)': Number(p.comprimento_m), 'Largura (m)': Number(p.largura_m), 'Camadas': p.camadas ?? '', 'Descrição': p.descricao,
    'Classificação': p.classificacao || '', 'Acabamento': p.acabamento || '', 'Peças': p.saldo, 'M³': Number(p.m3_total),
    'Mínimo': p.estoque_minimo, 'Situação': STATUS[p.status][0] }));
  if (fmt === 'xlsx') return xlsx(linhas, 'Estoque', nomeArquivo('estoque_celplac', 'xlsx'));
  pdf('Listagem de estoque — produto acabado', `Posição em ${new Date().toLocaleString('pt-BR')} · ${lista.length} itens`,
    ['Código', 'Descrição', 'Classificação', 'Acabamento', 'Peças', 'M³'],
    lista.map(p => [p.codigo, p.descricao, p.classificacao || '—', p.acabamento || '—', pc(p.saldo), m3(p.m3_total)]),
    ['', 'Total', '', '', pc(lista.reduce((a, p) => a + p.saldo, 0)), m3(lista.reduce((a, p) => a + Number(p.m3_total), 0))],
    nomeArquivo('estoque_celplac', 'pdf'), [4, 5]);
}
function exportarHistorico(fmt) {
  if (!histDados.length) return toast('Não há movimentações para exportar.', 'erro');
  const linhas = histDados.map(m => ({ 'Data ref.': dataBR(m.data_referencia), 'Lançado em': horaBR(m.criado_em), 'Nº': m.numero, 'Tipo': TIPO_NOME[m.tipo],
    'Motivo': m.motivo || '', 'Código': m.codigo, 'Descrição': m.descricao, 'Classificação': m.classificacao || '', 'Acabamento': m.acabamento || '',
    'Peças': m.sinal * m.quantidade, 'M³': m.sinal * Number(m.m3), 'Saldo após': m.saldo_posterior, 'Usuário': m.usuario_nome,
    'Referência': m.referencia || '', 'Observação': m.observacao || '' }));
  if (fmt === 'xlsx') return xlsx(linhas, 'Movimentações', nomeArquivo('movimentacoes_celplac', 'xlsx'));
  pdf('Histórico de movimentações', `Período ${dataBR(filtroHist.de)} a ${dataBR(filtroHist.ate)} · ${histDados.length} registros`,
    ['Data', 'Nº', 'Tipo', 'Código', 'Descrição', 'Peças', 'M³', 'Usuário', 'Ref.'],
    histDados.map(m => [dataBR(m.data_referencia), m.numero, `${TIPO_NOME[m.tipo]} ${m.motivo || ''}`, m.codigo, m.descricao,
      (m.sinal > 0 ? '+' : '−') + pc(m.quantidade), m3(m.m3), m.usuario_nome, m.referencia || '']), null,
    nomeArquivo('movimentacoes_celplac', 'pdf'), [5, 6]);
}
function xlsx(linhas, aba, arquivo) {
  if (!window.XLSX) return toast('A exportação para Excel precisa de internet. Abra o sistema no navegador para exportar.', 'erro');
  const ws = XLSX.utils.json_to_sheet(linhas); const wb = XLSX.utils.book_new();
  ws['!cols'] = Object.keys(linhas[0] || {}).map(k => ({ wch: Math.max(k.length + 2, ...linhas.slice(0, 200).map(l => String(l[k] ?? '').length + 1)) }));
  XLSX.utils.book_append_sheet(wb, ws, aba); XLSX.writeFile(wb, arquivo);
}
function pdf(titulo, sub, cab, corpo, rodape, arquivo, colsDir = []) {
  if (!window.jspdf) return toast('A exportação para PDF precisa de internet. Abra o sistema no navegador para exportar.', 'erro');
  const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  doc.setFillColor(30, 42, 47); doc.rect(0, 0, 297, 22, 'F');
  doc.setTextColor(255); doc.setFontSize(15); doc.text('CELPLAC Ind. de Compensados — ' + titulo, 12, 10);
  doc.setFontSize(9.5); doc.setTextColor(200, 210, 212); doc.text(sub, 12, 16.5);
  const colStyles = {}; colsDir.forEach(i => colStyles[i] = { halign: 'right' });
  doc.autoTable({ head: [cab], body: corpo, foot: rodape ? [rodape] : undefined, startY: 27, theme: 'grid',
    styles: { fontSize: 8, cellPadding: 1.6, lineColor: [217, 221, 214], lineWidth: .1 },
    headStyles: { fillColor: [46, 111, 106], textColor: 255 }, footStyles: { fillColor: [242, 243, 239], textColor: 30, fontStyle: 'bold' },
    columnStyles: colStyles, margin: { left: 12, right: 12 },
    didDrawPage: () => { doc.setFontSize(8); doc.setTextColor(120); doc.text(`Emitido em ${new Date().toLocaleString('pt-BR')} por ${S.perfil.nome} · página ${doc.internal.getNumberOfPages()}`, 12, 204); } });
  doc.save(arquivo);
}

      </div>
      <div class="grid g2">
        <label class="campo"><span>Classificação</span><select class="inp" name="classificacao_id">${sel(S.ref.classificacoes, p?.classificacao_id, 'Sem classificação')}</select></label>
        <label class="campo"><span>Acabamento / linha</span><select class="inp" name="acabamento_id">${sel(S.ref.acabamentos, p?.acabamento_id, 'Nenhum')}</select></label>

        <label class="campo"><span>Estoque máximo (pç)</span><input class="inp" name="estoque_maximo" type="number" step="1" min="0" value="${p?.estoque_maximo ?? ''}" placeholder="—"></label>

      </div>

      ${p && !p.revisado ? `<label class="check"><input type="checkbox" name="revisado" checked style="accent-color:var(--brand)"><span>Marcar como revisado (cadastrado por ${esc(p.criado_por_nome || 'encarregado')})</span></label>` : ''}
      <div class="muted" id="fp-m3" style="font-size:14px"></div>
      ${p ? '' : '<div class="muted" style="font-size:13px">O código é gerado automaticamente: tipo-espécie-espessura-sequência (ex.: CP-PI-18-014).</div>'}

    wide: true, onMount: (el, close) => {

      f.addEventListener('submit', async e => {

        const reg = { categoria_id: +f.categoria_id.value, especie_id: +f.especie_id.value, espessura_mm: num(f.espessura_mm.value),
          comprimento_m: num(f.comprimento_m.value), largura_m: num(f.largura_m.value), camadas: num(f.camadas.value),
          classificacao_id: num(f.classificacao_id.value), acabamento_id: num(f.acabamento_id.value), estoque_minimo: num(f.estoque_minimo.value) ?? 0,

function cadAux(t) {

    ${linhas.map(r => `<tr>${A.campos.map(([c]) => `<td>${esc(c === 'tipo' ? TIPO_MOTIVO[r[c]] : r[c])}</td>`).join('')}

  const form = r => modal(`<h3>${r ? 'Editar' : 'Adicionar'} — ${A.nome}</h3><form id="f-aux" class="grid">

      : `<label class="campo"><span>${l}</span><input class="inp" name="${c}" ${c === 'ordem' ? 'type="number"' : ''} ${c === 'sigla' ? 'maxlength="3" style="text-transform:uppercase"' : ''} required value="${esc(r?.[c] ?? '')}" ${c === 'sigla' && r ? 'readonly title="A sigla faz parte dos códigos já gerados"' : ''}></label>`).join('')}
    <label class="check"><input type="checkbox" name="ativo" ${!r || r.ativo ? 'checked' : ''} style="accent-color:var(--brand)"><span>Ativo</span></label>
    <div class="acoes">${r ? '<button type="button" class="btn out" id="aux-del">Excluir</button>' : ''}<button type="button" class="btn" data-fechar>Cancelar</button><button class="btn pri">Salvar</button></div></form>`, {
    onMount: (el, close) => {
      const f = $('#f-aux', el);
      f.addEventListener('submit', async e => {
        e.preventDefault();

        A.campos.forEach(([c]) => { if (r && (c === 'tipo' || c === 'sigla')) return; reg[c] = c === 'ordem' ? +f[c].value : c === 'sigla' ? f[c].value.trim().toUpperCase() : f[c].value.trim(); });

        close(); toast('Excluído.', 'ok'); await carregarRef(); renderCadastros();
      });

  });

      try {
        if (!u) {
          const { data, error } = await sb.functions.invoke('admin-usuarios', { body: { acao: 'criar', nome: f.nome.value.trim(), email: f.email.value.trim(), senha: f.senha.value, papel: f.papel.value } });
          const msg = await erroFn(error, data); if (msg) throw new Error(msg);
          toast(`Usuário ${f.nome.value.trim()} criado.`, 'ok');
        } else {
          const { error } = await sb.rpc('admin_atualizar_usuario', { p_id: u.id, p_nome: f.nome.value.trim(), p_papel: f.papel.value, p_ativo: f.ativo.checked });
          if (error) throw error;
          if (f.senha.value) {
            const { data, error: e2 } = await sb.functions.invoke('admin-usuarios', { body: { acao: 'redefinir_senha', id: u.id, senha: f.senha.value } });
            const msg = await erroFn(e2, data); if (msg) throw new Error(msg);
          }
          toast('Usuário atualizado.', 'ok');
        }
        close(); renderUsuarios();
      } catch (err) { toast(erroTexto(err), 'erro'); btn.disabled = false; }
    })
  });
}

/* =====================================================================
   CONSULTA GUIADA — Espécie › Bitola › Dimensões › Estoque
   Opções derivadas do cadastro real (vw_estoque já carregado e atualizado
   em tempo real). Nada fixo no código. Seleções ficam só na memória da
   sessão (S.consulta) — nada é gravado no navegador.
   ===================================================================== */
S.consulta = { especie: null, espessura: null, dim: null, aviso: null };
const PASSOS = ['Espécie', 'Bitola', 'Dimensões', 'Estoque'];
const LAMINAS = [['#EAD6A6', '#D1B072'], ['#CF9873', '#AC6D4D'], ['#A3744C', '#7A5032']];
const mmDe = m => Math.round(Number(m) * 1000);
const dimKey = p => `${mmDe(p.comprimento_m)}x${mmDe(p.largura_m)}`;
const dimTexto = k => { const [c, l] = k.split('x').map(Number); return `${nfI.format(c)} x ${nfI.format(l)} mm`; };
const bitolaTexto = e => { const n = Number(e); return (Number.isInteger(n) ? String(n).padStart(2, '0') : String(n).replace('.', ',')) + ' mm'; };
const baseConsulta = () => S.estoque.filter(p => p.ativo || p.saldo !== 0);
const resumoDe = l => ({ itens: l.length, pc: l.reduce((a, p) => a + p.saldo, 0), m3: l.reduce((a, p) => a + Number(p.m3_total), 0) });
function opcoesEspecie() {
  const base = baseConsulta();
  return S.ref.especies.map(e => ({ id: e.id, nome: e.nome, ...resumoDe(base.filter(p => p.especie_id === e.id)) })).filter(o => o.itens > 0);
}
function opcoesBitola(esp) {
  const base = baseConsulta().filter(p => p.especie_id === esp);
  return [...new Set(base.map(p => Number(p.espessura_mm)))].sort((a, b) => a - b)
    .map(v => ({ v, ...resumoDe(base.filter(p => Number(p.espessura_mm) === v)) }));
}
function opcoesDim(esp, bit) {
  const base = baseConsulta().filter(p => p.especie_id === esp && Number(p.espessura_mm) === bit);
  return [...new Set(base.map(dimKey))]
    .sort((a, b) => { const [c1, l1] = a.split('x').map(Number), [c2, l2] = b.split('x').map(Number); return c1 - c2 || l1 - l2; })
    .map(k => { const l = base.filter(p => dimKey(p) === k); return { k, cats: [...new Set(l.map(p => p.categoria))], ...resumoDe(l) }; });
}
const produtosDaConsulta = C => baseConsulta().filter(p => p.especie_id === C.especie && Number(p.espessura_mm) === C.espessura && dimKey(p) === C.dim);

// Se uma opção deixou de existir no cadastro, limpa a seleção e avisa
function validarConsulta() {
  const C = S.consulta;
  if (C.especie && !opcoesEspecie().some(o => o.id === C.especie)) {
    Object.assign(C, { especie: null, espessura: null, dim: null, aviso: 'A espécie selecionada não tem mais produtos cadastrados. Selecione novamente.' });
  }
  if (C.especie && C.espessura != null && !opcoesBitola(C.especie).some(o => o.v === C.espessura)) {
    Object.assign(C, { espessura: null, dim: null, aviso: 'A bitola selecionada não está mais cadastrada para esta espécie. Selecione novamente.' });
  }
  if (C.espessura != null && C.dim && !opcoesDim(C.especie, C.espessura).some(o => o.k === C.dim)) {
    Object.assign(C, { dim: null, aviso: 'A dimensão selecionada não está mais cadastrada para esta bitola. Selecione novamente.' });
  }
}
const etapaMaxima = () => { const C = S.consulta; return !C.especie ? 1 : C.espessura == null ? 2 : !C.dim ? 3 : 4; };
function irEtapa(e) { const h = `#/consulta?e=${e}`; if (location.hash === h) renderConsulta(); else location.hash = h; }
function novaConsulta() { S.consulta = { especie: null, espessura: null, dim: null, aviso: null }; irEtapa(1); }

function renderConsulta() {
  validarConsulta();
  const C = S.consulta;
  const pedida = +new URLSearchParams(location.hash.split('?')[1] || '').get('e') || 1;
  const e = Math.min(Math.max(pedida, 1), etapaMaxima());
  if (e !== pedida) history.replaceState(null, '', `#/consulta?e=${e}`);
  const esp = S.ref.especies.find(x => x.id === C.especie);
  const escolhas = [esp?.nome, C.espessura != null ? bitolaTexto(C.espessura) : null, C.dim ? dimTexto(C.dim) : null];
  const aviso = C.aviso; C.aviso = null;

  const passos = PASSOS.map((nome, i) => {
    const n = i + 1, atual = n === e, feito = !atual && n < 4 && !!escolhas[i], pode = n <= etapaMaxima();
    return `<button class="passo ${atual ? 'atual' : ''} ${feito ? 'feito' : ''}" data-ir="${n}" ${pode && !atual ? '' : 'disabled'} ${atual ? 'aria-current="step"' : ''}>
      <span class="n">${n}</span><span class="t">${nome}<small>${esc(escolhas[i] || (atual ? (n === 4 ? 'Resultado' : 'Escolha') : ''))}</small></span></button>`;
  }).join('');
  const trilha = ['Estoque', ...escolhas.slice(0, e - 1)].map((t, i) =>
    i === 0 ? `<span>${esc(t)}</span>` : `<a href="#/consulta?e=${i}">${esc(t).replace(' x ', ' <span style="text-transform:none">x</span> ')}</a>`).join('<span class="sep" aria-hidden="true">›</span>');

  let corpo = '', podeAvancar = false;
  if (e === 1) {
    const ops = opcoesEspecie(); podeAvancar = !!C.especie;
    corpo = `<h3 class="perg">Qual espécie?</h3>` + (ops.length ? `<div class="cards especies">${ops.map((o, i) => {
      const [a, b] = LAMINAS[i % LAMINAS.length];
      return `<button class="cartao esp ${o.id === C.especie ? 'sel' : ''}" data-v="${o.id}" aria-pressed="${o.id === C.especie}">
        <span class="lamina" style="background:repeating-linear-gradient(180deg,${a} 0 7px,${b} 7px 14px)"></span>
        <span class="nome">${esc(o.nome)}</span>
        <span class="det">${pc(o.itens)} itens · ${pc(o.pc)} pç · ${m3(o.m3)} m³</span><span class="ok" aria-hidden="true">✓</span></button>`;
    }).join('')}</div>` : '<div class="msg">Nenhum produto cadastrado. Cadastre produtos em Cadastros › Produtos.</div>');
  } else if (e === 2) {
    const ops = opcoesBitola(C.especie); podeAvancar = C.espessura != null;
    corpo = `<h3 class="perg">Qual bitola de ${esc(esp.nome)}?</h3>` + (ops.length ? `<div class="cards">${ops.map(o => `
      <button class="cartao ${o.v === C.espessura ? 'sel' : ''} ${o.pc <= 0 ? 'zero' : ''}" data-v="${o.v}" aria-pressed="${o.v === C.espessura}">
        <span class="nome num">${bitolaTexto(o.v)}</span>
        <span class="det">${pc(o.itens)} ${o.itens > 1 ? 'itens' : 'item'} · ${o.pc > 0 ? `${pc(o.pc)} pç · ${m3(o.m3)} m³` : 'sem saldo'}</span><span class="ok" aria-hidden="true">✓</span></button>`).join('')}${podeLancar() ? '<button class="cartao novo" id="c-novo"><span class="nome">+ Nova bitola</span><span class="det">Chapa produzida que ainda não tem cadastro</span></button>' : ''}</div>`
      : '<div class="msg">Nenhuma bitola cadastrada para esta espécie.</div>');
  } else if (e === 3) {
    const ops = opcoesDim(C.especie, C.espessura); podeAvancar = !!C.dim;
    corpo = `<h3 class="perg">Qual dimensão? <span class="muted">comprimento x largura</span></h3>` + (ops.length ? `<div class="cards">${ops.map(o => `
      <button class="cartao ${o.k === C.dim ? 'sel' : ''} ${o.pc <= 0 ? 'zero' : ''}" data-v="${o.k}" aria-pressed="${o.k === C.dim}">
        <span class="nome num dim">${dimTexto(o.k)}</span>
        <span class="det">${esc(o.cats.join(' e '))} · ${pc(o.itens)} ${o.itens > 1 ? 'itens' : 'item'}</span>
        <span class="det">${o.pc > 0 ? `${pc(o.pc)} pç · ${m3(o.m3)} m³` : 'sem saldo'}</span><span class="ok" aria-hidden="true">✓</span></button>`).join('')}${podeLancar() ? '<button class="cartao novo" id="c-novo"><span class="nome">+ Nova dimensão</span><span class="det">Chapa produzida que ainda não tem cadastro</span></button>' : ''}</div>`
      : '<div class="msg">Nenhuma dimensão cadastrada para esta bitola.</div>');
  } else {
    corpo = '<div id="c-res"><div class="vazio">Consultando estoque…</div></div>';
  }

  $('#main').innerHTML = cabecalho('Consultar estoque', 'Escolha a espécie, a bitola e a dimensão para ver o saldo.') + `
    <nav class="passos" aria-label="Etapas da consulta">${passos}</nav>
    ${aviso ? `<div class="msg" style="margin-bottom:14px">${esc(aviso)}</div>` : ''}
    <div class="trilha" aria-label="Caminho">${trilha}</div>
    ${corpo}
    <div class="rodape-passo">
      <button class="btn lg" id="c-voltar" ${e === 1 ? 'disabled' : ''}>Voltar</button>
      <span style="flex:1"></span>
      ${C.especie ? '<button class="btn lg ghost" id="c-nova">Nova consulta</button>' : ''}
      ${e < 4 ? `<button class="btn lg pri" id="c-avancar" ${podeAvancar ? '' : 'disabled'}>Avançar</button>` : ''}
    </div>`;
  atualizarLive();

  $$('.passo[data-ir]').forEach(b => b.addEventListener('click', () => irEtapa(+b.dataset.ir)));
  $('#c-voltar').addEventListener('click', () => irEtapa(e - 1));
  $('#c-nova')?.addEventListener('click', novaConsulta);
  $('#c-avancar')?.addEventListener('click', () => irEtapa(e + 1));
  $('#c-novo')?.addEventListener('click', () => cadastroRapido({ especie_id: C.especie, espessura: e === 3 ? C.espessura : null, aoCriar: p => {
    if (!p) return;
    Object.assign(C, { especie: p.especie_id, espessura: Number(p.espessura_mm), dim: dimKey(p) });
    modal(`<h3>Chapa cadastrada</h3><p><span class="cod">${esc(p.codigo)}</span> — ${esc(p.descricao)} ${esc(qualidade(p))}</p><p class="muted">Quer lançar a produção desta chapa agora?</p>
      <div class="acoes"><button class="btn" data-fechar id="cn-ver">Ver no estoque</button><button class="btn in lg" id="cn-ent">Lançar entrada</button></div>`, {
      onMount: (el, close) => {
        $('#cn-ver', el).addEventListener('click', () => irEtapa(4));
        $('#cn-ent', el).addEventListener('click', () => {
          close(); const R = S.rascunhos.ENTRADA ||= novoRascunho('ENTRADA');
          if (!R.linhas.some(l => l.produto_id === p.id)) R.linhas.push({ produto_id: p.id, quantidade: 1 });
          location.hash = '#/entrada'; toast('Chapa adicionada à entrada. Ajuste a quantidade de peças e registre.');
        });
      }
    });
  } }));
  $$('.cartao[data-v]').forEach(b => {
    const escolher = () => {
      const v = b.dataset.v;
      if (e === 1 && +v !== C.especie) Object.assign(C, { especie: +v, espessura: null, dim: null });
      if (e === 2 && +v !== C.espessura) Object.assign(C, { espessura: +v, dim: null });
      if (e === 3) C.dim = v;
      $$('.cartao[data-v]').forEach(x => { x.classList.toggle('sel', x === b); x.setAttribute('aria-pressed', x === b); });
      const av = $('#c-avancar'); if (av) av.disabled = false;
      $$('.passo .t small').forEach((s, i) => { if (i === e - 1) s.textContent = b.querySelector('.nome').textContent; });
    };
    b.addEventListener('click', escolher);
    b.addEventListener('dblclick', () => { escolher(); irEtapa(e + 1); });
  });
  if (e === 4) desenharResultado({ ...C });
}

async function desenharResultado(C) {
  const prods = produtosDaConsulta(C);
  const box = $('#c-res');
  if (!prods.length) {
    box.innerHTML = `<div class="msg">Não há produto cadastrado para esta combinação. Escolha outra dimensão ou cadastre o produto em Cadastros › Produtos.</div>`;
    return;
  }
  const tok = S._tokConsulta = (S._tokConsulta || 0) + 1;
  const ids = prods.map(p => p.id);
  const [rs, rr] = await Promise.all([
    sb.from('saldos').select('produto_id,local_id,quantidade').in('produto_id', ids),
    sb.from('reservas').select('produto_id,local_id,quantidade,consumida,liberada').eq('status', 'ATIVA').in('produto_id', ids)]);
  if (tok !== S._tokConsulta || !$('#c-res')) return;
  const error = rs.error || rr.error, data = rs.data;
  if (error) { $('#c-res').innerHTML = `<div class="msg erro">${esc(erroTexto(error))}</div>`; return; }
  const resDe = (pid, loc) => rr.data.filter(x => x.produto_id === pid && x.local_id === loc).reduce((a, x) => a + x.quantidade - x.consumida - x.liberada, 0);
  const locNome = id => S.ref.locais.find(l => l.id === id)?.nome || 'Sem localização';
  const grupos = prods.map(p => {
    const pos = data.filter(s => s.produto_id === p.id).sort((a, b) => a.local_id - b.local_id);
    const posicoes = (pos.length ? pos : [{ local_id: null, quantidade: 0 }]).map(s => ({ ...s, reservado: s.local_id ? resDe(p.id, s.local_id) : 0 }));
    const total = posicoes.reduce((a, s) => a + s.quantidade, 0), reservado = posicoes.reduce((a, s) => a + s.reservado, 0);
    return { p, posicoes, total, reservado, disponivel: total - reservado };
  });
  const totPc = grupos.reduce((a, g) => a + g.total, 0), totRes = grupos.reduce((a, g) => a + g.reservado, 0), totDisp = totPc - totRes;
  const totM3 = grupos.reduce((a, g) => a + g.disponivel * Number(g.p.m3_peca), 0);
  const nLocais = new Set(grupos.flatMap(g => g.posicoes.filter(s => s.quantidade !== 0).map(s => s.local_id))).size;
  const semEstoque = totDisp <= 0;
  const qtd = n => `<span class="${n < 0 ? 'neg' : n === 0 ? 'muted' : ''}">${pc(n)}</span>`;
  const celulasProd = p => `<td class="cod">${esc(p.codigo)}</td><td class="desc">${esc(p.descricao)} <span class="muted">${esc(qualidade(p))}</span></td>
    <td>${esc(p.especie)}</td><td class="r num">${bitolaTexto(p.espessura_mm)}</td><td class="r num">${nfI.format(mmDe(p.comprimento_m))} mm</td><td class="r num">${nfI.format(mmDe(p.largura_m))} mm</td>`;
  const linhas = grupos.map(g => {
    if (g.posicoes.length === 1) {
      const s = g.posicoes[0];
      return `<tr class="click" data-p="${g.p.id}">${celulasProd(g.p)}<td>${esc(s.local_id ? locNome(s.local_id) : '—')}</td><td class="r num">${qtd(s.quantidade - s.reservado)}</td><td>pç</td>
        <td class="r num">${s.reservado ? pc(s.reservado) : '<span class="muted">—</span>'}</td><td class="r num"><b>${qtd(s.quantidade)}</b></td></tr>`;
    }
    return `<tr class="consol click" data-p="${g.p.id}">${celulasProd(g.p)}<td>Consolidado (${g.posicoes.length} locais)</td><td class="r num">${qtd(g.disponivel)}</td><td>pç</td>
        <td class="r num">${g.reservado ? pc(g.reservado) : '<span class="muted">—</span>'}</td><td class="r num"><b>${qtd(g.total)}</b></td></tr>`
      + g.posicoes.map(s => `<tr class="sub"><td colspan="6"></td><td>↳ ${esc(locNome(s.local_id))}</td><td class="r num">${qtd(s.quantidade - s.reservado)}</td><td>pç</td><td class="r num">${s.reservado ? pc(s.reservado) : '<span class="muted">—</span>'}</td><td class="r num">${qtd(s.quantidade)}</td></tr>`).join('');
  }).join('');
  const cartoes = grupos.map(g => `<div class="res-card">
      <div class="topo-card"><span class="cod">${esc(g.p.codigo)}</span><b class="num">${qtd(g.disponivel)} pç</b></div>
      ${g.reservado ? `<div class="muted">${pc(g.total)} no estoque · ${pc(g.reservado)} reservadas</div>` : ''}
      <div>${esc(g.p.descricao)} <span class="muted">${esc(qualidade(g.p))}</span></div>
      ${g.posicoes.map(s => `<div class="pos"><span>${esc(s.local_id ? locNome(s.local_id) : 'Sem localização')}</span><span class="num">${qtd(s.quantidade)} pç · ${m3(s.quantidade * g.p.m3_peca)} m³</span></div>`).join('')}
      ${g.posicoes.length > 1 ? `<div class="pos tot"><span>Total consolidado</span><span class="num">${qtd(g.total)} pç</span></div>` : ''}
      ${podeLancar() ? `<div class="acao"><button class="btn sm" data-reservar="${g.p.id}">Reservar</button></div>` : ''}
    </div>`).join('');

  $('#c-res').innerHTML = `
    ${semEstoque ? `<div class="sem-estoque">NÃO EXISTE ESTOQUE DISPONÍVEL PARA ESTA COMBINAÇÃO.<small>${prods.length > 1 ? `Os ${prods.length} produtos abaixo estão cadastrados` : 'O produto abaixo está cadastrado'}, mas sem saldo.</small></div>`
      : `<div class="res-kpis"><div class="kpi estoque"><div class="v num">${pc(totDisp)}<small>pç</small></div><div class="l">Disponível nesta combinação${totRes ? ` · ${pc(totRes)} reservadas` : ''}</div></div>
         <div class="kpi"><div class="v num">${m3(totM3)}<small>m³</small></div><div class="l">Volume disponível</div></div>
         <div class="kpi"><div class="v num">${pc(prods.length)}<small>${prods.length > 1 ? 'itens' : 'item'}</small></div><div class="l">em ${nLocais} ${nLocais === 1 ? 'localização' : 'localizações'}</div></div></div>`}
    <div class="tw res-tabela"><table><thead><tr><th>Código</th><th>Descrição</th><th>Espécie</th><th class="r">Bitola</th><th class="r">Compr.</th><th class="r">Largura</th>
      <th>Localização</th><th class="r">Disponível</th><th>Unid.</th><th class="r">Reservado</th><th class="r">Total</th></tr></thead>
      <tbody>${linhas}</tbody>
      <tfoot><tr><td colspan="7">${pc(prods.length)} ${prods.length > 1 ? 'itens' : 'item'}</td><td class="r num">${qtd(totDisp)}</td><td>pç</td><td class="r num">${pc(totRes)}</td><td class="r num">${qtd(totPc)}</td></tr></tfoot></table></div>
    <div class="res-cartoes">${cartoes}</div>
    <p class="muted" style="font-size:13px;margin-top:10px">Disponível = total − reservado. Clique em um item para ver as movimentações ou reservar.</p>`;
  $$('#c-res [data-p]').forEach(tr => tr.addEventListener('click', () => detalheProduto(+tr.dataset.p)));
  $$('#c-res [data-reservar]').forEach(b => b.addEventListener('click', () => reservarProduto(S.estoqueMap.get(+b.dataset.reservar))));
}

/* =====================================================================
   SELETOR DE PRODUTO (usado nos modais) e CADASTRO RÁPIDO DE CHAPA
   ===================================================================== */
function seletorProduto(box, { onEscolher, placeholder = 'Buscar chapa: código, bitola, espécie… ex.: 18 pinus 2,2', permitirNovo = podeLancar(), novoPadrao = {} } = {}) {
  box.innerHTML = `<div class="picker"><input class="inp" autocomplete="off" placeholder="${esc(placeholder)}"><div class="lista hidden" role="listbox"></div></div>`;
  const inp = $('input', box), lista = $('.lista', box);
  let ops = [], cur = 0;
  const escolher = p => { inp.value = ''; lista.classList.add('hidden'); onEscolher(p); };
  const desenhar = () => {
    const toks = norm(inp.value).split(/\s+/).filter(Boolean);
    ops = toks.length ? S.estoque.filter(p => p.ativo && toks.every(t => p._busca.includes(t))).slice(0, 30) : [];
    cur = 0;
    lista.classList.toggle('hidden', !toks.length);
    lista.innerHTML = ops.map((p, i) => `<div class="op ${i === 0 ? 'sel' : ''}" data-i="${i}"><span class="cod">${esc(p.codigo)}</span><span class="d">${esc(p.descricao)}</span>
        <span class="q num"><b>${pc(p.saldo)}</b> pç</span><span class="x">${esc(qualidade(p))}</span></div>`).join('')
      + (ops.length ? '' : '<div class="vazio" style="padding:14px">Nenhuma chapa encontrada.</div>')
      + (permitirNovo ? '<div class="op novo" data-novo="1"><span class="cod">+</span><span class="d"><b>Chapa sem cadastro?</b> Cadastrar agora</span></div>' : '');
    $$('.op[data-i]', lista).forEach(o => o.addEventListener('mousedown', e => { e.preventDefault(); escolher(ops[+o.dataset.i]); }));
    $('.op[data-novo]', lista)?.addEventListener('mousedown', e => { e.preventDefault(); lista.classList.add('hidden'); cadastroRapido({ ...novoPadrao, aoCriar: escolher }); });
  };
  inp.addEventListener('input', desenhar);
  inp.addEventListener('blur', () => setTimeout(() => lista.classList.add('hidden'), 150));
  inp.addEventListener('keydown', e => {
    if (lista.classList.contains('hidden') || !ops.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); cur = (cur + (e.key === 'ArrowDown' ? 1 : -1) + ops.length) % ops.length;
      $$('.op[data-i]', lista).forEach((o, i) => o.classList.toggle('sel', i === cur));
    }
    if (e.key === 'Enter') { e.preventDefault(); escolher(ops[cur]); }
  });
  return inp;
}

function cadastroRapido({ especie_id = null, espessura = null, aoCriar } = {}) {
  if (!podeLancar()) return;
  const opt = (lista, val, vazio) => `${vazio != null ? `<option value="">${vazio}</option>` : ''}${lista.filter(x => x.ativo).map(x => `<option value="${x.id}" ${x.id === val ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}`;
  modal(`<h3>Cadastrar chapa nova</h3>
    <p class="muted" style="margin:-6px 0 14px">Use quando a produção trouxer uma bitola ou dimensão que ainda não existe no estoque.${ehAdmin() ? '' : ' O administrador revisa o cadastro depois.'}</p>

      <div class="grid g2">
        <label class="campo"><span>Tipo</span><select class="inp" name="categoria">${opt(S.ref.categorias, S.ref.categorias.find(c => c.ativo)?.id)}</select></label>

      </div>
      <div class="grid g3">
        <label class="campo"><span>Bitola (mm)</span><input class="inp num" name="bitola" type="number" step="0.1" min="0.1" required value="${espessura ?? ''}" inputmode="decimal"></label>
        <label class="campo"><span>Comprimento (mm)</span><input class="inp num" name="comp" type="number" step="1" min="1" required placeholder="ex.: 2440" inputmode="numeric"></label>
        <label class="campo"><span>Largura (mm)</span><input class="inp num" name="larg" type="number" step="1" min="1" required placeholder="ex.: 1220" inputmode="numeric"></label>
      </div>

        <label class="campo"><span>Camadas (opcional)</span><input class="inp" name="camadas" type="number" step="1" min="1" inputmode="numeric"></label>
      </div>
      <div id="cr-prev" class="muted" style="min-height:22px"></div>
      <div class="acoes"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn pri" id="cr-ok">Cadastrar chapa</button></div>
    </form>`, {
    wide: true, onMount: (el, close) => {
      const f = $('#f-cr', el);
      const ler = () => ({ cat: +f.categoria.value, esp: +f.especie.value, bit: Number(f.bitola.value), comp: Number(f.comp.value), larg: Number(f.larg.value),
        cl: f.classif.value ? +f.classif.value : null, ac: f.acab.value ? +f.acab.value : null, cam: f.camadas.value ? +f.camadas.value : null });
      const existente = v => S.estoque.find(p => p.categoria_id === v.cat && p.especie_id === v.esp && Number(p.espessura_mm) === v.bit
        && mmDe(p.comprimento_m) === v.comp && mmDe(p.largura_m) === v.larg && (p.camadas ?? null) === v.cam
        && (p.classificacao_id ?? null) === v.cl && (p.acabamento_id ?? null) === v.ac);
      const prev = () => {
        const v = ler();
        if (!(v.bit > 0 && v.comp > 0 && v.larg > 0)) { $('#cr-prev', el).textContent = ''; return; }
        const ex = existente(v);
        $('#cr-prev', el).innerHTML = ex ? `<span class="tag aj">Já cadastrada</span> <span class="cod">${esc(ex.codigo)}</span> — ${esc(ex.descricao)}${qualidade(ex) !== '—' ? ' ' + esc(qualidade(ex)) : ''}. Ela será usada.`
          : `Nova chapa: <b>${esc(bitolaTexto(v.bit))} · ${dimTexto(`${v.comp}x${v.larg}`)}</b> · ${(v.bit / 1000 * v.comp / 1000 * v.larg / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 5 })} m³ por peça`;
        $('#cr-ok', el).textContent = ex ? 'Usar esta chapa' : 'Cadastrar chapa';
      };
      f.addEventListener('input', prev); f.addEventListener('change', prev); prev();
      f.addEventListener('submit', async e => {
        e.preventDefault();
        const v = ler();
        if (!(v.bit > 0 && v.bit <= 100)) return toast('Informe a bitola em milímetros.', 'erro');
        if (!(v.comp > 0 && v.comp <= 20000 && v.larg > 0 && v.larg <= 20000)) return toast('Informe comprimento e largura em milímetros (ex.: 2440 e 1220).', 'erro');
        const btn = $('#cr-ok', el); btn.disabled = true;
        const { data, error } = await sb.rpc('cadastrar_produto_rapido', { p_categoria_id: v.cat, p_especie_id: v.esp, p_espessura_mm: v.bit,
          p_comprimento_m: v.comp / 1000, p_largura_m: v.larg / 1000, p_camadas: v.cam, p_classificacao_id: v.cl, p_acabamento_id: v.ac });
        btn.disabled = false;
        if (error) return toast(erroTexto(error), 'erro');
        await carregarEstoque();
        const p = S.estoqueMap.get(data.id);
        close();
        toast(data.existente ? `A chapa ${data.codigo} já existia e foi selecionada.` : `Chapa ${data.codigo} cadastrada${ehAdmin() ? '' : ' — o administrador vai revisar'}.`, 'ok');
        aoCriar?.(p);
      });
    }
  });
}
