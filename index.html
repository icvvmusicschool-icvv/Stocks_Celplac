function reservarProduto(p) {
  if (!podeLancar()) return;
  const livre = Math.max(p.disponivel, 0);
  modal(`<h3>Reservar <span class="cod">${esc(p.codigo)}</span></h3>
    <p class="muted" style="margin:-6px 0 14px">${esc(p.descricao)} ${esc(qualidade(p))}</p>
    <div class="trio"><div><small>Saldo</small><b class="num">${pc(p.saldo)} pç</b></div><div><small>Já reservado</small><b class="num">${pc(p.reservado)} pç</b></div><div><small>Livre para reservar</small><b class="num">${pc(livre)} pç</b></div></div>
    <form id="f-res" class="grid">
      <div class="grid g2">
        <label class="campo"><span>Quantidade a reservar (peças)</span><input class="inp qtd-inp" name="qtd" type="number" min="1" max="${livre}" step="1" required inputmode="numeric"></label>
        <label class="campo"><span>Referência (opcional)</span><input class="inp" name="ref" maxlength="80" placeholder="OP, pedido, cliente"></label>
      </div>
      <label class="campo"><span>Para qual processo ou destino?</span><select class="inp" name="destino" required>
        <option value="">Escolha o setor…</option>${S.ref.setores.filter(x => x.ativo).map(x => `<option>${esc(x.nome)}</option>`).join('')}</select></label>
      <label class="campo"><span>Observação (opcional)</span><textarea class="inp" name="obs" maxlength="300"></textarea></label>
      <p class="muted" style="font-size:13px;margin:0">A quantidade reservada não pode ser vendida. Recuperação e transformação podem usar a chapa e consomem a reserva.</p>
      <div class="acoes"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn pri" ${livre ? '' : 'disabled'}>Reservar</button></div>
    </form>`, {
    onMount: (el, close) => $('#f-res', el).addEventListener('submit', async e => {
      e.preventDefault(); const f = e.target; const n = Number(f.qtd.value);
      if (!Number.isInteger(n) || n <= 0 || n > livre) return toast(`Informe de 1 a ${pc(livre)} peças.`, 'erro');
      if (!f.destino.value) { f.destino.focus(); return toast('Escolha o destino da reserva.', 'erro'); }
      const { error } = await sb.rpc('reservar', { p_produto_id: p.id, p_quantidade: n, p_destino: f.destino.value.trim(), p_referencia: f.ref.value.trim() || null, p_observacao: f.obs.value.trim() || null });
      if (error) return toast(erroTexto(error), 'erro');
      close(); toast(`${pc(n)} peças de ${p.codigo} reservadas para ${f.destino.value}.`, 'ok');
      await carregarEstoque(); if (['reservas', 'estoque', 'consulta'].includes(S.rota)) ROTAS[S.rota].render();
    })
  });
}
let abaRes = 'ATIVA', buscaRes = '';

const PROC_NOME = { RECUPERACAO: 'Recuperação', TRANSFORMACAO: 'Transformação' };
let abaPend = 'ABERTO', minhasPend = null;
async function atualizarPendencias(avisar = false) {
  if (!S.perfil || !veEstoque()) return;
  let q = sb.from('processos').select('id').eq('status', 'ABERTO');
  if (!ehAdmin()) q = q.eq('responsavel_id', S.perfil.id);
  const { data } = await q;
  const n = data?.length || 0; S.nPend = n;
  $$('.badge-pend').forEach(b => { b.textContent = n; b.classList.toggle('hidden', !n); });
  if (avisar && n && podeLancar()) toast(`Você tem ${n} ${n > 1 ? 'pendências' : 'pendência'} de recuperação/transformação para concluir.`);
}
async function renderPendencias() {
  if (minhasPend === null) minhasPend = !ehAdmin();
  $('#main').innerHTML = cabecalho('Pendências', 'Recuperações e transformações enviadas aos setores. Conclua lançando o resultado no novo formato.') + `
    <div class="tabs"><button data-a="ABERTO" class="${abaPend === 'ABERTO' ? 'on' : ''}">Abertas</button><button data-a="FECHADO" class="${abaPend === 'FECHADO' ? 'on' : ''}">Concluídas e canceladas</button></div>
    <div class="seg" id="p-quem" style="margin-bottom:14px"><button data-v="1" class="${minhasPend ? 'on' : ''}">Minhas</button><button data-v="0" class="${minhasPend ? '' : 'on'}">Todas</button></div>
    <div id="p-lista"><div class="vazio">Carregando…</div></div>`;
  atualizarLive();
  $$('.tabs button').forEach(b => b.addEventListener('click', () => { abaPend = b.dataset.a; renderPendencias(); }));
  $$('#p-quem button').forEach(b => b.addEventListener('click', () => { minhasPend = b.dataset.v === '1'; renderPendencias(); }));
  let q = sb.from('vw_processo_itens').select('*').order('criado_em', { ascending: false }).order('codigo').limit(800);
  q = abaPend === 'ABERTO' ? q.eq('status', 'ABERTO') : q.in('status', ['CONCLUIDO', 'CANCELADO']);
  if (minhasPend) q = q.eq('responsavel_id', S.perfil.id);
  const { data, error } = await q;
  if (S.rota !== 'pendencias' || !$('#p-lista')) return;
  if (error) return $('#p-lista').innerHTML = `<div class="msg erro">${esc(erroTexto(error))}</div>`;
  const grupos = []; const idx = new Map();
  data.forEach(i => { if (!idx.has(i.processo_id)) { idx.set(i.processo_id, grupos.length); grupos.push({ ...i, itens: [] }); } grupos[idx.get(i.processo_id)].itens.push(i); });
  $('#p-lista').innerHTML = grupos.length ? grupos.map(g => {
    const pend = g.itens.reduce((a, i) => a + i.pendente, 0);
    return `<section class="pend">
      <header><div><b class="num">Pendência nº ${g.numero}</b> <span class="tag ${g.tipo === 'RECUPERACAO' ? 'aj' : 'warn'}">${PROC_NOME[g.tipo]}</span> <span class="seta">→</span> <b>${esc(g.setor)}</b>
        ${g.status !== 'ABERTO' ? ` <span class="tag ${g.status === 'CONCLUIDO' ? 'in' : 'out'}">${g.status === 'CONCLUIDO' ? 'Concluída' : 'Cancelada'}</span>` : ''}</div>
        <div class="muted">Saída nº ${g.lancamento_numero} em ${dataBR(g.data_referencia)} · por ${esc(g.responsavel_nome)}${g.referencia ? ' · ' + esc(g.referencia) : ''}${g.status === 'ABERTO' ? ` · <b>${pc(pend)} pç pendentes</b>` : ''}</div></header>
      <div class="tw" style="max-height:none;border-radius:0 0 var(--radius) var(--radius);border-top:0"><table><thead><tr><th>Código</th><th>Descrição</th><th class="r">Enviado</th><th class="r">Concluído</th><th class="r">Perda</th><th class="r">Pendente</th><th></th></tr></thead><tbody>
        ${g.itens.map(i => `<tr><td class="cod">${esc(i.codigo)}</td><td class="desc">${esc(i.descricao)} <span class="muted">${esc([i.classificacao, i.acabamento].filter(Boolean).join(' '))}</span></td>
          <td class="r num">${pc(i.quantidade)}</td><td class="r num">${pc(i.processada)}</td><td class="r num ${i.perda ? 'neg' : ''}">${pc(i.perda)}</td><td class="r num"><b>${pc(i.pendente)}</b></td>
          <td class="r">${g.status === 'ABERTO' && i.pendente > 0 && podeLancar() ? `<button class="btn sm in" data-c="${i.id}">Concluir</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div></section>`;
  }).join('') : `<div class="vazio">${abaPend === 'ABERTO' ? 'Nenhuma pendência aberta. Quando alguém lançar uma saída para recuperação ou transformação, ela aparece aqui.' : 'Nenhuma pendência encerrada ainda.'}</div>`;
  $$('[data-c]').forEach(b => b.addEventListener('click', () => concluirItem(data.find(i => i.id === +b.dataset.c))));
}

      seletorProduto($('#c-sel', el), {

          if (!st.saidas.some(s => s.id === p.id)) st.saidas.push({ id: p.id, q: Math.max((Number(f.proc.value) || 0) - (Number(f.perda.value) || 0), 1) });
          desenhar();
          const inp = $(`[data-k="${st.saidas.findIndex(s => s.id === p.id)}"]`, el); inp?.focus(); inp?.select();
        }
      });
      f.addEventListener('input', resumo);
      desenhar();
      f.addEventListener('submit', async e => {
        e.preventDefault();
        const proc = Number(f.proc.value), perda = Number(f.perda.value);
        if (!Number.isInteger(proc) || proc <= 0 || proc > i.pendente) return toast(`Peças processadas: de 1 a ${pc(i.pendente)}.`, 'erro');
        if (!Number.isInteger(perda) || perda < 0 || perda > proc) return toast('A perda não pode ser maior que as peças processadas.', 'erro');
        if (!st.saidas.length && perda < proc) return toast('Adicione o produto resultante, ou informe a perda igual às peças processadas.', 'erro');
        const btn = $('#c-ok', el); btn.disabled = true; btn.textContent = 'Gravando…';
        const { data, error } = await sb.rpc('concluir_processo', { p_id: st.id, p_item_id: i.id, p_processado: proc, p_perda: perda,
          p_saidas: st.saidas.map(s => ({ produto_id: s.id, quantidade: s.q })), p_data: f.data.value || hojeISO(), p_observacao: f.obs.value.trim() || null });
        btn.disabled = false; btn.textContent = 'Concluir e lançar resultado';
        if (error) return toast(erroTexto(error), 'erro');
        close();
        toast(data.duplicado ? 'Esta conclusão já estava gravada; nada foi duplicado.'
          : `Pendência nº ${data.processo}: ${pc(proc)} pç concluídas${data.entrada ? `, entrada nº ${data.entrada.numero} lançada` : ''}.${data.restam ? ` Restam ${pc(data.restam)} pç.` : ' Pendência encerrada.'}`, 'ok');
        await carregarEstoque(); atualizarPendencias(); renderPendencias();
      });
    }
  });
}

/* =====================================================================
   APONTAMENTO DE PRODUÇÃO — utilitários
   ===================================================================== */
const setorPorId = id => S.ref.setores_producao.find(s => s.id === id);
const formsDoSetor = id => S.ref.formularios_producao.filter(f => f.setor_id === id && f.ativo).sort((a, b) => a.ordem - b.ordem);
const recursosDoSetor = id => S.ref.recursos_producao.filter(r => r.setor_id === id && r.ativo).sort((a, b) => a.ordem - b.ordem);
const setoresAtivos = () => S.ref.setores_producao.filter(s => s.ativo).sort((a, b) => a.ordem - b.ordem);
const nf2 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const numBR = n => (Number(n) || 0).toLocaleString('pt-BR', { maximumFractionDigits: 3 });
const pct = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'percent', maximumFractionDigits: 0 });
const TURNOS = { 1: '1º turno', 2: '2º turno', 3: '3º turno' };
// valor de um apontamento na unidade do setor
const valorDe = (a, setor) => Number((setor?.unidade === 'm³' ? a.m3 : a.quantidade) ?? 0);
function medidaTexto(d) {
  if (!d?.comprimento_m) return '';
  return `${numBR(d.comprimento_m)} x ${numBR(d.largura_m)} m · ${numBR(d.espessura_mm)} mm`;
}
// resumo curto de um lançamento, para listas
function resumoApontamento(a) {
  const d = a.dados || {};
  const p = [];
  if (a.recurso) p.push(a.recurso);
  if (a.turno) p.push(TURNOS[a.turno]);
  if (a.especie) p.push(a.especie);
  if (d.insumo) p.push(d.insumo);
  if (d.tipo_cola) p.push(d.tipo_cola);
  if (d.origem) p.push(d.origem);
  if (d.qualidade) p.push(d.qualidade);
  if (d.classe) p.push(d.classe);
  if (d.fornecedor) p.push(d.fornecedor);
  if (d.comprimento_m) p.push(medidaTexto(d));
  return p.join(' · ');
}
function valorTexto(a) {
  const u = a.unidade, out = [];
  if (a.m3 != null) out.push(`${m3(a.m3)} m³`);
  if (a.quantidade != null && !(a.m3 != null && u === 'm³' && a.quantidade == null)) {
    const uq = a.formulario_codigo === 'GRAMATURA' ? 'g/m²' : a.setor_codigo === 'PREP_COLA' || a.formulario_codigo === 'BATIDA' ? 'kg' : u === 'm³' ? 'pç' : u;
    out.push(`${numBR(a.quantidade)} ${uq}`);
  }
  if (a.m3 == null && a.quantidade == null && a.dados?.m3_tora) out.push(`${m3(a.dados.m3_tora)} m³ de tora`);
  return out.join(' · ') || '—';
}

/* =====================================================================
   APONTAR — formulário gerado a partir da definição do banco
   ===================================================================== */
function campoHTML(c, setorId, valor) {
  const id = 'c-' + c.chave;
  const v = valor == null ? '' : valor;
  const lab = `<span>${esc(c.rotulo)}${c.obrigatorio ? '' : ' <i class="opc">opcional</i>'}</span>`;
  const suf = c.sufixo ? `<i class="suf">${esc(c.sufixo)}</i>` : '';
  if (c.tipo === 'turno') return `<div class="campo"><span>${esc(c.rotulo)}</span>
    <div class="seg grande" data-campo="${c.chave}">${[1, 2, 3].map(t => `<button type="button" data-v="${t}" class="${String(v) === String(t) ? 'on' : ''}">${t}º</button>`).join('')}</div></div>`;
  if (c.tipo === 'especie') {
    const lista = S.ref.especies.filter(e => e.ativo);
    return `<div class="campo">${lab}<div class="seg grande" data-campo="${c.chave}">${lista.map(e => `<button type="button" data-v="${e.id}" class="${String(v) === String(e.id) ? 'on' : ''}">${esc(e.nome)}</button>`).join('')}</div></div>`;
  }
  if (c.tipo === 'recurso') {
    const lista = recursosDoSetor(setorId);
    return `<div class="campo">${lab}<div class="seg grande" data-campo="${c.chave}">${lista.map(r => `<button type="button" data-v="${r.id}" class="${String(v) === String(r.id) ? 'on' : ''}">${esc(r.nome)}</button>`).join('')}</div></div>`;
  }
  if (c.tipo === 'lista') {
    const op = c.opcoes || [];
    if (op.length <= 4) return `<div class="campo">${lab}<div class="seg grande" data-campo="${c.chave}">${op.map(o => `<button type="button" data-v="${esc(o)}" class="${v === o ? 'on' : ''}">${esc(o)}</button>`).join('')}</div></div>`;
    return `<label class="campo">${lab}<select class="inp" id="${id}" name="${c.chave}"><option value="">Escolha…</option>${op.map(o => `<option ${v === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`;
  }
  if (c.tipo === 'hora') return `<label class="campo">${lab}<input class="inp" type="time" id="${id}" name="${c.chave}" value="${esc(String(v).slice(0, 5))}"></label>`;
  if (c.tipo === 'texto') return `<label class="campo">${lab}<input class="inp" type="text" maxlength="200" id="${id}" name="${c.chave}" value="${esc(v)}" placeholder="${esc(c.ajuda || '')}"></label>`;
  return `<label class="campo num-campo">${lab}<span class="num-box"><input class="inp qtd-inp" type="number" inputmode="decimal" step="${c.tipo === 'inteiro' ? '1' : 'any'}" min="0" id="${id}" name="${c.chave}" value="${esc(v)}">${suf}</span></label>`;
}
function formApontamento(form, editando) {
  const setor = setorPorId(form.setor_id);
  const campos = form.campos || [];
  const base = campos.filter(c => !c.grupo), extras = campos.filter(c => c.grupo);
  const grupo = extras[0]?.grupo;
  const vals = editando ? valoresDe(editando, campos) : {};
  const voltar = editando ? '' : formsDoSetor(setor.id).length > 1 ? `<a class="btn" href="#/apontar?s=${setor.id}">Trocar tipo</a>` : '<a class="btn" href="#/apontar">Trocar de setor</a>';
  const corpo = `
    <form id="f-ap" class="grid ap-form">
      <div class="grid g2">
        <label class="campo"><span>Data</span><input class="inp" type="date" name="data" max="${hojeISO()}" value="${editando ? editando.data : hojeISO()}"></label>
        <div class="campo"><span>&nbsp;</span><div class="seg grande" id="ap-atalho"><button type="button" data-d="0">Hoje</button><button type="button" data-d="-1">Ontem</button></div></div>
      </div>
      ${base.map(c => campoHTML(c, setor.id, vals[c.chave])).join('')}
      ${extras.length ? `<details class="mais" ${extras.some(c => vals[c.chave] != null) ? 'open' : ''}><summary>${esc(grupo)}</summary><div class="grid g2" style="margin-top:12px">${extras.map(c => campoHTML(c, setor.id, vals[c.chave])).join('')}</div></details>` : ''}
      <label class="campo"><span>Observação <i class="opc">opcional</i></span><textarea class="inp" name="observacao" maxlength="300">${esc(editando?.observacao || '')}</textarea></label>
      <div id="ap-calc" class="calc hidden"></div>
      <div class="acoes-ap">
        <button class="btn lg pri" id="ap-ok" style="flex:1">${editando ? 'Salvar correção' : 'Registrar apontamento'}</button>
      </div>
    </form>`;
  if (editando) return { corpo, campos, form, setor, vals };

  $('#main').innerHTML = cabecalho(form.nome, `${setor.nome} — ${form.descricao || ''}`, voltar) + corpo + `
    <div class="painel" style="margin-top:18px"><h3>Lançado hoje neste setor</h3><div id="ap-hoje"><div class="muted">Carregando…</div></div></div>`;
  atualizarLive();
  ligarForm($('#f-ap'), { form, campos, setor, aoGravar: async valores => {
    const id = uuid();
    const { data, error } = await sb.rpc('registrar_apontamento', {
      p_id: id, p_formulario_id: form.id, p_data: valores.data, p_valores: valores.valores, p_observacao: valores.observacao || null });
    if (error) return { erro: erroTexto(error) };
    return { ok: data.duplicado ? 'Este apontamento já estava gravado; nada foi duplicado.'
      : `${form.nome} nº ${data.numero} registrado${data.m3 != null ? ` · ${m3(data.m3)} m³`
          : data.quantidade != null ? ` · ${numBR(data.quantidade)} ${setor.unidade || ''}`.trimEnd() : ''}.` };
  } });
  listaDoDia($('#ap-hoje'), { setor: setor.id });
}
// extrai os valores de um apontamento gravado de volta para o formulário
function valoresDe(a, campos) {
  const v = {};
  campos.forEach(c => {
    const k = c.chave;
    v[k] = ['quantidade', 'm3', 'horas', 'turno', 'especie_id', 'recurso_id'].includes(k) ? a[k]
      : k === 'hora' ? (a.hora || '') : (a.dados || {})[k];
  });
  return v;
}
function ligarForm(f, { form, campos, setor, aoGravar }) {
  const seg = {};
  $$('.seg[data-campo]', f).forEach(d => {
    const on = $('button.on', d); seg[d.dataset.campo] = on ? on.dataset.v : null;
    $$('button', d).forEach(b => b.addEventListener('click', () => {
      seg[d.dataset.campo] = seg[d.dataset.campo] === b.dataset.v ? null : b.dataset.v;
      $$('button', d).forEach(x => x.classList.toggle('on', x.dataset.v === seg[d.dataset.campo]));
      calcular();
    }));
  });
  const marcarAtalho = () => $$('#ap-atalho button').forEach(b => b.classList.toggle('on', hojeISO(+b.dataset.d) === f.data.value));
  $$('#ap-atalho button').forEach(b => b.addEventListener('click', () => { f.data.value = hojeISO(+b.dataset.d); marcarAtalho(); }));
  f.data.addEventListener('change', marcarAtalho); marcarAtalho();

  const lerValores = () => {
    const v = {};
    campos.forEach(c => {
      if (['turno', 'especie', 'recurso'].includes(c.tipo) || (c.tipo === 'lista' && (c.opcoes || []).length <= 4)) {
        if (seg[c.chave] != null) v[c.chave] = ['turno', 'especie', 'recurso'].includes(c.tipo) ? Number(seg[c.chave]) : seg[c.chave];
      } else {
        const el = f.elements[c.chave];
        if (el && String(el.value).trim() !== '') v[c.chave] = c.tipo === 'numero' || c.tipo === 'inteiro' ? Number(el.value) : el.value;
      }
    });
    return v;
  };
  function calcular() {
    const v = lerValores(), box = $('#ap-calc', f);
    if (!box) return;
    const partes = [];
    if (form.calcula_m3 && v.quantidade > 0 && v.comprimento_m > 0 && v.largura_m > 0 && v.espessura_mm > 0) {
      partes.push(`Volume: <b class="num">${m3(v.quantidade * v.espessura_mm / 1000 * v.comprimento_m * v.largura_m)} m³</b>`);
    }
    if (form.codigo === 'BATIDA') {
      const t = (v.resina_kg || 0) + (v.trigo_kg || 0) + (v.agua_kg || 0);
      if (t > 0) partes.push(`Total da batida: <b class="num">${numBR(t)} kg</b>`);
    }
    if (['q1', 'q2', 'q3'].some(k => v[k] != null)) {
      const soma = (v.q1 || 0) + (v.q2 || 0) + (v.q3 || 0);
      const falta = (v.quantidade || 0) - soma;
      partes.push(`Separado: <b class="num">${numBR(soma)}</b> de ${numBR(v.quantidade || 0)} chapas${falta < 0 ? ' <b class="neg">— passou do total</b>' : falta > 0 ? ` · faltam ${numBR(falta)}` : ''}`);
    }
    box.classList.toggle('hidden', !partes.length);
    box.innerHTML = partes.join(' &nbsp;·&nbsp; ');
  }
  f.addEventListener('input', calcular); calcular();

  f.addEventListener('submit', async e => {
    e.preventDefault();
    const v = lerValores();
    const falta = campos.find(c => c.obrigatorio && (v[c.chave] == null || v[c.chave] === ''));
    if (falta) return toast(`Informe ${falta.rotulo.toLowerCase()}.`, 'erro');
    const btn = $('#ap-ok', f) || $('button.pri', f); const txt = btn.textContent;
    btn.disabled = true; btn.textContent = 'Gravando…';
    const res = await aoGravar({ data: f.data.value, valores: v, observacao: f.observacao.value.trim() });
    btn.disabled = false; btn.textContent = txt;
    if (res.erro) return toast(res.erro, 'erro');
    toast(res.ok, 'ok');
    if (res.fechar) return;
    // limpa para o próximo lançamento, mantendo data, turno, mesa e espécie
    const manter = ['turno', 'recurso_id', 'especie_id', 'insumo', 'tipo_cola'];
    campos.forEach(c => {
      if (manter.includes(c.chave)) return;
      if (seg[c.chave] !== undefined) { seg[c.chave] = null; $$(`.seg[data-campo="${c.chave}"] button`, f).forEach(x => x.classList.remove('on')); }
      const el = f.elements[c.chave]; if (el && el.type !== 'date') el.value = '';
    });
    f.observacao.value = ''; calcular();
    const alvo = campos.find(c => c.obrigatorio && !['turno', 'especie', 'recurso'].includes(c.tipo));
    if (alvo) f.elements[alvo.chave]?.focus();
    listaDoDia($('#ap-hoje'), { setor: setor.id });
  });
}

/* =====================================================================
   Lista do dia (abaixo do formulário) e correções
   ===================================================================== */
async function listaDoDia(box, { setor, usuario } = {}) {
  if (!box) return;
  if (setor) box.dataset.setor = setor; else delete box.dataset.setor;
  let q = sb.from('vw_apontamentos').select('*').eq('data', hojeISO()).eq('cancelado', false)
    .order('criado_em', { ascending: false }).limit(60);
  if (setor) q = q.eq('setor_id', setor);
  if (usuario) q = q.eq('usuario_id', usuario);
  const { data, error } = await q;
  if (!box.isConnected) return;
  if (error) return box.innerHTML = `<div class="msg erro">${esc(erroTexto(error))}</div>`;
  box.innerHTML = data.length ? `<div class="lista-ap">${data.map(a => `
    <div class="item-ap"><div>
      <b>${esc(setor ? a.formulario : a.setor)}</b> <span class="muted">${esc(resumoApontamento(a))}</span>
      <div class="muted" style="font-size:12.5px">nº ${a.numero} · ${esc(a.usuario_nome)} · ${horaBR(a.criado_em).slice(-5)}${a.edicoes ? ' · corrigido' : ''}</div>
    </div>
    <div style="text-align:right;white-space:nowrap"><b class="num">${valorTexto(a)}</b>
      ${podeCorrigir(a) ? `<div><button class="btn sm ghost" data-ed="${a.id}">Corrigir</button><button class="btn sm ghost" data-ca="${a.id}">Cancelar</button></div>` : ''}
    </div></div>`).join('')}</div>`
    : '<div class="muted">Nada lançado hoje ainda.</div>';
  $$('[data-ed]', box).forEach(b => b.addEventListener('click', () => corrigirApontamento(data.find(a => a.id === b.dataset.ed))));
  $$('[data-ca]', box).forEach(b => b.addEventListener('click', () => cancelarApontamento(data.find(a => a.id === b.dataset.ca))));
}
function podeCorrigir(a) {
  if (a.cancelado || !podeApontar()) return false;
  if (ehAdmin()) return true;
  return a.usuario_id === S.perfil.id && String(a.criado_em).slice(0, 10) === hojeISO();
}
function corrigirApontamento(a) {
  const form = S.ref.formularios_producao.find(f => f.id === a.formulario_id);
  const pacote = formApontamento(form, a);
  modal(`<h3>Corrigir ${esc(form.nome)} nº ${a.numero}</h3>
    <p class="muted" style="margin:-6px 0 12px">${esc(a.setor)} · lançado por ${esc(a.usuario_nome)} em ${horaBR(a.criado_em)}</p>
    ${pacote.corpo}`, {
    wide: true, onMount: (el, close) => {
      const f = $('#f-ap', el);
      ligarForm(f, { ...pacote, aoGravar: async valores => {
        const { error } = await sb.rpc('editar_apontamento', {
          p_id: a.id, p_data: valores.data, p_valores: valores.valores, p_observacao: valores.observacao || null });
        if (error) return { erro: erroTexto(error) };
        close(); await recarregarProducao();
        return { ok: `Apontamento nº ${a.numero} corrigido.`, fechar: true };
      } });
    }
  });
}
function cancelarApontamento(a) {
  modal(`<h3>Cancelar apontamento nº ${a.numero}</h3>
    <p style="margin-top:-6px">${esc(a.setor)} — ${esc(a.formulario)}<br><span class="muted">${esc(resumoApontamento(a))} · ${valorTexto(a)}</span></p>
    <p class="muted">O lançamento continua no histórico, marcado como cancelado, e deixa de contar nos indicadores.</p>
    <label class="campo"><span>Motivo</span><textarea class="inp" id="ca-motivo" maxlength="300"></textarea></label>
    <div class="acoes"><button class="btn" data-fechar>Voltar</button><button class="btn out" id="ca-ok">Cancelar apontamento</button></div>`, {
    onMount: (el, close) => $('#ca-ok', el).addEventListener('click', async () => {
      const mot = $('#ca-motivo', el).value.trim();
      if (mot.length < 5) return toast('Escreva o motivo do cancelamento.', 'erro');
      const { error } = await sb.rpc('cancelar_apontamento', { p_id: a.id, p_motivo: mot });
      if (error) return toast(erroTexto(error), 'erro');
      close(); toast(`Apontamento nº ${a.numero} cancelado.`, 'ok'); await recarregarProducao();
    })
  });
}
async function recarregarProducao() {
  if (S.rota === 'apontar') { const b = $('#ap-hoje'); if (b) listaDoDia(b, b.dataset.setor ? { setor: +b.dataset.setor } : { usuario: S.perfil.id }); }
  if (['producao', 'lancamentos', 'conferencia'].includes(S.rota)) ROTAS[S.rota].render();
}

/* =====================================================================
   PAINEL DE PRODUÇÃO — metas e realizado
   ===================================================================== */
const periodoProd = { modo: 'mes' };
function faixaPeriodo() {
  const hoje = hojeISO();
  if (periodoProd.modo === 'hoje') return [hoje, hoje];
  if (periodoProd.modo === 'semana') return [hojeISO(-6), hoje];
  const d = new Date(); return [new Date(d.getFullYear(), d.getMonth(), 1).toLocaleDateString('sv-SE'), hoje];
}
async function renderPainelProducao() {
  const [de, ate] = faixaPeriodo();
  $('#main').innerHTML = cabecalho('Painel de produção', `De ${dataBR(de)} a ${dataBR(ate)}`, `
    <div class="seg" id="pp-periodo">
      <button data-v="hoje" class="${periodoProd.modo === 'hoje' ? 'on' : ''}">Hoje</button>
      <button data-v="semana" class="${periodoProd.modo === 'semana' ? 'on' : ''}">7 dias</button>
      <button data-v="mes" class="${periodoProd.modo === 'mes' ? 'on' : ''}">Mês</button>
    </div>`) + '<div id="pp-corpo"><div class="vazio">Carregando…</div></div>';
  atualizarLive();
  $$('#pp-periodo button').forEach(b => b.addEventListener('click', () => { periodoProd.modo = b.dataset.v; renderPainelProducao(); }));

  const [rs, rm] = await Promise.all([
    sb.rpc('resumo_producao', { p_de: de, p_ate: ate }),
    sb.rpc('resumo_recurso', { p_setor: setoresAtivos().find(s => s.codigo === 'MONTAGEM')?.id, p_de: de, p_ate: ate }),
  ]);
  if (S.rota !== 'producao' || !$('#pp-corpo')) return;
  if (rs.error) return $('#pp-corpo').innerHTML = `<div class="msg erro">${esc(erroTexto(rs.error))}</div>`;

  const porSetor = {};
  rs.data.forEach(l => {
    const o = porSetor[l.setor_id] ||= { ...l, m3: 0, quantidade: 0, meta: 0, lancamentos: 0, dias: 0, serie: [] };
    o.m3 += Number(l.m3); o.quantidade += Number(l.quantidade); o.meta += Number(l.meta || 0);
    o.lancamentos += Number(l.lancamentos); if (l.util) o.dias++;
    o.serie.push({ data: l.data, v: Number(l.campo_meta === 'quantidade' ? l.quantidade : l.m3), meta: Number(l.meta || 0), util: l.util });
  });
  const lista = Object.values(porSetor).sort((a, b) => a.ordem - b.ordem);
  // sem meta cadastrada, mede pela unidade natural do setor
  const campo = o => o.meta ? o.campo_meta : (o.unidade === 'm³' ? 'm3' : 'quantidade');
  const real = o => campo(o) === 'quantidade' ? o.quantidade : o.m3;
  const un = o => campo(o) === 'quantidade' ? o.unidade : 'm³';
  const extra = o => campo(o) === 'quantidade' && o.m3 ? ` · ${m3(o.m3)} m³` : '';

  $('#pp-corpo').innerHTML = `
    <div class="grid g3" style="margin-bottom:16px">
      ${['LAMINACAO', 'MONTAGEM', 'PRENSAGEM'].map(cod => {
        const o = lista.find(x => x.setor_codigo === cod); if (!o) return '';
        return `<div class="painel kpi-prod"><div class="l">${esc(o.setor)}</div>
          <div class="v num">${numBR(real(o))}<small>${esc(un(o))}</small></div>
          <div class="l">${o.meta ? `meta ${numBR(o.meta)} · ${pct(real(o) / o.meta)} atingido` : `${o.lancamentos} lançamentos${extra(o)}`}</div></div>`;
      }).join('')}
    </div>
    <div class="painel" style="margin-bottom:16px"><h3>Realizado contra a meta</h3>
      <div class="metas">${lista.map(o => {
        const v = real(o), p = o.meta ? v / o.meta : null;
        return `<div class="meta-linha ${p == null ? 'sem' : p >= 1 ? 'ok' : p >= 0.8 ? 'quase' : 'baixo'}">
          <span class="s">${esc(o.setor)}</span>
          <span class="t"><i style="width:${p == null ? 0 : Math.min(p, 1) * 100}%"></i>${p != null && p > 1 ? '<em>+</em>' : ''}</span>
          <span class="v num">${numBR(v)} <small>${esc(un(o))}</small></span>
          <span class="m num">${o.meta ? `${pct(p)} de ${numBR(o.meta)}` : `<span class="muted">sem meta${extra(o)}</span>`}</span>
        </div>`;
      }).join('')}</div>
      <p class="muted" style="font-size:13px;margin:12px 0 0">A meta considera só os dias úteis do período. Ajuste em Setores e metas.</p>
    </div>
    ${rm.data?.length ? `<div class="painel" style="margin-bottom:16px"><h3>Montagem por mesa</h3>
      <div class="metas">${Object.values(rm.data.reduce((acc, l) => {
        const o = acc[l.recurso_id] ||= { nome: l.recurso, v: 0, meta: 0 };
        o.v += Number(l.m3); o.meta += Number(l.meta || 0); return acc;
      }, {})).map(o => {
        const p = o.meta ? o.v / o.meta : null;
        return `<div class="meta-linha ${p == null ? 'sem' : p >= 1 ? 'ok' : p >= 0.8 ? 'quase' : 'baixo'}">
          <span class="s">${esc(o.nome)}</span><span class="t"><i style="width:${p == null ? 0 : Math.min(p, 1) * 100}%"></i></span>
          <span class="v num">${m3(o.v)} <small>m³</small></span>
          <span class="m num">${o.meta ? `${pct(p)} de ${numBR(o.meta)}` : '<span class="muted">sem meta</span>'}</span></div>`;
      }).join('')}</div></div>` : ''}
    <div class="painel"><h3>Dia a dia</h3><div class="tw" style="max-height:60vh">${tabelaDiaria(rs.data)}</div></div>`;
}
function tabelaDiaria(linhas) {
  const setores = [...new Map(linhas.map(l => [l.setor_id, l])).values()].sort((a, b) => a.ordem - b.ordem);
  const dias = [...new Set(linhas.map(l => l.data))].sort().reverse();
  const mapa = {}; linhas.forEach(l => mapa[`${l.data}|${l.setor_id}`] = l);
  const comDado = dias.filter(d => setores.some(s => Number(mapa[`${d}|${s.setor_id}`]?.lancamentos || 0) > 0));
  if (!comDado.length) return '<div class="vazio">Nenhum apontamento neste período.</div>';
  return `<table class="larga"><thead><tr><th>Data</th>${setores.map(s => `<th class="r">${esc(s.setor)}<small class="muted" style="display:block;font-weight:500">${esc((s.meta ? s.campo_meta : (s.unidade === 'm³' ? 'm3' : 'quantidade')) === 'quantidade' ? s.unidade : 'm³')}</small></th>`).join('')}</tr></thead><tbody>
    ${comDado.map(d => `<tr><td>${dataBR(d)}${dia_util_txt(mapa, d, setores)}</td>${setores.map(s => {
      const l = mapa[`${d}|${s.setor_id}`];
      const q = l && (l.meta ? l.campo_meta : (l.unidade === 'm³' ? 'm3' : 'quantidade'));
      const v = Number(q === 'quantidade' ? l?.quantidade : l?.m3) || 0;
      return `<td class="r num ${v ? '' : 'muted'}">${v ? numBR(v) : '—'}</td>`;
    }).join('')}</tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td>${setores.map(s => {
      const q = s.meta ? s.campo_meta : (s.unidade === 'm³' ? 'm3' : 'quantidade');
      const t = linhas.filter(l => l.setor_id === s.setor_id).reduce((a, l) => a + Number(q === 'quantidade' ? l.quantidade : l.m3), 0);
      return `<td class="r num">${numBR(t)}</td>`;
    }).join('')}</tr></tfoot></table>`;
}
const dia_util_txt = (mapa, d, setores) => (mapa[`${d}|${setores[0]?.setor_id}`]?.util ? '' : ' <span class="tag">não útil</span>');

/* =====================================================================
   LANÇAMENTOS — listagem completa, filtros, correção e exportação
   ===================================================================== */
const filtroAp = { de: null, ate: null, setor: '', usuario: '', cancelados: false };
let apDados = [];
async function renderLancamentos() {
  filtroAp.de ||= hojeISO(-6); filtroAp.ate ||= hojeISO();
  const { data: usuarios } = await sb.from('perfis').select('id,nome').order('nome');
  if (S.rota !== 'lancamentos') return;
  $('#main').innerHTML = cabecalho('Lançamentos', 'Todos os apontamentos, com quem lançou e quando.',
    '<button class="btn" id="ap-xlsx">Exportar Excel</button>') + `
    <div class="filtros">
      <label class="campo"><span>De</span><input class="inp" type="date" id="ap-de" value="${filtroAp.de}"></label>
      <label class="campo"><span>Até</span><input class="inp" type="date" id="ap-ate" value="${filtroAp.ate}"></label>
      <label class="campo"><span>Setor</span><select class="inp" id="ap-setor"><option value="">Todos</option>${setoresAtivos().map(s => `<option value="${s.id}" ${String(filtroAp.setor) === String(s.id) ? 'selected' : ''}>${esc(s.nome)}</option>`).join('')}</select></label>
      <label class="campo"><span>Quem lançou</span><select class="inp" id="ap-usuario"><option value="">Todos</option>${(usuarios || []).map(u => `<option value="${u.id}" ${filtroAp.usuario === u.id ? 'selected' : ''}>${esc(u.nome)}</option>`).join('')}</select></label>
      <label class="check" style="align-self:center"><input type="checkbox" id="ap-canc" ${filtroAp.cancelados ? 'checked' : ''} style="accent-color:var(--brand)"><span>Mostrar cancelados</span></label>
      <button class="btn pri" id="ap-filtrar">Filtrar</button>
    </div>
    <div id="ap-tab"><div class="vazio">Carregando…</div></div>`;
  atualizarLive();
  const ler = () => {
    filtroAp.de = $('#ap-de').value; filtroAp.ate = $('#ap-ate').value;
    filtroAp.setor = $('#ap-setor').value; filtroAp.usuario = $('#ap-usuario').value;
    filtroAp.cancelados = $('#ap-canc').checked; buscarLancamentos();
  };
  $('#ap-filtrar').addEventListener('click', ler);
  $('#ap-xlsx').addEventListener('click', exportarApontamentos);
  buscarLancamentos();
}
async function buscarLancamentos() {
  let q = sb.from('vw_apontamentos').select('*').gte('data', filtroAp.de).lte('data', filtroAp.ate)
    .order('data', { ascending: false }).order('criado_em', { ascending: false }).limit(2000);
  if (filtroAp.setor) q = q.eq('setor_id', filtroAp.setor);
  if (filtroAp.usuario) q = q.eq('usuario_id', filtroAp.usuario);
  if (!filtroAp.cancelados) q = q.eq('cancelado', false);
  const { data, error } = await q;
  const box = $('#ap-tab'); if (!box) return;
  if (error) return box.innerHTML = `<div class="msg erro">${esc(erroTexto(error))}</div>`;
  apDados = data;
  box.innerHTML = data.length ? `<div class="tw"><table class="larga"><thead><tr><th>Data</th><th>Nº</th><th>Setor</th><th>Tipo</th><th>Detalhe</th><th class="r">Valor</th><th>Quem lançou</th><th>Observação</th><th></th></tr></thead><tbody>
    ${data.map(a => `<tr class="${a.cancelado ? 'cancelado' : ''}"><td>${dataBR(a.data)}</td><td class="num">${a.numero}</td>
      <td>${esc(a.setor)}</td><td>${esc(a.formulario)}${a.cancelado ? ' <span class="tag out">cancelado</span>' : a.edicoes ? ' <span class="tag warn">corrigido</span>' : ''}</td>
      <td class="desc">${esc(resumoApontamento(a))}</td><td class="r num"><b>${valorTexto(a)}</b></td>
      <td>${esc(a.usuario_nome)}<div class="muted" style="font-size:12.5px">${horaBR(a.criado_em)}</div></td>
      <td class="desc">${esc(a.observacao || a.motivo_cancelamento || '')}</td>
      <td class="r">${podeCorrigir(a) ? `<button class="btn sm" data-ed="${a.id}">Corrigir</button>` : ''}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="5">${pc(data.length)} lançamentos</td><td class="r num">${m3(data.filter(a => !a.cancelado).reduce((s, a) => s + Number(a.m3 || 0), 0))} m³</td><td colspan="3"></td></tr></tfoot></table></div>`
    : '<div class="vazio">Nenhum apontamento no período. Amplie as datas ou limpe os filtros.</div>';
  $$('[data-ed]', box).forEach(b => b.addEventListener('click', () => corrigirApontamento(data.find(a => a.id === b.dataset.ed))));
}
function exportarApontamentos() {
  if (!apDados.length) return toast('Não há lançamentos para exportar.', 'erro');
  const chaves = [...new Set(apDados.flatMap(a => Object.keys(a.dados || {})))];
  const linhas = apDados.map(a => {
    const l = { 'Data': dataBR(a.data), 'Nº': a.numero, 'Setor': a.setor, 'Tipo': a.formulario,
      'Turno': a.turno || '', 'Hora': a.hora ? String(a.hora).slice(0, 5) : '', 'Recurso': a.recurso || '',
      'Espécie': a.especie || '', 'Quantidade': a.quantidade == null ? '' : Number(a.quantidade),
      'M³': a.m3 == null ? '' : Number(a.m3), 'Horas': a.horas == null ? '' : Number(a.horas) };
    chaves.forEach(k => l[k] = (a.dados || {})[k] ?? '');
    l['Observação'] = a.observacao || ''; l['Quem lançou'] = a.usuario_nome;
    l['Lançado em'] = horaBR(a.criado_em); l['Cancelado'] = a.cancelado ? 'Sim' : '';
    return l;
  });
  xlsx(linhas, 'Apontamentos', nomeArquivo('apontamentos_celplac', 'xlsx'));
}

/* =====================================================================
   CONFERÊNCIA — cruzamento entre setores (aba PIN_EUCA_TRP da planilha)
   ===================================================================== */
async function renderConferencia() {
  const [de, ate] = faixaPeriodo();
  $('#main').innerHTML = cabecalho('Conferência', 'Cruzamento entre os setores, para achar diferença de apontamento.', `
    <div class="seg" id="cf-periodo">
      <button data-v="hoje" class="${periodoProd.modo === 'hoje' ? 'on' : ''}">Hoje</button>
      <button data-v="semana" class="${periodoProd.modo === 'semana' ? 'on' : ''}">7 dias</button>
      <button data-v="mes" class="${periodoProd.modo === 'mes' ? 'on' : ''}">Mês</button>
    </div>`) + '<div id="cf-corpo"><div class="vazio">Carregando…</div></div>';
  atualizarLive();
  $$('#cf-periodo button').forEach(b => b.addEventListener('click', () => { periodoProd.modo = b.dataset.v; renderConferencia(); }));
  const { data, error } = await sb.from('vw_apontamentos').select('data,setor_codigo,formulario_codigo,especie,m3,quantidade')
    .gte('data', de).lte('data', ate).eq('cancelado', false).limit(5000);
  if (S.rota !== 'conferencia' || !$('#cf-corpo')) return;
  if (error) return $('#cf-corpo').innerHTML = `<div class="msg erro">${esc(erroTexto(error))}</div>`;
  if (!data.length) return $('#cf-corpo').innerHTML = '<div class="vazio">Nenhum apontamento neste período.</div>';

  const dias = [...new Set(data.map(l => l.data))].sort().reverse();
  const soma = (d, cod, campo, esp) => data.filter(l => l.data === d && l.setor_codigo === cod && (!esp || l.especie === esp))
    .reduce((a, l) => a + Number(l[campo] || 0), 0);
  const especies = [...new Set(data.filter(l => l.setor_codigo === 'MONTAGEM').map(l => l.especie).filter(Boolean))].sort();
  const linha = (d) => {
    const mont = soma(d, 'MONTAGEM', 'm3'), chapasM = soma(d, 'MONTAGEM', 'quantidade');
    const chapasP = soma(d, 'PRENSAGEM', 'quantidade'), lam = soma(d, 'LAMINACAO', 'm3'), sec = soma(d, 'SECAGEM', 'm3');
    const pend = chapasM - chapasP;
    return `<tr><td>${dataBR(d)}</td>
      ${especies.map(e => `<td class="r num">${soma(d, 'MONTAGEM', 'm3', e) ? m3(soma(d, 'MONTAGEM', 'm3', e)) : '<span class="muted">—</span>'}</td>`).join('')}
      <td class="r num"><b>${m3(mont)}</b></td>
      <td class="r num">${numBR(chapasM)}</td><td class="r num">${numBR(chapasP)}</td>
      <td class="r num ${pend > 0 ? 'neg' : pend < 0 ? 'warn-t' : ''}">${pend === 0 ? 'OK' : numBR(pend)}</td>
      <td class="r num">${m3(lam)}</td><td class="r num">${m3(sec)}</td>
      <td class="r num ${lam && sec > lam ? 'warn-t' : ''}">${lam ? numBR(sec / lam * 100) + '%' : '<span class="muted">—</span>'}</td></tr>`;
  };
  $('#cf-corpo').innerHTML = `
    <div class="painel"><h3>Montagem, prensagem, laminação e secagem</h3>
    <div class="tw" style="max-height:65vh"><table class="larga"><thead>
      <tr><th rowspan="2">Data</th><th colspan="${especies.length + 1}" class="r">Montagem (m³)</th><th colspan="3" class="r">Chapas</th><th colspan="3" class="r">Lâminas (m³)</th></tr>
      <tr>${especies.map(e => `<th class="r">${esc(e)}</th>`).join('')}<th class="r">Total</th>
        <th class="r">Montadas</th><th class="r">Prensadas</th><th class="r">A prensar</th>
        <th class="r">Laminação</th><th class="r">Secagem</th><th class="r">Secagem/Laminação</th></tr></thead>
      <tbody>${dias.map(linha).join('')}</tbody></table></div>
    <p class="muted" style="font-size:13px;margin:12px 0 0">"A prensar" é o que foi montado e ainda não foi prensado no mesmo dia. Número negativo significa que a prensa trabalhou chapas montadas em dias anteriores.</p></div>`;
}

function pcRecursos() {
  $('#pc').innerHTML = `<div class="filtros"><button class="btn pri" id="pr-novo">Adicionar</button></div>
    <div class="tw"><table><thead><tr><th>Setor</th><th>Nome</th><th>Código</th><th class="r">Ordem</th><th>Ativo</th><th></th></tr></thead><tbody>
    ${S.ref.recursos_producao.map(r => `<tr><td>${esc(setorPorId(r.setor_id)?.nome || '')}</td><td><b>${esc(r.nome)}</b></td><td class="cod">${esc(r.codigo)}</td>
      <td class="r num">${r.ordem}</td><td>${r.ativo ? 'Sim' : '<span class="tag">Não</span>'}</td>
      <td class="r"><button class="btn sm" data-r="${r.id}">Editar</button></td></tr>`).join('')}</tbody></table></div>`;
  const form = r => modal(`<h3>${r ? 'Editar' : 'Adicionar'} mesa ou máquina</h3><form id="f-r" class="grid">
    <label class="campo"><span>Setor</span><select class="inp" name="setor_id" ${r ? 'disabled' : ''}>${setoresAtivos().map(s => `<option value="${s.id}" ${r?.setor_id === s.id ? 'selected' : ''}>${esc(s.nome)}</option>`).join('')}</select></label>
    <div class="grid g2">
      <label class="campo"><span>Nome</span><input class="inp" name="nome" value="${esc(r?.nome || '')}" required></label>
      <label class="campo"><span>Código curto</span><input class="inp" name="codigo" value="${esc(r?.codigo || '')}" maxlength="8" required ${r ? 'readonly' : ''}></label>
    </div>
    <label class="campo"><span>Ordem</span><input class="inp" name="ordem" type="number" value="${r?.ordem ?? 0}"></label>
    <label class="check"><input type="checkbox" name="ativo" ${!r || r.ativo ? 'checked' : ''} style="accent-color:var(--brand)"><span>Ativo</span></label>
    <div class="acoes"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn pri">Salvar</button></div></form>`, {
    onMount: (el, close) => $('#f-r', el).addEventListener('submit', async e => {
      e.preventDefault(); const f = e.target;
      const reg = { nome: f.nome.value.trim(), ordem: +f.ordem.value, ativo: f.ativo.checked };
      if (!r) { reg.setor_id = +f.setor_id.value; reg.codigo = f.codigo.value.trim().toUpperCase(); }
      const res = r ? await sb.from('recursos_producao').update(reg).eq('id', r.id) : await sb.from('recursos_producao').insert(reg);
      if (res.error) return toast(erroTexto(res.error), 'erro');
      close(); toast('Salvo.', 'ok'); await carregarRef(); renderProdCadastros();
    })
  });
  $('#pr-novo').addEventListener('click', () => form(null));
  $$('[data-r]').forEach(b => b.addEventListener('click', () => form(S.ref.recursos_producao.find(x => x.id === +b.dataset.r))));
}
function pcMetas() {
  const metas = S.ref.metas_producao.filter(m => m.ativo);
  $('#pc').innerHTML = `<div class="filtros"><button class="btn pri" id="pm-novo">Nova meta</button></div>
    <div class="tw"><table><thead><tr><th>Setor</th><th>Mesa / máquina</th><th class="r">Meta por dia útil</th><th>Medida</th><th>Vale a partir de</th><th></th></tr></thead><tbody>
    ${metas.map(m => `<tr><td><b>${esc(setorPorId(m.setor_id)?.nome || '')}</b></td>
      <td>${esc(S.ref.recursos_producao.find(r => r.id === m.recurso_id)?.nome || 'Setor inteiro')}</td>
      <td class="r num">${numBR(m.meta_diaria)}</td><td>${m.campo === 'm3' ? 'm³' : setorPorId(m.setor_id)?.unidade}</td>
      <td>${dataBR(m.vigencia_inicio)}</td><td class="r"><button class="btn sm" data-m="${m.id}">Editar</button></td></tr>`).join('')}
    ${metas.length ? '' : '<tr><td colspan="6" class="muted">Nenhuma meta cadastrada.</td></tr>'}</tbody></table></div>`;
  const form = m => modal(`<h3>${m ? 'Editar meta' : 'Nova meta'}</h3><form id="f-m" class="grid">
    <div class="grid g2">
      <label class="campo"><span>Setor</span><select class="inp" name="setor_id" ${m ? 'disabled' : ''}>${setoresAtivos().map(s => `<option value="${s.id}" ${m?.setor_id === s.id ? 'selected' : ''}>${esc(s.nome)}</option>`).join('')}</select></label>
      <label class="campo"><span>Mesa / máquina</span><select class="inp" name="recurso_id" ${m ? 'disabled' : ''}><option value="">Setor inteiro</option></select></label>
    </div>
    <div class="grid g3">
      <label class="campo"><span>Meta por dia útil</span><input class="inp qtd-inp" name="meta_diaria" type="number" step="any" min="0" value="${m?.meta_diaria ?? ''}" required></label>
      <label class="campo"><span>Medida</span><select class="inp" name="campo"><option value="m3" ${m?.campo === 'm3' ? 'selected' : ''}>Volume (m³)</option><option value="quantidade" ${m?.campo === 'quantidade' ? 'selected' : ''}>Quantidade</option></select></label>
      <label class="campo"><span>Vale a partir de</span><input class="inp" name="vigencia_inicio" type="date" value="${m?.vigencia_inicio || hojeISO()}" ${m ? 'disabled' : ''}></label>
    </div>
    ${m ? '<label class="check"><input type="checkbox" name="ativo" checked style="accent-color:var(--brand)"><span>Meta ativa</span></label>' : '<div class="muted" style="font-size:13px">A meta antiga continua no histórico: o painel usa a mais recente até cada data.</div>'}
    <div class="acoes"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn pri">Salvar</button></div></form>`, {
    onMount: (el, close) => {
      const f = $('#f-m', el);
      const encher = () => {
        const rs = recursosDoSetor(+f.setor_id.value);
        f.recurso_id.innerHTML = '<option value="">Setor inteiro</option>' + rs.map(r => `<option value="${r.id}" ${m?.recurso_id === r.id ? 'selected' : ''}>${esc(r.nome)}</option>`).join('');
      };
      f.setor_id.addEventListener('change', encher); encher();
      f.addEventListener('submit', async e => {
        e.preventDefault();
        if (m) {
          const { error } = await sb.from('metas_producao').update({ meta_diaria: Number(f.meta_diaria.value), campo: f.campo.value, ativo: f.ativo.checked }).eq('id', m.id);
          if (error) return toast(erroTexto(error), 'erro');
        } else {
          const { error } = await sb.from('metas_producao').insert({ setor_id: +f.setor_id.value, recurso_id: f.recurso_id.value ? +f.recurso_id.value : null,
            meta_diaria: Number(f.meta_diaria.value), campo: f.campo.value, vigencia_inicio: f.vigencia_inicio.value });
          if (error) return toast(/duplicate/i.test(error.message) ? 'Já existe uma meta para este setor com esta data de início.' : erroTexto(error), 'erro');
        }
        close(); toast('Meta salva.', 'ok'); await carregarRef(); renderProdCadastros();
      });
    }
  });
  $('#pm-novo').addEventListener('click', () => form(null));
  $$('[data-m]').forEach(b => b.addEventListener('click', () => form(metas.find(x => x.id === +b.dataset.m))));
}
async function pcCalendario() {
  const d = new Date(), de = new Date(d.getFullYear(), d.getMonth(), 1).toLocaleDateString('sv-SE');
  const ate = new Date(d.getFullYear(), d.getMonth() + 1, 0).toLocaleDateString('sv-SE');
  $('#pc').innerHTML = '<div class="vazio">Carregando…</div>';
  const { data } = await sb.from('calendario_producao').select('*').gte('data', de).lte('data', ate);
  const excecoes = Object.fromEntries((data || []).map(x => [x.data, x]));
  const dias = []; for (let x = new Date(de + 'T12:00:00'); x.toLocaleDateString('sv-SE') <= ate; x.setDate(x.getDate() + 1)) dias.push(x.toLocaleDateString('sv-SE'));
  $('#pc').innerHTML = `<p class="muted">Dias úteis contam a meta no painel. Por padrão, de segunda a sexta. Marque aqui feriados e paradas do mês.</p>
    <div class="cal">${dias.map(dt => {
      const semana = new Date(dt + 'T12:00:00').getDay();
      const ex = excecoes[dt]; const util = ex ? ex.util : semana >= 1 && semana <= 5;
      return `<button class="cal-dia ${util ? 'util' : 'folga'} ${ex ? 'ex' : ''}" data-d="${dt}">
        <b>${dt.slice(8, 10)}</b><span>${['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][semana]}</span>
        <i>${util ? 'útil' : ex?.tipo || (semana === 0 ? 'domingo' : 'sábado')}</i></button>`;
    }).join('')}</div>`;
  $$('.cal-dia').forEach(b => b.addEventListener('click', async () => {
    const dt = b.dataset.d, semana = new Date(dt + 'T12:00:00').getDay();
    const ex = excecoes[dt]; const util = ex ? ex.util : semana >= 1 && semana <= 5;
    const { error } = await sb.from('calendario_producao').upsert({ data: dt, util: !util, tipo: !util ? 'Útil' : 'Parada' });
    if (error) return toast(erroTexto(error), 'erro');
    pcCalendario();
  }));
}

iniciar();
</script>
