/* =====================================================================
   QR CODE — codificador próprio, sem biblioteca de fora, para a etiqueta
   funcionar mesmo com a internet da fábrica caindo.
   Modo byte, correção de erro M (recupera ~15% da área danificada),
   versões 1 a 10 (até 213 caracteres) — de sobra para um código de produto.
   ===================================================================== */
const QR = (() => {
  // capacidade em bytes e estrutura dos blocos, nível M
  const V = [
    null,
    { cap: 14,  ec: 10, blocos: [[1, 16]] },
    { cap: 26,  ec: 16, blocos: [[1, 28]] },
    { cap: 42,  ec: 26, blocos: [[1, 44]] },
    { cap: 62,  ec: 18, blocos: [[2, 32]] },
    { cap: 84,  ec: 24, blocos: [[2, 43]] },
    { cap: 106, ec: 16, blocos: [[4, 27]] },
    { cap: 122, ec: 18, blocos: [[4, 31]] },
    { cap: 152, ec: 22, blocos: [[2, 38], [2, 39]] },
    { cap: 180, ec: 22, blocos: [[3, 36], [2, 37]] },
    { cap: 213, ec: 26, blocos: [[4, 43], [1, 44]] },
  ];
  const ALINHA = [null, [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34],
                  [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50]];

  // ---- aritmética de Galois GF(256) para a correção de erro ----
  const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  for (let i = 0, x = 1; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11D; }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  const mul = (a, b) => (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]];

  function gerador(n) {
    let g = [1];
    for (let i = 0; i < n; i++) {
      const novo = new Array(g.length + 1).fill(0);
      for (let j = 0; j < g.length; j++) {
        novo[j] ^= g[j];                      // termo em x
        novo[j + 1] ^= mul(g[j], EXP[i]);     // termo em α^i
      }
      g = novo;
    }
    return g;
  }
  function correcao(dados, n) {
    const g = gerador(n), r = new Array(n).fill(0);
    for (const d of dados) {
      const f = d ^ r[0];
      r.shift(); r.push(0);
      if (f !== 0) for (let i = 0; i < n; i++) r[i] ^= mul(g[i + 1], f);
    }
    return r;
  }

  // ---- BCH para os bits de formato e de versão ----
  const bch = (v, g, bits) => { let d = v << (bits - 1);
    while (Math.floor(Math.log2(d)) >= bits - 1) d ^= g << (Math.floor(Math.log2(d)) - (bits - 1));
    return (v << (bits - 1)) | d; };
  const formato = mascara => (bch((0 << 3) | mascara, 0x537, 11) | ((0 << 3 | mascara) << 10)) ^ 0x5412;
  const versaoBits = v => (v << 12) | bch(v, 0x1F25, 13);

  const MASCARAS = [
    (i, j) => (i + j) % 2 === 0,
    (i) => i % 2 === 0,
    (i, j) => j % 3 === 0,
    (i, j) => (i + j) % 3 === 0,
    (i, j) => (Math.floor(i / 2) + Math.floor(j / 3)) % 2 === 0,
    (i, j) => (i * j) % 2 + (i * j) % 3 === 0,
    (i, j) => ((i * j) % 2 + (i * j) % 3) % 2 === 0,
    (i, j) => ((i + j) % 2 + (i * j) % 3) % 2 === 0,
  ];

  function matriz(versao) {
    const n = versao * 4 + 17;
    const m = Array.from({ length: n }, () => new Array(n).fill(null));   // null = livre
    const fixo = (r, c, v) => { if (r >= 0 && r < n && c >= 0 && c < n) m[r][c] = v; };
    // localizadores + separadores
    for (const [lr, lc] of [[0, 0], [0, n - 7], [n - 7, 0]])
      for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) {
        const borda = r === -1 || r === 7 || c === -1 || c === 7;
        const anel = (r === 0 || r === 6 || c === 0 || c === 6);
        const miolo = r >= 2 && r <= 4 && c >= 2 && c <= 4;
        fixo(lr + r, lc + c, borda ? 0 : (anel || miolo) ? 1 : 0);
      }
    // alinhamento
    const al = ALINHA[versao];
    for (const r of al) for (const c of al) {
      if ((r <= 8 && c <= 8) || (r <= 8 && c >= n - 9) || (r >= n - 9 && c <= 8)) continue;
      for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++)
        fixo(r + dr, c + dc, (Math.max(Math.abs(dr), Math.abs(dc)) !== 1) ? 1 : 0);
    }
    // temporizadores
    for (let i = 8; i < n - 8; i++) { fixo(6, i, i % 2 === 0 ? 1 : 0); fixo(i, 6, i % 2 === 0 ? 1 : 0); }
    fixo(n - 8, 8, 1);   // módulo sempre escuro
    // reserva do formato
    for (let i = 0; i < 9; i++) { if (m[8][i] === null) m[8][i] = 0; if (m[i][8] === null) m[i][8] = 0; }
    for (let i = 0; i < 8; i++) { if (m[8][n - 1 - i] === null) m[8][n - 1 - i] = 0; if (m[n - 1 - i][8] === null) m[n - 1 - i][8] = 0; }
    // reserva da versão
    if (versao >= 7) for (let i = 0; i < 18; i++) {
      const r = Math.floor(i / 3), c = i % 3;
      if (m[r][n - 11 + c] === null) m[r][n - 11 + c] = 0;
      if (m[n - 11 + c][r] === null) m[n - 11 + c][r] = 0;
    }
    return m;
  }

  function reservado(versao) {
    // mesma matriz, marcando só o que é função (não recebe dado)
    const n = versao * 4 + 17;
    const base = matriz(versao);
    return base.map(linha => linha.map(v => v !== null));
  }

  function montar(texto) {
    const bytes = new TextEncoder().encode(texto);
    const versao = V.findIndex((v, i) => i > 0 && bytes.length <= v.cap);
    if (versao < 1) throw new Error('Texto longo demais para o QR.');
    const cfg = V[versao];
    const totalDados = cfg.blocos.reduce((a, [q, t]) => a + q * t, 0);

    // fluxo de bits: modo 0100 + tamanho + dados
    const bits = [];
    const push = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >> i) & 1); };
    push(0b0100, 4);
    push(bytes.length, versao <= 9 ? 8 : 16);
    bytes.forEach(b => push(b, 8));
    for (let i = 0; i < 4 && bits.length < totalDados * 8; i++) bits.push(0);
    while (bits.length % 8) bits.push(0);
    const dados = [];
    for (let i = 0; i < bits.length; i += 8) dados.push(parseInt(bits.slice(i, i + 8).join(''), 2));
    const enchimento = [0xEC, 0x11];
    for (let i = 0; dados.length < totalDados; i++) dados.push(enchimento[i % 2]);

    // divide em blocos e calcula a correção
    const blocosD = [], blocosE = [];
    let p = 0;
    for (const [qtd, tam] of cfg.blocos) for (let b = 0; b < qtd; b++) {
      const d = dados.slice(p, p + tam); p += tam;
      blocosD.push(d); blocosE.push(correcao(d, cfg.ec));
    }
    // intercala
    const seq = [];
    const maxD = Math.max(...blocosD.map(b => b.length));
    for (let i = 0; i < maxD; i++) for (const b of blocosD) if (i < b.length) seq.push(b[i]);
    for (let i = 0; i < cfg.ec; i++) for (const b of blocosE) seq.push(b[i]);

    // preenche a matriz em ziguezague
    const n = versao * 4 + 17;
    const func = reservado(versao);
    const base = matriz(versao);
    const mapa = base.map(l => l.map(v => v === null ? 0 : v));
    let bi = 0;
    const bit = () => { const i = bi++; return i < seq.length * 8 ? (seq[i >> 3] >> (7 - (i & 7))) & 1 : 0; };
    let subindo = true;
    for (let col = n - 1; col > 0; col -= 2) {
      if (col === 6) col--;
      for (let k = 0; k < n; k++) {
        const r = subindo ? n - 1 - k : k;
        for (const c of [col, col - 1]) if (!func[r][c]) mapa[r][c] = bit();
      }
      subindo = !subindo;
    }

    // escolhe a máscara de menor penalidade
    let melhor = null, melhorNota = Infinity, melhorMasc = 0;
    for (let mk = 0; mk < 8; mk++) {
      const t = mapa.map((l, r) => l.map((v, c) => func[r][c] ? v : (MASCARAS[mk](r, c) ? v ^ 1 : v)));
      aplicarFormato(t, versao, mk);
      const nota = penalidade(t);
      if (nota < melhorNota) { melhorNota = nota; melhor = t; melhorMasc = mk; }
    }
    return { matriz: melhor, versao, tamanho: n, mascara: melhorMasc };
  }

  function aplicarFormato(m, versao, mascara) {
    const n = m.length, f = formato(mascara);
    // cópia 1: coluna 8 de cima para baixo, depois linha 8 da direita para a esquerda
    for (let i = 0; i < 15; i++) {
      const b = (f >> i) & 1;
      if (i < 6) m[i][8] = b;
      else if (i === 6) m[7][8] = b;
      else if (i === 7) m[8][8] = b;
      else if (i === 8) m[8][7] = b;
      else m[8][14 - i] = b;
      // cópia 2
      if (i < 8) m[8][n - 1 - i] = b;
      else m[n - 15 + i][8] = b;
    }
    m[n - 8][8] = 1;
    if (versao >= 7) {
      const v = versaoBits(versao);
      for (let i = 0; i < 18; i++) {
        const b = (v >> i) & 1, r = Math.floor(i / 3), c = i % 3;
        m[r][n - 11 + c] = b; m[n - 11 + c][r] = b;
      }
    }
  }

  function penalidade(m) {
    const n = m.length; let p = 0;
    const corrida = linha => { let s = 0, ant = -1, c = 0;
      for (const v of linha) { if (v === ant) { c++; if (c === 5) s += 3; else if (c > 5) s++; } else { ant = v; c = 1; } }
      return s; };
    for (let i = 0; i < n; i++) { p += corrida(m[i]); p += corrida(m.map(l => l[i])); }
    for (let r = 0; r < n - 1; r++) for (let c = 0; c < n - 1; c++)
      if (m[r][c] === m[r][c + 1] && m[r][c] === m[r + 1][c] && m[r][c] === m[r + 1][c + 1]) p += 3;
    const alvo = [1, 0, 1, 1, 1, 0, 1, 0, 0, 0, 0];
    const achar = linha => { let s = 0;
      for (let i = 0; i + 11 <= linha.length; i++) {
        if (alvo.every((v, k) => linha[i + k] === v)) s += 40;
        if (alvo.every((v, k) => linha[i + 10 - k] === v)) s += 40;
      }
      return s; };
    for (let i = 0; i < n; i++) { p += achar(m[i]); p += achar(m.map(l => l[i])); }
    const escuros = m.flat().filter(v => v === 1).length;
    p += Math.floor(Math.abs(escuros * 100 / (n * n) - 50) / 5) * 10;
    return p;
  }

  /* devolve o QR como <svg>, pronto para imprimir */
  function svg(texto, { lado = 120, margem = 4, classe = '' } = {}) {
    const { matriz: m, tamanho } = montar(texto);
    const total = tamanho + margem * 2;
    const caminho = [];
    for (let r = 0; r < tamanho; r++) for (let c = 0; c < tamanho; c++)
      if (m[r][c]) caminho.push(`M${c + margem} ${r + margem}h1v1h-1z`);
    return `<svg class="qr ${classe}" width="${lado}" height="${lado}" viewBox="0 0 ${total} ${total}"
      xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" role="img" aria-label="QR do produto">
      <rect width="${total}" height="${total}" fill="#fff"/><path d="${caminho.join('')}" fill="#000"/></svg>`;
  }

  return { montar, svg };
})();

/* =====================================================================
   ETIQUETAS — mesmo layout da planilha da fábrica, com QR e cálculo do m³
   ===================================================================== */
const FORMATOS = {
  inteira: { nome: 'Uma por folha (A4 deitada)', alt: 210, porPag: 1 },
  meia:    { nome: 'Duas por folha (A4 deitada)', alt: 105, porPag: 2 },
};
const etqVazia = () => ({
  modelo: 'ESTOQUE', pedido: '', palete: '', produto_id: null, montagem: '', classificacao: '',
  comprimento: '', largura: '', espessura: '', camadas: '', chapas: '', observacoes: '',
  data: hojeISO(), vias: 1,
});
const etq = { formato: 'inteira', fila: [], atual: etqVazia(), editando: null };

const etqM3 = e => (Number(e.comprimento) || 0) * (Number(e.largura) || 0)
  * ((Number(e.espessura) || 0) / 1000) * (Number(e.chapas) || 0);

function etiquetaHTML(e, formato) {
const f = FORMATOS[formato || 'inteira'];
  const p = e.produto_id ? S.estoqueMap.get(e.produto_id) : null;
  const destaque = e.modelo === 'ESTOQUE' ? (e.pedido || '') : (e.palete || '');
  const qtd = Number(e.chapas) || 0;
  const limpo = t => String(t ?? '').replace(/\|/g, ' ').trim().slice(0, 24);
  // o QR leva o produto, as chapas e o contexto da etiqueta, para a baixa reimprimir igual
  const qr = p ? QR.svg([p.codigo, qtd, limpo(e.pedido), limpo(e.palete), e.modelo === 'ESTOQUE' ? '' : 'C']
      .join('|').replace(/\|+$/, ''), { lado: 300, margem: 2 }) : '';
  // o texto grande encolhe para caber na largura do quadro, em vez de ser cortado
  const cabe = (txt, larguraMm, maxFrac) => {
    const n = Math.max(1, String(txt ?? '').length);
    return Math.max(.026, Math.min(maxFrac, larguraMm / (n * 0.74) / 210));
  };
  const bloco = (rot, val, cls = '', largura = 90) => { const t = String(val ?? '');
    return `<div class="eb ${cls}"><span class="er">${rot}</span>
      <b style="font-size:calc(var(--alt)*${cabe(t, largura, .078).toFixed(4)})">${esc(t) || '&nbsp;'}</b></div>`; };
  return `<div class="etq" style="--alt:${f.alt}mm">
    <div class="etq-topo">
      <span class="etq-modelo">${e.modelo === 'ESTOQUE' ? 'ESTOQUE' : 'CLIENTE'}</span>
      <span class="etq-destaque">${esc(destaque)}</span>
      <span class="etq-data">${dataBR(e.data)}</span>
    </div>
    <div class="etq-meio">
      <div class="etq-esq">
        <span class="er">PEDIDO</span>
        <b class="etq-pedido" style="font-size:calc(var(--alt)*${cabe(e.pedido || '—', 104, .15).toFixed(4)})">${esc(e.pedido || '—')}</b>
        ${e.palete ? `<span class="etq-palete">PALETE ${esc(e.palete)}</span>` : ''}
        ${qr ? `<div class="etq-qr">${qr}<span class="cod">${esc(p.codigo)}</span></div>` : ''}
      </div>
      <div class="etq-dir">
        ${bloco('TIPO DE MONTAGEM', e.montagem, 'g', 168)}
        ${bloco('CLASSIFICAÇÃO', e.classificacao, 'g', 168)}
        ${bloco('QUANTIDADE DE LÂMINAS', e.camadas, 'g', 168)}
      </div>
    </div>
    <div class="etq-grade">
      ${bloco('COMPRIMENTO (M)', numBR(e.comprimento))}
      ${bloco('LARGURA (M)', numBR(e.largura))}
      ${bloco('ESPESSURA (MM)', numBR(e.espessura))}
    </div>
    <div class="etq-grade">
      ${bloco('TOTAL DE CHAPAS', pc(qtd))}
      ${bloco('M³', (etqM3(e)).toLocaleString('pt-BR', { minimumFractionDigits: 4, maximumFractionDigits: 4 }))}
      ${bloco('OBSERVAÇÕES', e.observacoes, 'obs')}
    </div>
  </div>`;
}

/* monta uma etiqueta a partir do cadastro do produto */
function etiquetaDoProduto(p, extra = {}) {
  return { ...etqVazia(), produto_id: p.id,
    montagem: [p.categoria, p.especie].filter(Boolean).join(' ').toUpperCase(),
    classificacao: p.classificacao || '',
    comprimento: p.comprimento_m, largura: p.largura_m,
    espessura: p.espessura_mm, camadas: p.camadas ?? '',
    chapas: p.saldo ?? '', ...extra };
}
/* joga na fila e abre a tela de etiquetas */
function enfileirarEtiquetas(itens, msg) {
  etq.fila.push(...itens);
  etq.atual = etqVazia(); etq.editando = null;
  irPara('etiquetas');
  toast(msg, 'ok');
  // com várias de uma vez, leva o olho direto para a fila
  if (itens.length > 1) setTimeout(() => $('#et-fila-tab')?.scrollIntoView({ block: 'center', behavior: 'smooth' }), 120);
}

/* gerar etiquetas de todos os itens do estoque, respeitando o filtro da tela */
function etiquetasEmLote() {
  const lista = filtrarEstoque();
  const comSaldo = lista.filter(p => Number(p.saldo) > 0);
  if (!lista.length) return toast('Nenhum item no filtro atual.', 'erro');

  const esc1 = n => `<b>${pc(n)}</b>`;
  const fechar = modal(`<h3>Gerar etiquetas do estoque</h3>
    <p class="muted" style="margin:-6px 0 14px">Uma etiqueta por item, com o saldo atual e o QR já ligado.
      Elas vão para a fila de impressão, onde você revisa antes de imprimir.</p>
    <div class="msg" style="margin-bottom:14px">
      O filtro da tela está pegando ${esc1(lista.length)} iten(s) —
      ${esc1(comSaldo.length)} com saldo e ${esc1(lista.length - comSaldo.length)} zerado(s).
    </div>
    <div class="campo"><span>Quais itens</span>
      <div class="seg" id="lt-quais">
        <button data-v="saldo" class="on">Só os que têm saldo</button>
        <button data-v="todos">Todos do filtro</button></div></div>
    <div class="grid g2" style="margin-top:12px">
      <label class="campo"><span>Pedido (opcional)</span>
        <input class="inp" id="lt-pedido" maxlength="24" placeholder="Fica igual em todas">
        <small class="muted">Em branco, a etiqueta sai sem pedido.</small></label>
      <label class="campo"><span>Vias de cada etiqueta</span>
        <input class="inp num" id="lt-vias" type="number" min="1" max="5" step="1" value="1"></label>
    </div>
    ${etq.fila.length ? `<div class="campo" style="margin-top:12px"><span>A fila já tem ${pc(etq.fila.length)} etiqueta(s)</span>
      <div class="seg" id="lt-fila"><button data-v="somar" class="on">Somar às que já estão lá</button>
        <button data-v="trocar">Trocar pela nova lista</button></div></div>` : ''}
    <div class="nota" style="margin-top:14px" id="lt-conta"></div>
    <div class="acoes"><button class="btn" data-fechar>Cancelar</button>
      <button class="btn pri" id="lt-gerar">Gerar etiquetas</button></div>`, { wide: true });

  let quais = 'saldo', modoFila = 'somar';
  const alvo = () => quais === 'saldo' ? comSaldo : lista;
  const conta = () => {
    const n = alvo().length * (Number($('#lt-vias').value) || 1);
    $('#lt-conta').innerHTML = n
      ? `Vão para a fila <b>${pc(n)}</b> etiqueta(s) — ${pc(Math.ceil(n / 2))} folha(s) no formato de duas por folha,
         ou ${pc(n)} no de uma por folha. Você escolhe o formato na tela seguinte.`
      : 'Nenhum item selecionado.';
    $('#lt-gerar').disabled = !n;
  };
  $$('#lt-quais button').forEach(b => b.addEventListener('click', () => {
    quais = b.dataset.v; $$('#lt-quais button').forEach(x => x.classList.toggle('on', x === b)); conta();
  }));
  $$('#lt-fila button').forEach(b => b.addEventListener('click', () => {
    modoFila = b.dataset.v; $$('#lt-fila button').forEach(x => x.classList.toggle('on', x === b));
  }));
  $('#lt-vias').addEventListener('input', conta);
  conta();

  $('#lt-gerar').addEventListener('click', () => {
    const vias = Math.min(5, Math.max(1, Number($('#lt-vias').value) || 1));
    const pedido = $('#lt-pedido').value.trim();
    const itens = alvo()
      .slice().sort((a, b) => a.codigo.localeCompare(b.codigo))
      .map(p => etiquetaDoProduto(p, { pedido, vias }));
    if (modoFila === 'trocar') etq.fila.length = 0;
    fechar();
    enfileirarEtiquetas(itens, `${pc(itens.length)} etiqueta(s) na fila. Confira e imprima.`);
  });
}

function renderEtiquetas() {

        data-c="${k}" value="${esc(R[k] ?? '')}" placeholder="${esc(placeholder)}">${sufixo ? `<i>${sufixo}</i>` : ''}</span>
      ${ajuda ? `<small class="muted">${ajuda}</small>` : ''}</label>`;

  $('#main').innerHTML = cabecalho('Etiquetas de estoque',
    'A mesma etiqueta da planilha, com o m³ calculado e um QR para dar baixa pela câmera.',
    `<button class="btn pri" id="et-imprimir">Imprimir</button>`) + `
    <div class="mov">
      <div>
        <div class="painel" style="margin-bottom:16px">
          <div class="campo"><span>Modelo da etiqueta</span>
            <div class="seg" id="et-modelo">

          <div class="grid g3" style="margin-top:12px">
            ${campo('pedido', 'Pedido', { placeholder: 'Ex.: OBEM' })}
            ${campo('palete', 'Palete')}
            <label class="campo"><span>Data</span><input class="inp" type="date" data-c="data" value="${R.data}"></label>
          </div>
        </div>

        <div class="painel" style="margin-bottom:16px">
          <h3>Produto</h3>
          <div class="campo" style="position:relative"><span>Buscar no cadastro (preenche o resto e liga o QR)</span>
            <input class="inp" id="et-busca" autocomplete="off" placeholder="Digite: código, espessura, espécie, qualidade…">
            <div class="lista hidden" id="et-lista" role="listbox"></div></div>
          <div id="et-vinculo" class="et-vinculo"></div>
          <div class="grid g2" style="margin-top:12px">
            ${campo('montagem', 'Tipo de montagem', { placeholder: 'Ex.: PINUS COMBI C/C' })}
            ${campo('classificacao', 'Classificação', { placeholder: 'Ex.: 1°' })}
          </div>
          <div class="grid g4" style="margin-top:12px">
            ${campo('comprimento', 'Comprimento', { tipo: 'number', passo: '0.001', sufixo: 'm' })}
            ${campo('largura', 'Largura', { tipo: 'number', passo: '0.001', sufixo: 'm' })}
            ${campo('espessura', 'Espessura', { tipo: 'number', passo: '0.1', sufixo: 'mm' })}
            ${campo('camadas', 'Qtde de lâminas', { tipo: 'number', passo: '1' })}
          </div>
          <div class="grid g3" style="margin-top:12px">
            ${campo('chapas', 'Total de chapas', { tipo: 'number', passo: '1' })}
            <div class="campo"><span>M³ (calculado)</span><div class="et-m3" id="et-m3">0,0000</div></div>
            ${campo('observacoes', 'Observações', { placeholder: 'Ex.: Cola fenólica' })}
          </div>
          <div class="acoes" style="margin-top:14px">
            <label class="campo" style="max-width:140px"><span>Vias</span>
              <input class="inp num" type="number" min="1" step="1" data-c="vias" value="${R.vias}"></label>
            <button class="btn pri" id="et-fila">${etq.editando == null ? 'Adicionar à fila' : 'Gravar alteração'}</button>
            ${etq.editando != null ? '<button class="btn" id="et-cancelar">Cancelar edição</button>' : ''}
            <button class="btn ghost" id="et-limpar">Limpar campos</button>
          </div>
        </div>

        <div class="painel">
          <h3>Fila de impressão</h3>
          <div class="grid g2" style="margin-bottom:12px">
            <label class="campo"><span>Formato</span>
              <select class="inp" id="et-formato">${Object.entries(FORMATOS).map(([k, f]) =>
                `<option value="${k}" ${k === etq.formato ? 'selected' : ''}>${f.nome}</option>`).join('')}</select></label>
            <div class="campo"><span>Total</span><div class="et-total" id="et-total">—</div></div>

          <div class="tw" id="et-fila-tab"></div>

      </div>
    </div>
    <div id="et-folhas" class="et-folhas"></div>`;
  atualizarLive();

  const marcar = () => $$('#et-modelo button').forEach(b => b.classList.toggle('on', b.dataset.v === R.modelo));
  marcar();
  $$('#et-modelo button').forEach(b => b.addEventListener('click', () => { R.modelo = b.dataset.v; marcar(); previa(); }));
  $$('[data-c]').forEach(i => i.addEventListener('input', () => {
    R[i.dataset.c] = i.value;
    // só as medidas desfazem o vínculo; chapas e pedido são do pacote, não do produto
    if (['comprimento', 'largura', 'espessura', 'camadas'].includes(i.dataset.c)) { R.produto_id = null; vinculo(); }
    previa();
  }));
  $('#et-formato').addEventListener('change', e => { etq.formato = e.target.value; folhas(); previa(); });
  $('#et-imprimir').addEventListener('click', () => {
    if (!etq.fila.length) return toast('Adicione ao menos uma etiqueta à fila.', 'erro');
    window.print();
  });
  $('#et-limpar').addEventListener('click', () => { etq.atual = etqVazia(); etq.editando = null; renderEtiquetas(); });
  $('#et-cancelar')?.addEventListener('click', () => { etq.atual = etqVazia(); etq.editando = null; renderEtiquetas(); });

  /* ---- vínculo com o cadastro ---- */
  let opcoes = [], cursor = 0;
  const busca = $('#et-busca'), lista = $('#et-lista');
  const preencher = p => {
    R.produto_id = p.id;
    R.montagem = p.descricao.replace(/^Compensado\s+/i, '').replace(/\s*–.*$/, '') || p.descricao;
    R.montagem = [p.categoria, p.especie].filter(Boolean).join(' ').toUpperCase();
    R.classificacao = p.classificacao || '';
    R.comprimento = p.comprimento_m; R.largura = p.largura_m;
    R.espessura = p.espessura_mm; R.camadas = p.camadas ?? '';
    busca.value = ''; lista.classList.add('hidden');
    renderEtiquetas();
  };
  const desenharOpcoes = () => {
    const toks = norm(busca.value).split(/\s+/).filter(Boolean);
    opcoes = toks.length ? S.estoque.filter(p => p.ativo && toks.every(t => p._busca.includes(t)))
      .sort((a, b) => a.codigo.localeCompare(b.codigo)).slice(0, 40) : [];
    cursor = 0; lista.classList.toggle('hidden', !toks.length);
    lista.innerHTML = opcoes.length ? opcoes.map((p, i) => `<div class="op ${i === 0 ? 'sel' : ''}" data-i="${i}" role="option">
      <span class="cod">${esc(p.codigo)}</span><span class="d">${esc(descCamadas(p))}</span>
      <span class="q num"><b>${pc(p.saldo)}</b> chapas</span><span class="x">${esc(qualidade(p))}</span></div>`).join('')
      : '<div class="vazio" style="padding:16px">Nenhum produto encontrado.</div>';
    $$('.op[data-i]', lista).forEach(o => o.addEventListener('mousedown', e => { e.preventDefault(); preencher(opcoes[+o.dataset.i]); }));
  };
  busca.addEventListener('input', desenharOpcoes);
  busca.addEventListener('blur', () => setTimeout(() => lista.classList.add('hidden'), 150));
  busca.addEventListener('keydown', e => {
    if (lista.classList.contains('hidden') || !opcoes.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); cursor = (cursor + (e.key === 'ArrowDown' ? 1 : -1) + opcoes.length) % opcoes.length;
      $$('.op', lista).forEach((o, i) => o.classList.toggle('sel', i === cursor));
    }
    if (e.key === 'Enter') { e.preventDefault(); preencher(opcoes[cursor]); }
  });
  function vinculo() {
    const p = R.produto_id ? S.estoqueMap.get(R.produto_id) : null;
    $('#et-vinculo').innerHTML = p
      ? `<div class="nota ok">Ligada a <b class="cod">${esc(p.codigo)}</b> — o QR vai sair na etiqueta.
           <button class="btn sm ghost" id="et-desligar">Desfazer</button></div>`
      : `<div class="nota">Sem produto do cadastro: a etiqueta sai <b>sem QR</b> e não dá para ler na baixa.
           ${podeLancar() ? '<button class="btn sm" id="et-cadastrar">Cadastrar este item agora</button>' : ''}</div>`;
    $('#et-desligar')?.addEventListener('click', () => { R.produto_id = null; vinculo(); previa(); });
    $('#et-cadastrar')?.addEventListener('click', () => cadastroRapido({
      espessura: Number(R.espessura) || null,
      aoCriar: novo => { preencher(novo); toast('Produto cadastrado e ligado à etiqueta.'); },
    }));
  }

  /* ---- fila ---- */
  $('#et-fila').addEventListener('click', () => {
    const falta = ['montagem', 'comprimento', 'largura', 'espessura', 'chapas'].filter(k => !String(R[k] ?? '').trim());

    const copia = { ...R, vias: Math.max(1, Number(R.vias) || 1) };
    if (etq.editando != null) etq.fila[etq.editando] = copia; else etq.fila.push(copia);
    etq.atual = { ...etqVazia(), modelo: R.modelo, pedido: R.pedido, data: R.data, observacoes: R.observacoes };
    etq.editando = null;
    renderEtiquetas();
    toast('Etiqueta na fila.');
  });
  function filaTab() {
    $('#et-fila-tab').innerHTML = etq.fila.length ? `<table><thead><tr><th>Modelo</th><th>Pedido / Palete</th>
      <th>Montagem</th><th class="r">Chapas</th><th class="r">m³</th><th class="r">Vias</th><th></th></tr></thead><tbody>
      ${etq.fila.map((e, i) => `<tr><td>${e.modelo === 'ESTOQUE' ? 'Estoque' : 'Cliente'}</td>
        <td>${esc(e.pedido || '—')}${e.palete ? ` <span class="muted">· pal. ${esc(e.palete)}</span>` : ''}</td>
        <td>${esc(e.montagem)} <span class="muted">${esc(e.classificacao || '')}</span>
          ${e.produto_id ? '' : ' <span class="tag">sem QR</span>'}</td>
        <td class="r num">${pc(e.chapas)}</td><td class="r num">${numBR(etqM3(e))}</td>
        <td class="r num">${e.vias}</td>
        <td class="r"><button class="btn sm" data-ed="${i}">Editar</button>
          <button class="btn sm ghost" data-rm="${i}" aria-label="Tirar da fila">✕</button></td></tr>`).join('')}
      </tbody></table>` : '<div class="vazio">Nenhuma etiqueta na fila ainda.</div>';
    $$('#et-fila-tab [data-ed]').forEach(b => b.addEventListener('click', () => {
      etq.atual = { ...etq.fila[+b.dataset.ed] }; etq.editando = +b.dataset.ed; renderEtiquetas();
    }));
    $$('#et-fila-tab [data-rm]').forEach(b => b.addEventListener('click', () => {
      etq.fila.splice(+b.dataset.rm, 1); if (etq.editando != null) { etq.atual = etqVazia(); etq.editando = null; }
      renderEtiquetas();
    }));
  }

  /* ---- a etiqueta ---- */
  const desenhaEtiqueta = e => etiquetaHTML(e, etq.formato);

  function previa() {
    $('#et-m3').textContent = (etqM3(R)).toLocaleString('pt-BR', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
    const temAlgo = R.montagem || R.chapas || R.comprimento;
    $('#et-previa').innerHTML = temAlgo ? `<div class="et-mini">${desenhaEtiqueta(R)}</div>`
      : '<div class="vazio">Preencha os campos para ver a etiqueta.</div>';
    $('#et-nota').textContent = R.produto_id
      ? 'O QR carrega o código do produto e o total de chapas: na Saída, já vem tudo preenchido.'
      : 'Ligue a etiqueta a um produto do cadastro para ela sair com QR.';
  }

  function folhas() {
    const f = FORMATOS[etq.formato];
    const todas = [];
    etq.fila.forEach(e => { for (let i = 0; i < (e.vias || 1); i++) todas.push(e); });
    const paginas = [];
    for (let i = 0; i < todas.length; i += f.porPag) {
      const pag = todas.slice(i, i + f.porPag);
      while (pag.length < f.porPag) pag.push(null);
      paginas.push(pag);
    }
    $('#et-total').innerHTML = todas.length
      ? `<b>${pc(todas.length)}</b> etiqueta(s)<br><span class="muted">${pc(paginas.length)} folha(s) A4</span>` : '—';
    $('#et-folhas').innerHTML = paginas.map(pag => `<div class="et-folha">
      ${pag.map(e => e ? desenhaEtiqueta(e) : `<div class="etq vazia" style="--alt:${f.alt}mm"></div>`).join('')}</div>`).join('');
  }

  vinculo(); filaTab(); previa(); folhas();
}

/* =====================================================================
   LEITURA DO QR PELA CÂMERA — celular e tablet Android
   ===================================================================== */
async function lerQR(aoLer) {
  const suporta = 'BarcodeDetector' in window;
  let formatos = [];
  if (suporta) { try { formatos = await BarcodeDetector.getSupportedFormats(); } catch {} }
  const podeCamera = suporta && formatos.includes('qr_code') && navigator.mediaDevices?.getUserMedia;

  const fechar = modal(`<h3>Ler QR da etiqueta</h3>
    ${podeCamera ? `<div class="qr-cam"><video id="qr-video" playsinline muted></video><div class="qr-mira"></div></div>
      <p class="muted" id="qr-msg" style="margin:10px 0 0">Aponte a câmera para o QR da etiqueta.</p>`
    : `<p>Este aparelho não lê QR pela câmera do navegador. No Android, use o Chrome atualizado.</p>`}
    <label class="campo" style="margin-top:12px"><span>Ou digite o código da etiqueta</span>
      <input class="inp" id="qr-manual" autocomplete="off" placeholder="Ex.: CP-PI-18-010"></label>
    <div class="acoes"><button class="btn pri" id="qr-usar">Usar este código</button>
      <button class="btn" data-fechar>Cancelar</button></div>`, { onClose: () => parar() });

  let fluxo = null, parado = false;
  const parar = () => { parado = true; fluxo?.getTracks().forEach(t => t.stop()); fluxo = null; };
  const entregar = texto => {
    // a etiqueta carrega "CODIGO|CHAPAS"; aceita também só o código digitado à mão
    const [bruto, qtdTxt, pedido, palete, modelo] = String(texto).trim().replace(/^CELPLAC:/i, '').split('|');
    const cod = (bruto || '').trim();
    const qtd = Number(String(qtdTxt ?? '').trim()) || null;
    const p = S.estoque.find(x => norm(x.codigo) === norm(cod));
    if (!p) { $('#qr-msg') && ($('#qr-msg').textContent = `Código "${cod}" não encontrado no cadastro.`); return false; }
    parar(); fechar();
    aoLer(p, qtd, { pedido: (pedido || '').trim(), palete: (palete || '').trim(),
      modelo: (modelo || '').trim().toUpperCase() === 'C' ? 'CLIENTE' : 'ESTOQUE' });
    return true;
  };
  $('#qr-usar').addEventListener('click', () => {
    const v = $('#qr-manual').value.trim();
    if (!v) return $('#qr-manual').focus();
    if (!entregar(v)) toast('Código não encontrado no cadastro.', 'erro');
  });
  $('#qr-manual').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#qr-usar').click(); } });

  if (!podeCamera) { $('#qr-manual').focus(); return; }
  try {
    fluxo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } });
    const v = $('#qr-video'); if (!v) return parar();
    v.srcObject = fluxo; await v.play();
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    const procurar = async () => {
      if (parado || !document.body.contains(v)) return parar();
      try {
        const achados = await det.detect(v);
        if (achados.length && entregar(achados[0].rawValue)) return;
      } catch {}
      requestAnimationFrame(procurar);
    };
    requestAnimationFrame(procurar);
  } catch (e) {
    parar();
    const msg = $('#qr-msg');
    if (msg) msg.textContent = e?.name === 'NotAllowedError'
      ? 'Permissão de câmera negada. Libere a câmera para este site nas configurações do navegador.'
      : 'Não consegui abrir a câmera deste aparelho. Use o campo abaixo para digitar o código.';
    $('#qr-manual')?.focus();
  }
}

/* =====================================================================
   MOVIMENTAR PELO QR — lê a etiqueta, lança a entrada ou a saída
   e já devolve a etiqueta nova com o saldo do pacote atualizado
   ===================================================================== */
/* as opções vêm dos motivos cadastrados, na ordem: entrada, venda, processos */
const acoesQR = () => {
  const m = S.ref.motivos.filter(x => x.ativo && !x.interno && ['ENTRADA', 'SAIDA'].includes(x.tipo));
  const ordem = x => x.tipo === 'ENTRADA' ? 0 : x.processo ? 2 : 1;
  return m.sort((a, b) => ordem(a) - ordem(b) || a.id - b.id).map(x => ({
    chave: x.id, motivo: x, tipo: x.tipo, rotulo: x.nome,
    ajuda: x.tipo === 'ENTRADA' ? 'Entram chapas novas neste pacote.'
      : x.processo ? `Saem chapas para ${x.nome.toLowerCase()}. Abre pendência no setor que vai receber.`
      : 'Saem chapas do estoque. Respeita o que está reservado.',
  }));
};
let mq = null;   // { produto, pedido, palete, chapas, acao, quantidade, setor_id, data, referencia, observacao, modelo }

function renderMovQR() {
  if (!mq) {
    $('#main').innerHTML = cabecalho('Movimentar pelo QR',
      'Aponte a câmera para a etiqueta do pacote e lance a entrada ou a saída.') + `
      <div class="qr-inicio">
        <div class="qr-chamada">
          <div class="qr-icone">${I.qr}</div>
          <h3>Ler a etiqueta do pacote</h3>
          <p>A câmera traz o produto, o pedido e quantas chapas o pacote tem.
             Você informa o que saiu ou entrou, escolhe o motivo e grava.</p>
          <button class="btn lg pri" id="mq-ler">Ler QR da etiqueta</button>
          <button class="btn ghost" id="mq-buscar">Etiqueta sem QR? Buscar o produto</button>
        </div>
      </div>`;
    atualizarLive();
    $('#mq-ler').addEventListener('click', abrirLeitura);
    $('#mq-buscar').addEventListener('click', abrirBusca);
    return;
  }
  desenharMov();
}

function abrirLeitura() {
  lerQR((p, qtd, ctx = {}) => {
    mq = novoMov(p, qtd, ctx);
    renderMovQR();
  });
}
function novoMov(p, qtd, ctx = {}) {
  return {
    produto_id: p.id, pedido: ctx.pedido || '', palete: ctx.palete || '',
    chapas: qtd ?? '', modelo: ctx.modelo || 'ESTOQUE',
    acao: acoesQR().find(a => a.tipo === 'SAIDA' && !a.motivo.processo)?.chave ?? acoesQR()[0]?.chave, quantidade: '', setor_id: null,
    data: hojeISO(), referencia: '', observacao: '',
  };
}
function abrirBusca() {
  const fechar = modal(`<h3>Buscar o produto</h3>
    <p class="muted" style="margin:-6px 0 12px">Para etiqueta antiga, sem QR, ou quando a câmera não ajuda.</p>
    <div class="campo" style="position:relative"><span>Produto</span>
      <input class="inp" id="mb-busca" autocomplete="off" placeholder="Digite: código, espessura, espécie, qualidade…">
      <div class="lista hidden" id="mb-lista" role="listbox"></div></div>
    <div class="acoes"><button class="btn" data-fechar>Cancelar</button></div>`);
  const busca = $('#mb-busca'), lista = $('#mb-lista');
  let opcoes = [];
  const desenhar = () => {
    const toks = norm(busca.value).split(/\s+/).filter(Boolean);
    opcoes = toks.length ? S.estoque.filter(p => p.ativo && toks.every(t => p._busca.includes(t)))
      .sort((a, b) => a.codigo.localeCompare(b.codigo)).slice(0, 30) : [];
    lista.classList.toggle('hidden', !toks.length);
    lista.innerHTML = opcoes.length ? opcoes.map((p, i) => `<div class="op ${i === 0 ? 'sel' : ''}" data-i="${i}">
      <span class="cod">${esc(p.codigo)}</span><span class="d">${esc(descCamadas(p))}</span>
      <span class="q num"><b>${pc(p.saldo)}</b> chapas</span></div>`).join('')
      : '<div class="vazio" style="padding:16px">Nada encontrado.</div>';
    $$('.op[data-i]', lista).forEach(o => o.addEventListener('mousedown', ev => {
      ev.preventDefault();
      mq = novoMov(opcoes[+o.dataset.i], null, {});
      fechar(); renderMovQR();
    }));
  };
  busca.addEventListener('input', desenhar);
  busca.focus();
}

function desenharMov() {
  const p = S.estoqueMap.get(mq.produto_id);
  if (!p) { mq = null; return renderMovQR(); }
  const acoes = acoesQR();
  const acao = acoes.find(a => a.chave === mq.acao) || acoes[0];
  if (!acao) { $('#main').innerHTML = cabecalho('Movimentar pelo QR', '') + '<div class="vazio">Nenhum motivo de entrada ou saída cadastrado.</div>'; return; }
  mq.acao = acao.chave;
  const motivo = acao.motivo;
  const ehProcesso = !!motivo.processo;
  const setores = S.ref.setores.filter(x => x.ativo);
  if (ehProcesso && mq.setor_id && !setores.some(x => x.id === mq.setor_id)) mq.setor_id = null;

  const naEtiqueta = Number(mq.chapas) || 0;
  const qtd = Number(mq.quantidade) || 0;
  const sinal = acao.tipo === 'ENTRADA' ? 1 : -1;
  const restante = naEtiqueta + sinal * qtd;
  const saldoDepois = Number(p.saldo) + sinal * qtd;
  const usaDisponivel = !!motivo.respeita_reserva;
  const exigeRef = usaDisponivel;   // venda: a NF ou o pedido é obrigatório
  const disponivel = Number(p.disponivel ?? p.saldo);

  $('#main').innerHTML = cabecalho('Movimentar pelo QR',
    'Confira o que veio da etiqueta, informe a quantidade e grave.',
    '<button class="btn" id="mq-outro">Ler outra etiqueta</button>') + `
    <div class="mov">
      <div>
        <div class="painel cartao-prod" style="margin-bottom:16px">
          <div class="cp-topo">
            <div><span class="cod grande">${esc(p.codigo)}</span>
              <div class="cp-desc">${esc(p.descricao)}</div>
              <div class="muted">${[p.camadas ? `${p.camadas} camadas` : '', p.classificacao, p.acabamento].filter(Boolean).map(esc).join(' · ')}</div></div>
            <div class="cp-saldos">
              <div><span class="l">No sistema</span><b class="num">${pc(p.saldo)}</b><span class="u">chapas</span></div>
              ${Number(p.reservado) ? `<div><span class="l">Disponível</span><b class="num">${pc(disponivel)}</b><span class="u">chapas</span></div>` : ''}
            </div>
          </div>
        </div>

        <div class="painel" style="margin-bottom:16px">
          <h3>O pacote da etiqueta</h3>
          <div class="grid g3">
            <label class="campo"><span>Pedido</span><input class="inp" data-m="pedido" value="${esc(mq.pedido)}"></label>
            <label class="campo"><span>Palete</span><input class="inp" data-m="palete" value="${esc(mq.palete)}"></label>
            <label class="campo"><span>Chapas no pacote</span>
              <input class="inp num" type="number" min="0" step="1" data-m="chapas" value="${mq.chapas}">
              <small class="muted">Veio do QR. Corrija se a pilha não bater.</small></label>
          </div>
        </div>

        <div class="painel" style="margin-bottom:16px">
          <h3>O que está acontecendo</h3>
          <div class="seg grande" id="mq-acao">${acoes.map(a =>
            `<button data-v="${a.chave}" class="${a.chave === mq.acao ? 'on' : ''} ${a.tipo === 'ENTRADA' ? 'e' : 's'}">${a.rotulo}</button>`).join('')}</div>
          <p class="muted" style="font-size:13.5px;margin:10px 0 0">${acao.ajuda}</p>
          ${ehProcesso ? `<div class="campo" style="margin-top:14px"><span>Para qual setor vai?</span>
            <div class="seg" id="mq-setor">${setores.map(x => `<button data-v="${x.id}" class="${x.id === mq.setor_id ? 'on' : ''}">${esc(x.nome)}</button>`).join('')}</div>
            <small class="muted">Fica como pendência até você lançar o item no formato novo.</small></div>` : ''}
          <div class="grid g3" style="margin-top:14px">
            <label class="campo"><span>Quantas chapas ${acao.tipo === 'ENTRADA' ? 'entraram' : 'saíram'}</span>
              <input class="inp num grande" type="number" inputmode="numeric" min="1" step="1" data-m="quantidade" value="${mq.quantidade}" autofocus></label>
            <label class="campo"><span>Data</span><input class="inp" type="date" data-m="data" value="${mq.data}" max="${hojeISO()}"></label>
            <label class="campo"><span>${exigeRef ? 'NF / pedido / cliente' : 'Referência'}</span>
              <input class="inp" data-m="referencia" maxlength="60" value="${esc(mq.referencia)}"></label>
          </div>
          <label class="campo" style="margin-top:12px"><span>Observação (opcional)</span>
            <input class="inp" data-m="observacao" maxlength="300" value="${esc(mq.observacao)}"></label>
        </div>
      </div>

      <div class="painel resumo">
        <h3>Como fica</h3>
        <div class="tot"><span>Chapas no pacote</span><b id="mq-ant">${pc(naEtiqueta)}</b></div>
        <div class="tot"><span>${acao.tipo === 'ENTRADA' ? 'Entrando' : 'Saindo'}</span>
          <b class="${acao.tipo === 'ENTRADA' ? 'pos' : 'neg'}">${qtd ? (sinal > 0 ? '+' : '−') + pc(qtd) : '—'}</b></div>
        <div class="tot destaque"><span>Fica no pacote</span><b class="${restante < 0 ? 'neg' : ''}">${pc(Math.max(restante, 0))}</b></div>
        <div class="tot"><span>Saldo do produto</span><b>${pc(saldoDepois)}</b></div>
        <div class="tot"><span>Volume</span><b>${m3(qtd * Number(p.m3_peca))} m³</b></div>
        <div id="mq-aviso" style="margin-top:12px"></div>
        <button class="btn lg ${acao.tipo === 'ENTRADA' ? 'in' : 'out'}" style="width:100%;margin-top:14px" id="mq-gravar">
          Registrar ${acao.tipo === 'ENTRADA' ? 'entrada' : 'saída'}</button>
      </div>
    </div>`;
  atualizarLive();

  $('#mq-outro').addEventListener('click', () => { mq = null; renderMovQR(); });
  $$('[data-m]').forEach(i => i.addEventListener('input', () => {
    mq[i.dataset.m] = i.value;
    if (['quantidade', 'chapas'].includes(i.dataset.m)) atualizarResumo(); else if (i.dataset.m === 'acao') desenharMov();
  }));
  $$('#mq-acao button').forEach(b => b.addEventListener('click', () => { mq.acao = +b.dataset.v; desenharMov(); }));
  $$('#mq-setor button').forEach(b => b.addEventListener('click', () => {
    mq.setor_id = +b.dataset.v;
    $$('#mq-setor button').forEach(x => x.classList.toggle('on', +x.dataset.v === mq.setor_id));
    atualizarResumo();
  }));

  function atualizarResumo() {
    const n = Number(mq.chapas) || 0, q = Number(mq.quantidade) || 0;
    const rest = n + sinal * q, saldo = Number(p.saldo) + sinal * q;
    $('#mq-ant').textContent = pc(n);
    $('.tot:nth-child(3) b', $('.resumo')).textContent = q ? (sinal > 0 ? '+' : '−') + pc(q) : '—';
    const bRest = $('.tot.destaque b');
    bRest.textContent = pc(Math.max(rest, 0)); bRest.classList.toggle('neg', rest < 0);
    $$('.resumo .tot')[3].querySelector('b').textContent = pc(saldo);
    $$('.resumo .tot')[4].querySelector('b').textContent = `${m3(q * Number(p.m3_peca))} m³`;

    const base = usaDisponivel ? disponivel : Number(p.saldo);
    let aviso = '';
    if (q > 0 && sinal < 0 && q > base)
      aviso = `<div class="nota alerta">Está tirando ${pc(q)} chapas e ${usaDisponivel ? 'o disponível' : 'o saldo'} é ${pc(base)}. O sistema vai recusar.</div>`;
    else if (q > 0 && sinal < 0 && n > 0 && q > n)
      aviso = `<div class="nota">A etiqueta diz ${pc(n)} chapas e você está tirando ${pc(q)}. Confira a pilha antes de gravar.</div>`;
    else if (q > 0 && rest === 0 && sinal < 0)
      aviso = '<div class="nota ok">O pacote zera. Não precisa de etiqueta nova.</div>';
    else if (q > 0)
      aviso = `<div class="nota ok">Depois de gravar eu já monto a etiqueta nova com ${pc(Math.max(rest, 0))} chapas.</div>`;
    $('#mq-aviso').innerHTML = aviso;
    $('#mq-gravar').disabled = !q || (sinal < 0 && q > base);
  }
  atualizarResumo();

  $('#mq-gravar').addEventListener('click', async () => {
    const q = Number(mq.quantidade) || 0;
    if (!q || !Number.isInteger(q) || q < 1) return toast('Informe quantas chapas.', 'erro');
    if (ehProcesso && !mq.setor_id) { $('#mq-setor')?.scrollIntoView({ block: 'center' }); return toast('Escolha o setor de destino.', 'erro'); }
    if (!mq.data) return toast('Informe a data.', 'erro');
    if (exigeRef && !mq.referencia.trim()) { $('[data-m=referencia]').focus(); return toast('Informe a NF, o pedido ou o cliente da venda.', 'erro'); }

    const n = Number(mq.chapas) || 0, rest = n + sinal * q;
    const destino = ehProcesso ? ` → ${setores.find(x => x.id === mq.setor_id)?.nome}` : '';
    const ok = await confirmar(`Confirmar ${acao.tipo === 'ENTRADA' ? 'a entrada' : 'a saída'}?`, `
      <p style="margin-top:0"><b class="cod">${esc(p.codigo)}</b> — ${esc(p.descricao)}</p>
      <p style="font-size:17px;margin:12px 0"><b>${acao.rotulo}${destino}</b> · ${pc(q)} chapas · ${m3(q * Number(p.m3_peca))} m³</p>
      <p>${n > 0 ? `O pacote fica com <b>${pc(Math.max(rest, 0))}</b> de ${pc(n)} chapas.` : 'A etiqueta não trouxe a quantidade do pacote.'}
         O saldo do produto passa para <b>${pc(Number(p.saldo) + sinal * q)}</b>.</p>
      ${mq.referencia ? `<p class="muted">Referência: ${esc(mq.referencia)}</p>` : ''}`,
      `Registrar ${acao.tipo === 'ENTRADA' ? 'entrada' : 'saída'}`, acao.tipo === 'ENTRADA' ? 'in' : 'out');
    if (!ok) return;

    const btn = $('#mq-gravar'); btn.disabled = true; btn.textContent = 'Gravando…';
    mq._id ||= uuid();
    try {
      const { data, error } = await sb.rpc('registrar_lancamento', {
        p_id: mq._id,
        p_tipo: acao.tipo,
        p_motivo_id: motivo.id,
        p_data_referencia: mq.data,
        p_itens: [{ produto_id: p.id, quantidade: q }],
        p_referencia: mq.referencia.trim() || null,
        p_observacao: [mq.observacao.trim(), mq.pedido ? `Pedido ${mq.pedido}` : '', mq.palete ? `Palete ${mq.palete}` : '']
          .filter(Boolean).join(' · ') || null,
        p_local_id: null, p_autorizar_sem_saldo: false,
        p_setor_id: ehProcesso ? mq.setor_id : null,
      });
      if (error) throw error;
      toast(data.duplicado
        ? `Esta movimentação já tinha sido gravada (nº ${data.numero}).`
        : `${acao.tipo === 'ENTRADA' ? 'Entrada' : 'Saída'} nº ${data.numero} registrada: ${pc(q)} chapas.${data.processo ? ` Pendência nº ${data.processo} aberta.` : ''}`, 'ok');
      if (data.processo) atualizarPendencias();
      await carregarEstoque().catch(() => {});
      fimDaMovimentacao(p, rest, q, acao);
    } catch (e) {
      btn.disabled = false; btn.textContent = `Registrar ${acao.tipo === 'ENTRADA' ? 'entrada' : 'saída'}`;
      if (e.message === 'SALDO_INSUFICIENTE') {
        await carregarEstoque().catch(() => {});
        return modal(`<h3>Saldo insuficiente</h3>
          <p>O saldo mudou enquanto você preenchia. Confira a quantidade e grave de novo.</p>
          <div class="acoes"><button class="btn pri" data-fechar>Conferir</button></div>`, { onClose: desenharMov });
      }
      toast(erroTexto(e), 'erro');
    }
  });
}

/* depois de gravar: a etiqueta nova, ou o aviso de que não precisa */
function fimDaMovimentacao(prod, restante, qtd, acao) {
  const p = S.estoqueMap.get(prod.id) || prod;   // saldo já recarregado
  const etiqueta = {
    modelo: mq.modelo || 'ESTOQUE', pedido: mq.pedido, palete: mq.palete,
    produto_id: p.id, montagem: [p.categoria, p.especie].filter(Boolean).join(' ').toUpperCase(),
    classificacao: p.classificacao || '', comprimento: p.comprimento_m, largura: p.largura_m,
    espessura: p.espessura_mm, camadas: p.camadas ?? '', chapas: Math.max(restante, 0),
    observacoes: mq.observacao || '', data: hojeISO(), vias: 1,
  };
  const zerou = restante <= 0;
  $('#main').innerHTML = cabecalho('Movimentar pelo QR', 'Pronto.') + `
    <div class="mq-fim um">
      <div class="painel">
        <div class="mq-ok">✓</div>
        <h3 style="text-align:center;margin:8px 0 4px">${acao.tipo === 'ENTRADA' ? 'Entrada' : 'Saída'} registrada</h3>
        <p class="muted" style="text-align:center;margin:0">
          ${pc(qtd)} chapas de <b class="cod">${esc(p.codigo)}</b> · saldo agora ${pc(p.saldo)} chapas</p>
        ${zerou ? `<div class="nota ok" style="margin-top:16px">O pacote zerou. Não precisa de etiqueta nova — pode descartar a antiga.</div>`
          : `<div class="nota ok" style="margin-top:16px">Etiqueta nova com <b>${pc(restante)}</b> chapas, pronta para imprimir e colar no lugar da antiga.</div>`}
        <div class="acoes" style="justify-content:center;margin-top:16px">
          ${zerou ? '' : '<button class="btn pri lg" id="mq-imprimir">Imprimir etiqueta nova</button>'}
          <button class="btn" id="mq-nova">Ler outra etiqueta</button>
          <button class="btn ghost" id="mq-estoque">Ver o estoque</button>
        </div>
      </div>
    </div>
    <div id="et-folhas" class="et-folhas">${zerou ? '' : `<div class="et-folha">${etiquetaHTML(etiqueta, 'inteira')}</div>`}</div>`;
  atualizarLive();
  $('#mq-imprimir')?.addEventListener('click', () => window.print());
  $('#mq-nova').addEventListener('click', () => { mq = null; renderMovQR(); });
  $('#mq-estoque').addEventListener('click', () => { mq = null; irPara('estoque'); });
}

iniciar();
</script>
</body>
</html>
