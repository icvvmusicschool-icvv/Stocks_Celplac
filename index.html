<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Celplac Estoque</title>
<meta name="theme-color" content="#1E2A2F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231E2A2F'/%3E%3Crect x='6' y='8' width='20' height='3' fill='%23E3C88E'/%3E%3Crect x='6' y='12.5' width='20' height='3' fill='%23A9844A'/%3E%3Crect x='6' y='17' width='20' height='3' fill='%23E3C88E'/%3E%3Crect x='6' y='21.5' width='20' height='3' fill='%23A9844A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --ink:#1E2A2F; --ink-2:#2B3A40; --paper:#F2F3EF; --panel:#FFFFFF; --line:#D9DDD6; --line-2:#E8EAE5;
  --muted:#5D6A6D; --brand:#2E6F6A; --brand-ink:#FFFFFF; --brand-soft:#E1EEEC;
  --veneer:#C9A15A; --veneer-l:#E3C88E; --veneer-d:#A9844A;
  --in:#2F7D5B; --in-soft:#E3F1EA; --out:#A8323E; --out-soft:#F6E3E5; --warn:#A86F0C; --warn-soft:#FAEFD9;
  --radius:10px; --radius-s:6px;
  --f:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fc:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  --side:232px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f);font-size:15px;line-height:1.45;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--fc);font-variant-numeric:tabular-nums}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- marca: chapa vista de topo, lâminas cruzadas ---------- */
.mark{display:inline-grid;gap:2px;width:30px}
.mark i{display:block;height:4px;border-radius:1px}
.mark i:nth-child(odd){background:var(--veneer-l)}
.mark i:nth-child(even){background:var(--veneer-d)}
.mark i:nth-child(2){margin-left:3px}.mark i:nth-child(4){margin-right:3px}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:24px;background:var(--ink)}
.login-card{width:100%;max-width:380px;background:var(--panel);border-radius:14px;padding:32px 28px}
.login-card h1{font-family:var(--fc);font-size:28px;line-height:1.1;margin:18px 0 4px;font-weight:700}
.login-card p{margin:0 0 22px;color:var(--muted)}
.login-edge{height:10px;margin:-32px -28px 24px;border-radius:14px 14px 0 0;
  background:repeating-linear-gradient(180deg,var(--veneer-l) 0 2px,var(--veneer-d) 2px 4px)}

/* ---------- estrutura ---------- */
#app{min-height:100%}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--ink);color:#C9D2D4;display:flex;flex-direction:column;padding:18px 14px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px;color:#fff}
.brand b{font-family:var(--fc);font-size:20px;font-weight:700;letter-spacing:.2px}
.brand small{display:block;font-size:12.5px;color:#9FB0B3;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:999px;color:#C9D2D4;text-decoration:none;font-weight:500}
.nav a svg{width:19px;height:19px;flex:none;opacity:.85}
.nav a:hover{background:var(--ink-2);color:#fff}
.nav a.ativo{background:var(--brand);color:#fff;font-weight:700}
.nav .sep{height:1px;background:#33454B;margin:10px 8px}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid #33454B;font-size:13.5px}
.side-foot .who{color:#fff;font-weight:600}
.side-foot .papel{color:#9FB0B3}
.side-foot button{background:none;border:0;color:#9FB0B3;padding:6px 0;cursor:pointer;text-decoration:underline;margin-right:12px}
.main{margin-left:var(--side);padding:26px 32px 60px;max-width:1380px}
.topo{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.topo h2{font-family:var(--fc);font-size:30px;line-height:1.1;margin:0;font-weight:700}
.topo .sub{color:var(--muted);margin-top:4px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:#9AA5A7}
.live.on i{background:var(--in);box-shadow:0 0 0 3px var(--in-soft)}
.bottom-nav{display:none}

/* ---------- componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:9px 16px;border-radius:var(--radius-s);cursor:pointer;font-weight:600;min-height:40px;white-space:nowrap}
.btn:hover{border-color:#B8BFB6}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:#265D59}
.btn.in{background:var(--in);border-color:var(--in);color:#fff}
.btn.out{background:var(--out);border-color:var(--out);color:#fff}
.btn.lg{min-height:52px;font-size:17px;padding:12px 26px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn.sm{min-height:32px;padding:5px 11px;font-size:13.5px}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo>span{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:var(--radius-s);padding:9px 11px;min-height:42px}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{min-height:70px;resize:vertical}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
table.larga{min-width:1180px}
table.larga td{white-space:nowrap}
table.larga td.desc{white-space:normal;min-width:240px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.painel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.painel h3{font-family:var(--fc);font-size:18px;margin:0 0 12px;font-weight:700}
.msg{padding:12px 14px;border-radius:var(--radius-s);background:var(--warn-soft);color:#6B4706;font-size:14px}
.msg.erro{background:var(--out-soft);color:#7A1E28}
.msg.ok{background:var(--in-soft);color:#1D573E}
.muted{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:none;padding:9px 16px;cursor:pointer;font-weight:600;min-height:42px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}

/* tabela */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:14px}
th{position:sticky;top:0;background:#F7F8F5;text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#F7F8F5}
tfoot td{position:sticky;bottom:0;background:#F7F8F5;font-weight:700;border-top:1px solid var(--line)}
.cod{font-family:var(--fc);font-weight:600;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--line-2);color:var(--ink-2)}
.tag.in{background:var(--in-soft);color:var(--in)}.tag.out{background:var(--out-soft);color:var(--out)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.aj{background:var(--brand-soft);color:var(--brand)}
.pos{color:var(--in);font-weight:600}.neg{color:var(--out);font-weight:600}

/* KPIs: a linha da chapa */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.kpi{padding:16px 20px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--fc);font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:17px;font-weight:600;color:var(--muted);margin-left:4px}
.kpi .l{color:var(--muted);font-size:13.5px;margin-top:4px}
.kpi.estoque{background:var(--ink);color:#fff}
.kpi.estoque .l,.kpi.estoque .v small{color:#AFC0C3}
.ply{height:6px;background:repeating-linear-gradient(90deg,var(--veneer-l) 0 18px,var(--veneer-d) 18px 36px)}

/* movimentação */
.mov{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.mov>*{min-width:0}
.picker{position:relative}
.picker .lista{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 30px rgba(30,42,47,.16);max-height:340px;overflow:auto;z-index:30}
.picker .op{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line-2)}
.picker .op:last-child{border-bottom:0}
.picker .op.sel,.picker .op:hover{background:var(--brand-soft)}
.picker .op .d{grid-column:2;font-size:14px}
.picker .op .q{grid-row:1/3;grid-column:3;text-align:right;align-self:center}
.picker .op .x{grid-column:2;font-size:12.5px;color:var(--muted)}
.add-linha{display:grid;grid-template-columns:minmax(0,1fr) 130px auto;gap:10px;align-items:end}
.qtd-inp{font-family:var(--fc);font-size:19px;font-weight:600;text-align:right;height:42px;padding-top:4px;padding-bottom:4px}
.linhas td .inp{min-height:36px;padding:5px 8px;width:96px;text-align:right;font-family:var(--fc);font-size:16px;font-weight:600}
.resumo{position:sticky;top:20px}
.resumo .tot{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line-2)}
.resumo .tot b{font-family:var(--fc);font-size:26px;font-variant-numeric:tabular-nums}
.vazio{padding:34px 16px;text-align:center;color:var(--muted)}

/* modal e toast */
.modal-bg{position:fixed;inset:0;background:rgba(20,28,31,.5);display:grid;place-items:center;padding:16px;z-index:100}
.modal{background:#fff;border-radius:14px;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:22px 24px}
.modal.wide{max-width:960px}
.modal h3{font-family:var(--fc);font-size:22px;margin:0 0 14px}
.modal .acoes{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(420px,calc(100vw - 36px))}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--radius-s);box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:500;border-left:5px solid var(--veneer)}
.toast.ok{border-left-color:#5BC08E}.toast.erro{border-left-color:#E8737E}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.filtros .campo{min-width:140px;flex:1 1 140px}
.filtros .campo.busca{flex:3 1 260px}
.chart-box{position:relative;height:260px}
.lista-alerta{display:flex;flex-direction:column}
.lista-alerta div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.lista-alerta div:last-child{border-bottom:0}
.check{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--out)}

/* ---------- celular e tablet ---------- */
@media (max-width:1100px){.mov{grid-template-columns:minmax(0,1fr)}.resumo{position:static}.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:860px){
  .side{display:none}
  .main{margin-left:0;padding:16px 14px 96px}
  .topo h2{font-size:25px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--ink);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
  .bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:#AFC0C3;text-decoration:none;font-size:11.5px;font-weight:600;padding:6px 2px;border-radius:10px}
  .bottom-nav a svg{width:22px;height:22px}
  .bottom-nav a.ativo{color:#fff;background:var(--brand)}
  .add-linha{grid-template-columns:1fr 110px}
  .add-linha .btn{grid-column:1/-1}
  .kpi .v{font-size:27px}
  /* linhas do lançamento viram cartões no celular */
  table.linhas thead{display:none}
  table.linhas tr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"cod qtd" "desc desc" "saldo del";gap:4px 10px;padding:10px 12px;border-bottom:1px solid var(--line-2)}
  table.linhas td{padding:0;border:0}
  table.linhas td:nth-child(1){grid-area:cod;align-self:center}
  table.linhas td:nth-child(2){grid-area:desc;font-size:14px}
  table.linhas td:nth-child(3){grid-area:qtd}
  table.linhas td:nth-child(4){display:none}
  table.linhas td:nth-child(5){grid-area:saldo;text-align:left;align-self:center}
  table.linhas td:nth-child(6){grid-area:del}
  .mob-menu{display:inline-flex!important}
}
.mob-menu{display:none!important}
@media print{.side,.bottom-nav,.btn{display:none!important}.main{margin:0}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login" class="hidden">
  <form class="login-card" id="form-login" autocomplete="on">
    <div class="login-edge"></div>
    <span class="mark"><i></i><i></i><i></i><i></i><i></i></span>
    <h1>Celplac Estoque</h1>
    <p>Controle de produto acabado. Entre com seu e-mail e senha.</p>
    <div class="grid">
      <label class="campo"><span>E-mail</span><input class="inp" type="email" name="email" required autocomplete="username"></label>
      <label class="campo"><span>Senha</span><input class="inp" type="password" name="senha" required autocomplete="current-password"></label>
      <div id="login-msg"></div>
      <button class="btn pri lg" type="submit">Entrar</button>
    </div>
  </form>
</section>

<!-- ============ APLICAÇÃO ============ -->
<div id="app" class="hidden">
  <aside class="side">
    <div class="brand"><span class="mark"><i></i><i></i><i></i><i></i><i></i></span><div><b>Celplac</b><small>Estoque de produto acabado</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="who" id="who"></div>
      <div class="papel" id="papel"></div>
      <button id="btn-senha">Minha senha</button><button id="btn-sair">Sair</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO
   ===================================================================== */
const SUPABASE_URL = 'https://ymniuviyfcqnattelerj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_wRAnPdxGoXlaO9ya3gcBag_4hIc9VJi';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const S = {               // estado da aplicação
  sessao: null, perfil: null,
  ref: { categorias: [], especies: [], classificacoes: [], acabamentos: [], motivos: [], locais: [] },
  estoque: [], estoqueMap: new Map(), carregadoEm: null,
  rascunhos: {}, charts: [], rota: null, canal: null,
};

/* =====================================================================
   UTILITÁRIOS
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nfI = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
const nf3 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
const nf1 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nfR = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const pc = n => nfI.format(Number(n) || 0);
const m3 = n => nf3.format(Number(n) || 0);
const dataBR = d => d ? new Date(d + (String(d).length === 10 ? 'T12:00:00' : '')).toLocaleDateString('pt-BR') : '';
const horaBR = d => d ? new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
function hojeISO(delta = 0) { const d = new Date(); d.setDate(d.getDate() + delta); return d.toLocaleDateString('sv-SE'); }
function uuid() {
  if (window.crypto?.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\./g, ',');
const ehAdmin = () => S.perfil?.papel === 'ADMIN';
const podeLancar = () => ['ADMIN', 'ENCARREGADO'].includes(S.perfil?.papel);
const PAPEL_NOME = { ADMIN: 'Administrador', ENCARREGADO: 'Encarregado', CONSULTA: 'Consulta / Diretoria' };
const TIPO_NOME = { ENTRADA: 'Entrada', SAIDA: 'Saída', AJUSTE_POSITIVO: 'Ajuste +', AJUSTE_NEGATIVO: 'Ajuste −', ESTORNO: 'Estorno', IMPLANTACAO: 'Saldo inicial' };
const TIPO_TAG = { ENTRADA: 'in', SAIDA: 'out', AJUSTE_POSITIVO: 'aj', AJUSTE_NEGATIVO: 'aj', ESTORNO: 'warn', IMPLANTACAO: '' };
const STATUS = { OK: ['Normal', ''], ZERADO: ['Zerado', 'out'], NEGATIVO: ['Negativo', 'out'], ABAIXO_MINIMO: ['Abaixo do mínimo', 'warn'], ACIMA_MAXIMO: ['Acima do máximo', 'aj'] };
const qualidade = p => [p.classificacao, p.acabamento].filter(Boolean).join(' ') || '—';

function toast(msg, tipo = '') {
  const t = document.createElement('div'); t.className = 'toast ' + tipo; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), tipo === 'erro' ? 7000 : 4200);
}
function erroTexto(e) {
  if (!e) return 'Erro desconhecido.';
  const m = e.message || String(e);
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sem conexão com o servidor. Verifique a internet e tente de novo — nada foi gravado em duplicidade.';
  if (/JWT|expired/i.test(m)) return 'Sua sessão expirou. Entre novamente.';
  if (/duplicate key|produtos_combinacao_uk/i.test(m)) return 'Já existe um produto com essa mesma combinação (espécie, espessura, medida, camadas, classificação e acabamento).';
  if (/violates foreign key/i.test(m)) return 'Este registro está em uso e não pode ser excluído. Desative-o em vez de excluir.';
  if (/row-level security|permission denied/i.test(m)) return 'Seu perfil não tem permissão para esta ação.';
  return m;
}
function modal(html, { wide = false, onMount } = {}) {
  const root = $('#modal-root');
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  root.appendChild(bg);
  const fechar = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') fechar(); };
  document.addEventListener('keydown', onKey);
  bg.addEventListener('mousedown', e => { if (e.target === bg) fechar(); });
  $$('[data-fechar]', bg).forEach(b => b.addEventListener('click', fechar));
  onMount?.(bg.firstElementChild, fechar);
  setTimeout(() => $('input:not([type=hidden]),select,textarea,button.pri', bg)?.focus(), 30);
  return fechar;
}
function confirmar(titulo, corpo, rotulo = 'Confirmar', cls = 'pri') {
  return new Promise(res => {
    let ok = false;
    const fechar = modal(`<h3>${esc(titulo)}</h3>${corpo}<div class="acoes"><button class="btn" data-fechar>Voltar</button><button class="btn lg ${cls}" id="m-ok">${esc(rotulo)}</button></div>`, {
      onMount: (el, close) => { $('#m-ok', el).addEventListener('click', () => { ok = true; close(); res(true); }); }
    });
    const obs = new MutationObserver(() => { if (!document.body.contains($('#m-ok'))) { obs.disconnect(); if (!ok) res(false); } });
    obs.observe($('#modal-root'), { childList: true });
  });
}

async function iniciar() {
  const { data } = await sb.auth.getSession();
  if (data.session) await entrarApp(data.session); else mostrarLogin();
  sb.auth.onAuthStateChange((ev, sess) => {
    if (ev === 'SIGNED_OUT') { S.perfil = null; mostrarLogin(); }
    if (ev === 'TOKEN_REFRESHED' && sess) S.sessao = sess;
  });
}
function mostrarLogin(msg) {
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#login-msg').innerHTML = msg ? `<div class="msg erro">${esc(msg)}</div>` : '';
}
$('#form-login').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, btn = $('button', f);
  btn.disabled = true; btn.textContent = 'Entrando…'; $('#login-msg').innerHTML = '';
  const { data, error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.senha.value });
  btn.disabled = false; btn.textContent = 'Entrar';
  if (error) return mostrarLogin(/Invalid login/i.test(error.message) ? 'E-mail ou senha incorretos.' : erroTexto(error));
  f.senha.value = '';
  await entrarApp(data.session);
});
async function entrarApp(sessao) {
  S.sessao = sessao;
  const { data: perfil, error } = await sb.from('perfis').select('*').eq('id', sessao.user.id).maybeSingle();
  if (error || !perfil || !perfil.ativo) {
    await sb.auth.signOut();
    return mostrarLogin('Seu acesso ainda não foi liberado. Peça ao administrador para ativar seu usuário.');
  }
  S.perfil = perfil;
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  montarMenu();
  $('#main').innerHTML = '<div class="vazio">Carregando estoque…</div>';
  try { await Promise.all([carregarRef(), carregarEstoque()]); }
  catch (e) { $('#main').innerHTML = `<div class="msg erro">${esc(erroTexto(e))}</div>`; return; }
  ligarTempoReal();
  navegar();
}
async function sair() { S.canal && sb.removeChannel(S.canal); S.canal = null; await sb.auth.signOut(); location.hash = ''; }
$('#btn-sair').addEventListener('click', sair);
$('#btn-senha').addEventListener('click', trocarSenha);
function trocarSenha() {
  modal(`<h3>Trocar minha senha</h3><form id="f-senha" class="grid">
    <label class="campo"><span>Nova senha (mínimo 8 caracteres)</span><input class="inp" type="password" name="s1" minlength="8" required autocomplete="new-password"></label>
    <label class="campo"><span>Repita a nova senha</span><input class="inp" type="password" name="s2" minlength="8" required autocomplete="new-password"></label>
    <div class="acoes"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn pri">Salvar senha</button></div></form>`, {
    onMount: (el, close) => $('#f-senha', el).addEventListener('submit', async e => {
      e.preventDefault(); const f = e.target;
      if (f.s1.value !== f.s2.value) return toast('As senhas não conferem.', 'erro');
      const { error } = await sb.auth.updateUser({ password: f.s1.value });
      if (error) return toast(erroTexto(error), 'erro');
      close(); toast('Senha alterada.', 'ok');
    })
  });
}

async function carregarRef() {
  const tabelas = Object.keys(S.ref);
  const res = await Promise.all(tabelas.map(t => sb.from(t).select('*').order(t === 'classificacoes' ? 'ordem' : 'id')));
  res.forEach((r, i) => { if (r.error) throw r.error; S.ref[tabelas[i]] = r.data; });
}
async function carregarEstoque() {
  const { data, error } = await sb.from('vw_estoque').select('*').order('categoria_sigla', { ascending: false })
    .order('especie').order('espessura_mm').order('codigo');
  if (error) throw error;
  data.forEach(p => { p._busca = norm(`${p.codigo} ${p.descricao} ${p.classificacao || ''} ${p.acabamento || ''}`); });
  S.estoque = data; S.estoqueMap = new Map(data.map(p => [p.id, p])); S.carregadoEm = new Date();
}
let recarregaTimer = null;
function ligarTempoReal() {
  if (S.canal) sb.removeChannel(S.canal);
  const aoMudar = () => {
    clearTimeout(recarregaTimer);
    recarregaTimer = setTimeout(async () => {
      try { await carregarEstoque(); } catch { return; }
      atualizarLive();
      document.dispatchEvent(new CustomEvent('estoque-atualizado'));
    }, 400);
  };
  S.canal = sb.channel('estoque-celplac')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'saldos' }, aoMudar)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'produtos' }, aoMudar)
    .subscribe(st => { S.canalOk = st === 'SUBSCRIBED'; atualizarLive(); });
}
// telas que reagem a mudanças feitas por outros usuários
document.addEventListener('estoque-atualizado', () => {
  if (S.rota === 'painel' || S.rota === 'estoque') ROTAS[S.rota].render();
  if (['entrada', 'saida', 'ajuste'].includes(S.rota)) S.atualizarLinhas?.();
});

async function renderPainel() {
  const est = S.estoque.filter(p => p.ativo);
  const totPc = est.reduce((a, p) => a + p.saldo, 0), totM3 = est.reduce((a, p) => a + Number(p.m3_total), 0);
  const comCusto = est.filter(p => p.custo_unitario != null);
  const valor = comCusto.reduce((a, p) => a + Number(p.valor_total || 0), 0);
  const alertas = est.filter(p => p.status !== 'OK').sort((a, b) => a.saldo - b.saldo);
  const zerados = est.filter(p => p.status === 'ZERADO' || p.status === 'NEGATIVO').length;
  const abaixo = est.filter(p => p.status === 'ABAIXO_MINIMO').length;

  $('#main').innerHTML = cabecalho('Painel', `Posição do estoque de produto acabado em ${new Date().toLocaleDateString('pt-BR')}`) + `
    <div class="kpis">
      <div class="kpi estoque"><div class="v num">${m3(totM3)}<small>m³</small></div><div class="l">${pc(totPc)} peças em ${pc(est.length)} itens</div></div>
      <div class="kpi"><div class="v num pos" id="k-ent">—</div><div class="l">Entradas hoje</div></div>
      <div class="kpi"><div class="v num neg" id="k-sai">—</div><div class="l">Saídas hoje</div></div>
      <div class="kpi"><div class="v num">${zerados}<small>zerados</small></div><div class="l">${abaixo} abaixo do mínimo${comCusto.length ? ` · valor ${nfR.format(valor)}` : ''}</div></div>
    </div>
    <div class="ply" style="border-radius:3px;margin:-10px 0 18px" aria-hidden="true"></div>
    <div class="grid g2" style="margin-bottom:14px">
      <div class="painel"><h3>Estoque por espécie (m³)</h3><div class="chart-box"><canvas id="c-esp"></canvas></div></div>
      <div class="painel"><h3>Estoque por espessura (m³)</h3><div class="chart-box"><canvas id="c-espess"></canvas></div></div>
    </div>
    <div class="painel" style="margin-bottom:14px"><h3>Entradas e saídas — últimos 30 dias (m³)</h3><div class="chart-box"><canvas id="c-mov"></canvas></div></div>
    <div class="grid g2">
      <div class="painel"><h3>Alertas de estoque</h3><div class="lista-alerta">${alertas.length ? alertas.slice(0, 12).map(p => `
        <div><span><span class="cod">${esc(p.codigo)}</span> <span class="muted">${esc(p.descricao)} · ${esc(qualidade(p))}</span></span>
        <span class="tag ${STATUS[p.status][1]}">${STATUS[p.status][0]} · ${pc(p.saldo)} pç</span></div>`).join('')
        + (alertas.length > 12 ? `<div><a href="#/estoque?status=alerta">Ver todos os ${alertas.length} alertas</a></div>` : '')
        : '<div class="muted">Nenhum item zerado ou abaixo do mínimo.</div>'}</div>
        <p class="muted" style="font-size:13px;margin:10px 0 0">Estoque mínimo e máximo são definidos em Cadastros › Produtos.</p></div>
      <div class="painel"><h3>Últimos lançamentos</h3><div class="lista-alerta" id="ultimos"><div class="muted">Carregando…</div></div></div>
    </div>`;
  atualizarLive();

  // gráficos de estoque
  const porEsp = agrupar(est, p => `${p.categoria} ${p.especie}`, p => Number(p.m3_total));
  S.charts.push(new Chart($('#c-esp'), cfgBarra(Object.keys(porEsp), [{ label: 'm³', data: Object.values(porEsp), backgroundColor: '#C9A15A' }], true)));
  const porEspess = agrupar([...est].sort((a, b) => a.espessura_mm - b.espessura_mm), p => `${String(Number(p.espessura_mm)).replace('.', ',')} mm`, p => Number(p.m3_total));
  S.charts.push(new Chart($('#c-espess'), cfgBarra(Object.keys(porEspess), [{ label: 'm³', data: Object.values(porEspess), backgroundColor: '#2E6F6A' }])));

  // movimentos
  const desde = hojeISO(-29);
  const { data: movs, error } = await sb.from('vw_movimentacoes')
    .select('numero,tipo,data_referencia,criado_em,usuario_nome,motivo,quantidade_assinada,m3_assinado,sinal,m3,quantidade')
    .gte('data_referencia', desde).neq('tipo', 'IMPLANTACAO').order('criado_em', { ascending: false }).limit(5000);
  if (S.rota !== 'painel') return;
  if (error) { $('#ultimos').innerHTML = `<div class="msg erro">${esc(erroTexto(error))}</div>`; return; }
  const hoje = hojeISO();
  const ent = movs.filter(m => m.data_referencia === hoje && m.sinal > 0 && m.tipo === 'ENTRADA');
  const sai = movs.filter(m => m.data_referencia === hoje && m.sinal < 0 && m.tipo === 'SAIDA');
  $('#k-ent').innerHTML = `${m3(ent.reduce((a, m) => a + Number(m.m3), 0))}<small>m³</small>`;
  $('#k-ent').nextElementSibling.textContent = `Entradas hoje · ${pc(ent.reduce((a, m) => a + m.quantidade, 0))} pç`;
  $('#k-sai').innerHTML = `${m3(sai.reduce((a, m) => a + Number(m.m3), 0))}<small>m³</small>`;
  $('#k-sai').nextElementSibling.textContent = `Saídas hoje · ${pc(sai.reduce((a, m) => a + m.quantidade, 0))} pç`;

  const dias = [...Array(30)].map((_, i) => hojeISO(i - 29));
  const e30 = dias.map(d => movs.filter(m => m.data_referencia === d && m.tipo === 'ENTRADA').reduce((a, m) => a + Number(m.m3), 0));
  const s30 = dias.map(d => movs.filter(m => m.data_referencia === d && m.tipo === 'SAIDA').reduce((a, m) => a + Number(m.m3), 0));
  S.charts.push(new Chart($('#c-mov'), cfgBarra(dias.map(d => d.slice(8, 10) + '/' + d.slice(5, 7)),
    [{ label: 'Entradas', data: e30, backgroundColor: '#2F7D5B' }, { label: 'Saídas', data: s30, backgroundColor: '#A8323E' }], false, true)));

  const lanc = []; const vistos = new Set();
  for (const m of movs) { if (!vistos.has(m.numero)) { vistos.add(m.numero); lanc.push(m); } if (lanc.length >= 10) break; }
  $('#ultimos').innerHTML = lanc.length ? lanc.map(m => {
    const itens = movs.filter(x => x.numero === m.numero);
    return `<div><span><span class="tag ${TIPO_TAG[m.tipo]}">${TIPO_NOME[m.tipo]}</span> nº ${m.numero} · ${esc(m.motivo || '')} <span class="muted">· ${esc(m.usuario_nome)} · ${horaBR(m.criado_em)}</span></span>
      <span class="num ${m.sinal > 0 ? 'pos' : 'neg'}">${m.sinal > 0 ? '+' : '−'}${m3(itens.reduce((a, x) => a + Number(x.m3), 0))} m³</span></div>`;
  }).join('') : '<div class="muted">Nenhum lançamento nos últimos 30 dias.</div>';
}
function agrupar(lista, chave, valor) { const o = {}; lista.forEach(x => { const k = chave(x); o[k] = (o[k] || 0) + valor(x); }); return o; }
function cfgBarra(labels, datasets, horizontal = false, legenda = false) {
  return {
    type: 'bar', data: { labels, datasets: datasets.map(d => ({ ...d, borderRadius: 3, maxBarThickness: 34 })) },
    options: {
      indexAxis: horizontal ? 'y' : 'x', responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: legenda, labels: { font: { family: 'Barlow' } } },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${m3(c.parsed[horizontal ? 'x' : 'y'])} m³` } } },
      scales: { x: { grid: { display: horizontal }, ticks: { font: { family: 'Barlow Semi Condensed' } } },
                y: { grid: { display: !horizontal }, ticks: { font: { family: 'Barlow Semi Condensed' } } } }
    }
  };
}

      <label class="campo"><span>Acabamento</span><select class="inp" id="f-acabamento"><option value="">Todos</option>${opts(S.ref.acabamentos.map(c => c.nome), filtroEst.acabamento)}</select></label>
      <label class="campo"><span>Situação</span><select class="inp" id="f-status"><option value="">Todas</option>
        <option value="alerta" ${filtroEst.status === 'alerta' ? 'selected' : ''}>Com alerta</option>
        <option value="comsaldo" ${filtroEst.status === 'comsaldo' ? 'selected' : ''}>Com saldo</option>
        <option value="ZERADO" ${filtroEst.status === 'ZERADO' ? 'selected' : ''}>Zerados</option>
        <option value="ABAIXO_MINIMO" ${filtroEst.status === 'ABAIXO_MINIMO' ? 'selected' : ''}>Abaixo do mínimo</option></select></label>
    </div>
    <div class="tw" id="t-est"></div>
    <p class="muted" style="font-size:13px">Clique em um item para ver as últimas movimentações.</p>`;
  atualizarLive();
  const desenhar = () => {
    const lista = filtrarEstoque();
    const tp = lista.reduce((a, p) => a + p.saldo, 0), tm = lista.reduce((a, p) => a + Number(p.m3_total), 0);
    $('#t-est').innerHTML = lista.length ? `<table><thead><tr><th>Código</th><th>Descrição</th><th>Classificação</th><th>Acabamento</th><th class="r">Peças</th><th class="r">m³</th><th>Situação</th></tr></thead><tbody>
      ${lista.map(p => `<tr class="click" data-id="${p.id}"><td class="cod">${esc(p.codigo)}</td><td>${esc(p.descricao)}${p.ativo ? '' : ' <span class="tag">inativo</span>'}</td>
        <td>${esc(p.classificacao || '—')}</td><td>${esc(p.acabamento || '—')}</td><td class="r num ${p.saldo < 0 ? 'neg' : ''}">${pc(p.saldo)}</td><td class="r num">${m3(p.m3_total)}</td>
        <td><span class="tag ${STATUS[p.status][1]}">${STATUS[p.status][0]}</span></td></tr>`).join('')}
      </tbody><tfoot><tr><td colspan="4">${pc(lista.length)} itens</td><td class="r num">${pc(tp)}</td><td class="r num">${m3(tm)}</td><td></td></tr></tfoot></table>`
      : '<div class="vazio">Nenhum item com esses filtros. Limpe a busca ou mude a situação.</div>';
    $$('#t-est tr[data-id]').forEach(tr => tr.addEventListener('click', () => detalheProduto(+tr.dataset.id)));
  };
  ['busca', 'categoria', 'especie', 'espessura', 'classificacao', 'acabamento', 'status'].forEach(k =>
    $('#f-' + k).addEventListener(k === 'busca' ? 'input' : 'change', e => { filtroEst[k] = e.target.value; desenhar(); }));
  $('#x-xlsx').addEventListener('click', () => exportarEstoque('xlsx'));
  $('#x-pdf').addEventListener('click', () => exportarEstoque('pdf'));
  desenhar();
}
function filtrarEstoque() {
  const toks = norm(filtroEst.busca).split(/\s+/).filter(Boolean);
  return S.estoque.filter(p => (p.ativo || p.saldo !== 0)
    && toks.every(t => p._busca.includes(t))
    && (!filtroEst.categoria || p.categoria === filtroEst.categoria)
    && (!filtroEst.especie || p.especie === filtroEst.especie)
    && (!filtroEst.espessura || Number(p.espessura_mm) === Number(filtroEst.espessura))
    && (!filtroEst.classificacao || p.classificacao === filtroEst.classificacao)
    && (!filtroEst.acabamento || p.acabamento === filtroEst.acabamento)
    && (!filtroEst.status || (filtroEst.status === 'alerta' ? p.status !== 'OK' : filtroEst.status === 'comsaldo' ? p.saldo > 0 : p.status === filtroEst.status)));
}
async function detalheProduto(id) {

    <div class="grid g4" style="margin-bottom:16px">
      <div><div class="muted">Saldo</div><b class="num" style="font-size:24px">${pc(p.saldo)} pç</b></div>
      <div><div class="muted">Volume</div><b class="num" style="font-size:24px">${m3(p.m3_total)} m³</b></div>
      <div><div class="muted">Qualidade</div><b>${esc(qualidade(p))}</b></div>
      <div><div class="muted">Mín. / Máx.</div><b class="num">${pc(p.estoque_minimo)} / ${p.estoque_maximo == null ? '—' : pc(p.estoque_maximo)}</b></div>
    </div>
    <div class="tw" style="max-height:46vh" id="d-mov"><div class="vazio">Carregando movimentações…</div></div>

  $('#d-editar')?.addEventListener('click', () => { fechar(); formProduto(p); });
  const { data, error } = await sb.from('vw_movimentacoes').select('*').eq('produto_id', id).order('criado_em', { ascending: false }).limit(50);
  const box = $('#d-mov'); if (!box) return;
  if (error) return box.innerHTML = `<div class="msg erro">${esc(erroTexto(error))}</div>`;
  box.innerHTML = `<table><thead><tr><th>Data</th><th>Nº</th><th>Tipo</th><th class="r">Qtde</th><th class="r">Saldo após</th><th>Usuário</th><th>Referência</th></tr></thead><tbody>
    ${data.map(m => `<tr><td>${dataBR(m.data_referencia)}</td><td class="num">${m.numero}</td><td><span class="tag ${TIPO_TAG[m.tipo]}">${TIPO_NOME[m.tipo]}</span> ${esc(m.motivo || '')}</td>
      <td class="r num ${m.sinal > 0 ? 'pos' : 'neg'}">${m.sinal > 0 ? '+' : '−'}${pc(m.quantidade)}</td><td class="r num">${pc(m.saldo_posterior)}</td>
      <td>${esc(m.usuario_nome)}</td><td>${esc(m.referencia || '')}</td></tr>`).join('')}</tbody></table>`;
}

/* =====================================================================
   MOVIMENTAÇÃO — ENTRADA / SAÍDA / AJUSTE

function novoRascunho(modo) {

}
function renderMov(modo) {
  const R = S.rascunhos[modo] ||= novoRascunho(modo);
  const motivos = S.ref.motivos.filter(m => m.ativo && m.tipo === (modo === 'AJUSTE' ? 'AJUSTE' : modo));
  if (!R.motivo_id || !motivos.some(m => m.id === R.motivo_id)) R.motivo_id = motivos[0]?.id ?? null;
  const T = {

          </div>
          ${modo === 'ENTRADA' ? `<div class="seg" id="m-atalho" style="justify-self:start" aria-label="Atalho de data"><button data-d="0">Hoje</button><button data-d="-1">Ontem</button></div>` : ''}
          <label class="campo"><span>${modo === 'AJUSTE' ? 'Justificativa (obrigatória)' : 'Observação (opcional)'}</span><textarea class="inp" id="m-obs" maxlength="500" placeholder="${modo === 'AJUSTE' ? 'Ex.: contagem física de 10/11 encontrou 12 chapas a menos' : ''}">${esc(R.observacao)}</textarea></label>
        </div>
        <div class="painel">
          <div class="add-linha">
            <div class="campo picker"><span>Produto</span><input class="inp" id="m-busca" autocomplete="off" placeholder="Digite: código, espessura, espécie, qualidade… ex.: 18 pinus c+">
              <div class="lista hidden" id="m-lista" role="listbox"></div></div>
            <label class="campo"><span>Peças</span><input class="inp qtd-inp" id="m-qtd" type="number" inputmode="numeric" min="1" step="1"></label>

      <div class="painel resumo">

        <div id="r-aviso" style="margin-top:12px"></div>
        <button class="btn lg ${T.cls}" style="width:100%;margin-top:14px" id="m-registrar">${T.btn}</button>
        <button class="btn ghost" style="width:100%;margin-top:6px" id="m-limpar">Limpar lançamento</button>
      </div>
    </div>`;

  // cabeçalho

  if (modo !== 'ENTRADA') {
    marcarSeg('#m-motivo', R.motivo_id);
    $$('#m-motivo button').forEach(b => b.addEventListener('click', () => { R.motivo_id = +b.dataset.v; marcarSeg('#m-motivo', R.motivo_id); }));
  }
  if (modo === 'AJUSTE') {
    marcarSeg('#m-dir', R.direcao);
    $$('#m-dir button').forEach(b => b.addEventListener('click', () => { R.direcao = b.dataset.v; marcarSeg('#m-dir', R.direcao); desenharLinhas(); }));
  }
  $('#m-data').addEventListener('change', e => R.data = e.target.value);
  $('#m-ref').addEventListener('input', e => R.referencia = e.target.value);
  $('#m-obs').addEventListener('input', e => R.observacao = e.target.value);
  const marcarAtalho = () => $$('#m-atalho button').forEach(b => b.classList.toggle('on', hojeISO(+b.dataset.d) === R.data));
  $$('#m-atalho button').forEach(b => b.addEventListener('click', () => { R.data = hojeISO(+b.dataset.d); $('#m-data').value = R.data; marcarAtalho(); }));
  $('#m-data').addEventListener('change', marcarAtalho);
  marcarAtalho();

  // seletor de produto
  let escolhido = null, opcoes = [], cursor = 0;
  const busca = $('#m-busca'), lista = $('#m-lista'), qtd = $('#m-qtd');
  const desenharOpcoes = () => {
    const toks = norm(busca.value).split(/\s+/).filter(Boolean);
    opcoes = toks.length ? S.estoque.filter(p => p.ativo && toks.every(t => p._busca.includes(t)))
      .sort((a, b) => (norm(b.codigo).startsWith(toks[0]) - norm(a.codigo).startsWith(toks[0])) || a.codigo.localeCompare(b.codigo)).slice(0, 40) : [];
    cursor = 0;
    lista.classList.toggle('hidden', !toks.length);
    lista.innerHTML = opcoes.length ? opcoes.map((p, i) => `<div class="op ${i === 0 ? 'sel' : ''}" data-i="${i}" role="option">
      <span class="cod">${esc(p.codigo)}</span><span class="d">${esc(p.descricao)}</span>
      <span class="q num"><b>${pc(p.saldo)}</b> pç</span><span class="x">${esc(qualidade(p))}</span></div>`).join('')
      : '<div class="vazio" style="padding:16px">Nenhum produto encontrado. Tente outras palavras ou peça ao administrador para cadastrar.</div>';
    $$('.op', lista).forEach(o => o.addEventListener('mousedown', e => { e.preventDefault(); escolher(opcoes[+o.dataset.i]); }));
  };
  const escolher = p => {
    escolhido = p; busca.value = `${p.codigo} — ${p.descricao} ${qualidade(p)}`; lista.classList.add('hidden');
    $('#m-sel').innerHTML = `Saldo atual: <b class="num">${pc(p.saldo)} pç</b> (${m3(p.m3_total)} m³) · ${m3(p.m3_peca)} m³ por peça`;
    qtd.focus(); qtd.select();
  };
  busca.addEventListener('input', () => { escolhido = null; $('#m-sel').textContent = ''; desenharOpcoes(); });
  busca.addEventListener('focus', () => { if (!escolhido && busca.value) desenharOpcoes(); });
  busca.addEventListener('blur', () => setTimeout(() => lista.classList.add('hidden'), 120));
  busca.addEventListener('keydown', e => {
    if (lista.classList.contains('hidden') || !opcoes.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); cursor = (cursor + (e.key === 'ArrowDown' ? 1 : -1) + opcoes.length) % opcoes.length;
      $$('.op', lista).forEach((o, i) => o.classList.toggle('sel', i === cursor)); $$('.op', lista)[cursor].scrollIntoView({ block: 'nearest' });
    }
    if (e.key === 'Enter') { e.preventDefault(); escolher(opcoes[cursor]); }
  });
  const adicionar = () => {
    if (!escolhido) { busca.focus(); return toast('Escolha um produto da lista.', 'erro'); }
    const n = Number(qtd.value);
    if (!Number.isInteger(n) || n <= 0) { qtd.focus(); return toast('Informe a quantidade em peças (número inteiro maior que zero).', 'erro'); }
    const ex = R.linhas.find(l => l.produto_id === escolhido.id);
    if (ex) ex.quantidade += n; else R.linhas.push({ produto_id: escolhido.id, quantidade: n });
    escolhido = null; busca.value = ''; qtd.value = ''; $('#m-sel').textContent = '';
    desenharLinhas(); busca.focus();
  };
  $('#m-add').addEventListener('click', adicionar);
  qtd.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); adicionar(); } });

  // linhas do lançamento

    let tp = 0, tm = 0, faltas = 0;
    $('#m-linhas').innerHTML = R.linhas.length ? `<table class="linhas"><thead><tr><th>Código</th><th>Descrição</th><th class="r">Peças</th><th class="r">m³</th><th class="r">Saldo</th><th></th></tr></thead><tbody>
      ${R.linhas.map((l, i) => {
        const p = S.estoqueMap.get(l.produto_id); const vm = l.quantidade * Number(p.m3_peca); const depois = p.saldo + s * l.quantidade;
        tp += l.quantidade; tm += vm; if (depois < 0) faltas++;
        return `<tr><td class="cod">${esc(p.codigo)}</td><td>${esc(p.descricao)} <span class="muted">${esc(qualidade(p))}</span></td>
          <td class="r"><input class="inp" type="number" min="1" step="1" inputmode="numeric" data-i="${i}" value="${l.quantidade}" aria-label="Peças"></td>
          <td class="r num">${m3(vm)}</td><td class="r num" style="white-space:nowrap">${pc(p.saldo)} → <b class="${depois < 0 ? 'neg' : ''}">${pc(depois)}</b></td>
          <td class="r"><button class="btn sm ghost" data-del="${i}" aria-label="Remover">Remover</button></td></tr>`;
      }).join('')}</tbody></table>`
      : `<div class="vazio">Nenhum item ainda. Busque o produto acima, informe as peças e pressione Enter.</div>`;
    $('#r-itens').textContent = pc(R.linhas.length); $('#r-pc').textContent = pc(tp); $('#r-m3').textContent = m3(tm) + ' m³';
    $$('#m-linhas input[data-i]').forEach(inp => inp.addEventListener('change', () => {
      const n = Number(inp.value);

      R.linhas[+inp.dataset.i].quantidade = n; desenharLinhas();
    }));
    $$('#m-linhas [data-del]').forEach(b => b.addEventListener('click', () => { R.linhas.splice(+b.dataset.del, 1); desenharLinhas(); }));
    $('#r-aviso').innerHTML = faltas ? `<div class="msg erro">${faltas} ${faltas > 1 ? 'itens ficariam' : 'item ficaria'} com saldo negativo. Corrija a quantidade${ehAdmin() ? ' ou autorize abaixo.' : '.'}</div>
      ${ehAdmin() && s < 0 ? `<label class="check" style="margin-top:10px"><input type="checkbox" id="m-autoriza" ${R.autorizar ? 'checked' : ''}><span>Autorizo como administrador a saída acima do saldo disponível.</span></label>` : ''}` : '';
    $('#m-autoriza')?.addEventListener('change', e => R.autorizar = e.target.checked);
    $('#m-registrar').disabled = !R.linhas.length;
    R._faltas = faltas;
  }
  S.atualizarLinhas = desenharLinhas;
  desenharLinhas();

  $('#m-limpar').addEventListener('click', async () => {
    if (R.linhas.length && !(await confirmar('Limpar lançamento?', '<p>Os itens adicionados serão descartados. Nada foi gravado ainda.</p>', 'Limpar', 'out'))) return;
    S.rascunhos[modo] = novoRascunho(modo); renderMov(modo);
  });

  $('#m-registrar').addEventListener('click', async () => {
    const tipo = modo === 'AJUSTE' ? R.direcao : modo;
    if (!R.linhas.length) return;
    if (!R.data) return toast('Informe a data.', 'erro');
    if (modo !== 'ENTRADA' && !R.motivo_id) return toast('Escolha o motivo.', 'erro');
    if (modo === 'AJUSTE' && R.observacao.trim().length < 5) { $('#m-obs').focus(); return toast('Escreva a justificativa do ajuste.', 'erro'); }
    if (R._faltas && !(ehAdmin() && R.autorizar)) return toast('Há itens sem saldo suficiente. Corrija as quantidades.', 'erro');
    const motivo = S.ref.motivos.find(m => m.id === R.motivo_id)?.nome;
    const tp = R.linhas.reduce((a, l) => a + l.quantidade, 0);
    const tm = R.linhas.reduce((a, l) => a + l.quantidade * Number(S.estoqueMap.get(l.produto_id).m3_peca), 0);
    const ok = await confirmar(`Confirmar ${TIPO_NOME[tipo].toLowerCase()}?`, `
      <p style="margin-top:0">${modo === 'ENTRADA' ? 'Produção do dia' : esc(motivo)} · ${dataBR(R.data)}${R.referencia ? ' · ' + esc(R.referencia) : ''}</p>
      <div class="tw" style="max-height:40vh"><table><tbody>${R.linhas.map(l => { const p = S.estoqueMap.get(l.produto_id);
        return `<tr><td class="cod">${esc(p.codigo)}</td><td>${esc(p.descricao)} <span class="muted">${esc(qualidade(p))}</span></td><td class="r num"><b>${pc(l.quantidade)}</b> pç</td></tr>`; }).join('')}</tbody></table></div>
      <p style="font-size:18px;margin-bottom:0"><b class="num">${pc(tp)} peças · ${m3(tm)} m³</b></p>`, T.btn, T.cls);
    if (!ok) return;
    const btn = $('#m-registrar'); btn.disabled = true; btn.textContent = 'Gravando…';
    const { data, error } = await sb.rpc('registrar_lancamento', {
      p_id: R.id, p_tipo: tipo, p_motivo_id: R.motivo_id, p_data_referencia: R.data,
      p_itens: R.linhas.map(l => ({ produto_id: l.produto_id, quantidade: l.quantidade })),
      p_referencia: R.referencia || null, p_observacao: R.observacao || null, p_local_id: null,
      p_autorizar_sem_saldo: ehAdmin() && R.autorizar && !!R._faltas,
    });
    btn.disabled = false; btn.textContent = T.btn;
    if (error) {
      if (error.message === 'SALDO_INSUFICIENTE') {
        let f = []; try { f = JSON.parse(error.details); } catch {}
        await carregarEstoque().catch(() => {}); desenharLinhas();
        return modal(`<h3>Saldo insuficiente</h3><p>Outro lançamento pode ter consumido o saldo. Nada foi gravado.</p>
          <ul>${f.map(x => `<li><span class="cod">${esc(x.codigo)}</span>: saldo ${pc(x.saldo)} pç, solicitado ${pc(x.solicitado)} pç</li>`).join('')}</ul>
          <div class="acoes"><button class="btn pri" data-fechar>Corrigir quantidades</button></div>`);
      }
      return toast(erroTexto(error), 'erro');
    }
    toast(data.duplicado ? `Este lançamento já estava gravado (nº ${data.numero}). Nada foi duplicado.`
      : `${TIPO_NOME[tipo]} nº ${data.numero} registrada: ${pc(data.pecas)} pç · ${m3(data.m3)} m³.`, 'ok');
    const dataAnterior = R.data;
    S.rascunhos[modo] = novoRascunho(modo); S.rascunhos[modo].data = dataAnterior;
    try { await carregarEstoque(); } catch {}
    renderMov(modo);
  });
  atualizarLive();
  setTimeout(() => busca.focus(), 50);
}

   HISTÓRICO

const filtroHist = { de: null, ate: null, tipo: '', motivo: '', usuario: '', produto: '' };
let histDados = [];
async function renderHistorico() {

async function buscarHistorico() {
  let q = sb.from('vw_movimentacoes').select('*').order('criado_em', { ascending: false }).order('codigo').limit(3000);
  if (filtroHist.de) q = q.gte('data_referencia', filtroHist.de);
  if (filtroHist.ate) q = q.lte('data_referencia', filtroHist.ate);
  if (filtroHist.tipo) q = q.eq('tipo', filtroHist.tipo);
  if (filtroHist.motivo) q = q.eq('motivo', filtroHist.motivo);
  if (filtroHist.usuario) q = q.eq('usuario_id', filtroHist.usuario);
  if (filtroHist.produto) { const t = filtroHist.produto.replace(/[%,()]/g, ' ').trim(); q = q.or(`codigo.ilike.%${t}%,descricao.ilike.%${t}%`); }
  const { data, error } = await q;
  const box = $('#h-tab'); if (!box) return;
  if (error) return box.innerHTML = `<div class="msg erro">${esc(erroTexto(error))}</div>`;

  box.innerHTML = data.length ? `<table class="larga"><thead><tr><th>Data ref.</th><th>Lançado em</th><th>Nº</th><th>Tipo / motivo</th><th>Código</th><th>Descrição</th><th class="r">Peças</th><th class="r">m³</th><th class="r">Saldo após</th><th>Usuário</th><th>Referência</th></tr></thead><tbody>

      <td><a href="#" data-l="${m.lancamento_id}" class="num">${m.numero}</a>${m.estornado_por_numero ? ` <span class="tag warn">estornado</span>` : ''}</td>
      <td><span class="tag ${TIPO_TAG[m.tipo]}">${TIPO_NOME[m.tipo]}</span> ${esc(m.motivo || '')}</td><td class="cod">${esc(m.codigo)}</td>
      <td class="desc">${esc(m.descricao)} <span class="muted">${esc([m.classificacao, m.acabamento].filter(Boolean).join(' '))}</span></td>
      <td class="r num ${m.sinal > 0 ? 'pos' : 'neg'}">${m.sinal > 0 ? '+' : '−'}${pc(m.quantidade)}</td><td class="r num">${m3(m.m3)}</td>
      <td class="r num">${pc(m.saldo_posterior)}</td><td>${esc(m.usuario_nome)}</td><td>${esc(m.referencia || '')}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="6">${pc(data.length)} movimentações${data.length >= 3000 ? ' (limite atingido — reduza o período)' : ''}</td>
      <td class="r num" colspan="2"><span class="pos">+${m3(ent.reduce((a, m) => a + Number(m.m3), 0))}</span> / <span class="neg">−${m3(sai.reduce((a, m) => a + Number(m.m3), 0))}</span> m³</td><td colspan="3"></td></tr></tfoot></table>`
    : '<div class="vazio">Nenhuma movimentação nesse período. Amplie as datas ou limpe os filtros.</div>';
  $$('#h-tab [data-l]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); detalheLancamento(a.dataset.l); }));
}
async function detalheLancamento(id) {

    </div>

    ${l.autorizado_sem_saldo ? '<div class="msg erro" style="margin-bottom:12px">Saída autorizada pelo administrador acima do saldo disponível.</div>' : ''}
    ${l.estornado_por_numero ? `<div class="msg" style="margin-bottom:12px">Este lançamento foi estornado pelo lançamento nº ${l.estornado_por_numero}.</div>` : ''}
    <div class="tw" style="max-height:44vh"><table><thead><tr><th>Código</th><th>Descrição</th><th class="r">Peças</th><th class="r">m³</th><th class="r">Saldo antes → depois</th></tr></thead><tbody>
      ${data.map(m => `<tr><td class="cod">${esc(m.codigo)}</td><td>${esc(m.descricao)} <span class="muted">${esc([m.classificacao, m.acabamento].filter(Boolean).join(' '))}</span></td>
        <td class="r num ${m.sinal > 0 ? 'pos' : 'neg'}">${m.sinal > 0 ? '+' : '−'}${pc(m.quantidade)}</td><td class="r num">${m3(m.m3)}</td><td class="r num">${pc(m.saldo_anterior)} → ${pc(m.saldo_posterior)}</td></tr>`).join('')}

  $('#l-estornar')?.addEventListener('click', () => {

      onMount: (el, close) => $('#e-ok', el).addEventListener('click', async () => {
        const j = $('#e-just', el).value.trim();

        if (e) return toast(e.message === 'SALDO_INSUFICIENTE' ? 'Não é possível estornar: o saldo atual de algum item ficaria negativo.' : erroTexto(e), 'erro');
        close(); toast(`Estorno registrado (lançamento nº ${r.numero}).`, 'ok');

function nomeArquivo(base, ext) { return `${base}_${new Date().toLocaleDateString('sv-SE')}.${ext}`; }
function exportarEstoque(fmt) {
  const lista = filtrarEstoque();
  const linhas = lista.map(p => ({ 'Código': p.codigo, 'Tipo': p.categoria, 'Espécie': p.especie, 'Espessura (mm)': Number(p.espessura_mm),
    'Comprimento (m)': Number(p.comprimento_m), 'Largura (m)': Number(p.largura_m), 'Camadas': p.camadas ?? '', 'Descrição': p.descricao,
    'Classificação': p.classificacao || '', 'Acabamento': p.acabamento || '', 'Peças': p.saldo, 'M³': Number(p.m3_total),
    'Mínimo': p.estoque_minimo, 'Situação': STATUS[p.status][0] }));
  if (fmt === 'xlsx') return xlsx(linhas, 'Estoque', nomeArquivo('estoque_celplac', 'xlsx'));
  pdf('Listagem de estoque — produto acabado', `Posição em ${new Date().toLocaleString('pt-BR')} · ${lista.length} itens`,
    ['Código', 'Descrição', 'Classificação', 'Acabamento', 'Peças', 'M³'],
    lista.map(p => [p.codigo, p.descricao, p.classificacao || '—', p.acabamento || '—', pc(p.saldo), m3(p.m3_total)]),
    ['', 'Total', '', '', pc(lista.reduce((a, p) => a + p.saldo, 0)), m3(lista.reduce((a, p) => a + Number(p.m3_total), 0))],
    nomeArquivo('estoque_celplac', 'pdf'), [4, 5]);
}
function exportarHistorico(fmt) {
  if (!histDados.length) return toast('Não há movimentações para exportar.', 'erro');
  const linhas = histDados.map(m => ({ 'Data ref.': dataBR(m.data_referencia), 'Lançado em': horaBR(m.criado_em), 'Nº': m.numero, 'Tipo': TIPO_NOME[m.tipo],
    'Motivo': m.motivo || '', 'Código': m.codigo, 'Descrição': m.descricao, 'Classificação': m.classificacao || '', 'Acabamento': m.acabamento || '',
    'Peças': m.quantidade_assinada, 'M³': Number(m.m3_assinado), 'Saldo após': m.saldo_posterior, 'Usuário': m.usuario_nome,
    'Referência': m.referencia || '', 'Observação': m.observacao || '' }));
  if (fmt === 'xlsx') return xlsx(linhas, 'Movimentações', nomeArquivo('movimentacoes_celplac', 'xlsx'));
  pdf('Histórico de movimentações', `Período ${dataBR(filtroHist.de)} a ${dataBR(filtroHist.ate)} · ${histDados.length} registros`,
    ['Data', 'Nº', 'Tipo', 'Código', 'Descrição', 'Peças', 'M³', 'Usuário', 'Ref.'],
    histDados.map(m => [dataBR(m.data_referencia), m.numero, `${TIPO_NOME[m.tipo]} ${m.motivo || ''}`, m.codigo, m.descricao,
      (m.sinal > 0 ? '+' : '−') + pc(m.quantidade), m3(m.m3), m.usuario_nome, m.referencia || '']), null,
    nomeArquivo('movimentacoes_celplac', 'pdf'), [5, 6]);
}
function xlsx(linhas, aba, arquivo) {
  if (!window.XLSX) return toast('Biblioteca de Excel não carregou. Verifique a internet.', 'erro');
  const ws = XLSX.utils.json_to_sheet(linhas); const wb = XLSX.utils.book_new();
  ws['!cols'] = Object.keys(linhas[0] || {}).map(k => ({ wch: Math.max(k.length + 2, ...linhas.slice(0, 200).map(l => String(l[k] ?? '').length + 1)) }));
  XLSX.utils.book_append_sheet(wb, ws, aba); XLSX.writeFile(wb, arquivo);
}
function pdf(titulo, sub, cab, corpo, rodape, arquivo, colsDir = []) {
  if (!window.jspdf) return toast('Biblioteca de PDF não carregou. Verifique a internet.', 'erro');
  const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  doc.setFillColor(30, 42, 47); doc.rect(0, 0, 297, 22, 'F');
  doc.setTextColor(255); doc.setFontSize(15); doc.text('CELPLAC Ind. de Compensados — ' + titulo, 12, 10);
  doc.setFontSize(9.5); doc.setTextColor(200, 210, 212); doc.text(sub, 12, 16.5);
  const colStyles = {}; colsDir.forEach(i => colStyles[i] = { halign: 'right' });
  doc.autoTable({ head: [cab], body: corpo, foot: rodape ? [rodape] : undefined, startY: 27, theme: 'grid',
    styles: { fontSize: 8, cellPadding: 1.6, lineColor: [217, 221, 214], lineWidth: .1 },
    headStyles: { fillColor: [46, 111, 106], textColor: 255 }, footStyles: { fillColor: [242, 243, 239], textColor: 30, fontStyle: 'bold' },
    columnStyles: colStyles, margin: { left: 12, right: 12 },
    didDrawPage: () => { doc.setFontSize(8); doc.setTextColor(120); doc.text(`Emitido em ${new Date().toLocaleString('pt-BR')} por ${S.perfil.nome} · página ${doc.internal.getNumberOfPages()}`, 12, 204); } });
  doc.save(arquivo);
}

          if (!(await confirmar('Alterar medidas de item com saldo?', `<p>Este item tem ${pc(p.saldo)} peças em estoque. Alterar as medidas muda o m³ do saldo atual. O histórico já gravado mantém o m³ original.</p>`, 'Alterar mesmo assim', 'out'))) return;
        }
        const r = p ? await sb.from('produtos').update(reg).eq('id', p.id).select('codigo').single()
                    : await sb.from('produtos').insert({ ...reg, codigo: '' }).select('codigo').single();
        if (r.error) return toast(erroTexto(r.error), 'erro');
        close(); toast(p ? `Produto ${r.data.codigo} atualizado.` : `Produto ${r.data.codigo} cadastrado.`, 'ok');
        await carregarEstoque(); if (S.rota === 'cadastros') renderCadastros(); else if (S.rota === 'estoque') renderEstoque();
      });
    }
  });
}
function cadAux(t) {
  const A = AUX[t]; const linhas = S.ref[t];
  $('#cad').innerHTML = `<div class="filtros"><button class="btn pri" id="ca-novo">Adicionar</button></div>
    <div class="tw"><table><thead><tr>${A.campos.map(([, l]) => `<th>${esc(l.split(' (')[0])}</th>`).join('')}<th>Ativo</th><th></th></tr></thead><tbody>
    ${linhas.map(r => `<tr>${A.campos.map(([c]) => `<td>${esc(c === 'tipo' ? { ENTRADA: 'Entrada', SAIDA: 'Saída', AJUSTE: 'Ajuste' }[r[c]] : r[c])}</td>`).join('')}
      <td>${r.ativo ? 'Sim' : '<span class="tag">Não</span>'}</td><td class="r"><button class="btn sm" data-ed="${r.id}">Editar</button></td></tr>`).join('')}</tbody></table></div>`;
  const form = r => modal(`<h3>${r ? 'Editar' : 'Adicionar'} — ${A.nome}</h3><form id="f-aux" class="grid">
    ${A.campos.map(([c, l]) => c === 'tipo'
      ? `<label class="campo"><span>${l}</span><select class="inp" name="tipo" ${r ? 'disabled' : ''}>${['ENTRADA', 'SAIDA', 'AJUSTE'].map(v => `<option value="${v}" ${r?.tipo === v ? 'selected' : ''}>${{ ENTRADA: 'Entrada', SAIDA: 'Saída', AJUSTE: 'Ajuste' }[v]}</option>`).join('')}</select></label>`
      : `<label class="campo"><span>${l}</span><input class="inp" name="${c}" ${c === 'ordem' ? 'type="number"' : ''} ${c === 'sigla' ? 'maxlength="3" style="text-transform:uppercase"' : ''} required value="${esc(r?.[c] ?? '')}" ${c === 'sigla' && r ? 'readonly title="A sigla faz parte dos códigos já gerados"' : ''}></label>`).join('')}
    <label class="check"><input type="checkbox" name="ativo" ${!r || r.ativo ? 'checked' : ''} style="accent-color:var(--brand)"><span>Ativo</span></label>
    <div class="acoes">${r ? '<button type="button" class="btn out" id="aux-del">Excluir</button>' : ''}<button type="button" class="btn" data-fechar>Cancelar</button><button class="btn pri">Salvar</button></div></form>`, {
    onMount: (el, close) => {
      const f = $('#f-aux', el);
      f.addEventListener('submit', async e => {
        e.preventDefault();
        const reg = { ativo: f.ativo.checked };
        A.campos.forEach(([c]) => { if (c === 'tipo' && r) return; if (c === 'sigla' && r) return; reg[c] = c === 'ordem' ? +f[c].value : c === 'sigla' ? f[c].value.trim().toUpperCase() : f[c].value.trim(); });
        const res = r ? await sb.from(t).update(reg).eq('id', r.id) : await sb.from(t).insert(reg);
        if (res.error) return toast(erroTexto(res.error), 'erro');
        close(); toast('Salvo.', 'ok'); await carregarRef(); await carregarEstoque(); renderCadastros();
      });
      $('#aux-del', el)?.addEventListener('click', async () => {
        const res = await sb.from(t).delete().eq('id', r.id);
        if (res.error) return toast(erroTexto(res.error), 'erro');
        close(); toast('Excluído.', 'ok'); await carregarRef(); renderCadastros();
      });
    }
  });
  $('#ca-novo').addEventListener('click', () => form(null));
  $$('[data-ed]').forEach(b => b.addEventListener('click', () => form(linhas.find(x => x.id === +b.dataset.ed))));
}

/* =====================================================================
   USUÁRIOS (ADMIN)
   ===================================================================== */
async function renderUsuarios() {
  $('#main').innerHTML = cabecalho('Usuários e permissões', 'Cada pessoa tem seu próprio acesso. Todo lançamento fica registrado com o nome de quem lançou.',
    '<button class="btn pri" id="u-novo">Novo usuário</button>') + `
    <div class="grid g3" style="margin-bottom:16px;font-size:14px">
      <div class="painel"><b>Administrador</b><div class="muted">Tudo: cadastros, usuários, ajustes, estornos e autorização de saída sem saldo.</div></div>
      <div class="painel"><b>Encarregado</b><div class="muted">Consulta o estoque e lança entradas e saídas (até 7 dias para trás).</div></div>
      <div class="painel"><b>Consulta / Diretoria</b><div class="muted">Vê painel, estoque, histórico e relatórios. Não lança.</div></div>
    </div><div class="tw" id="u-tab"><div class="vazio">Carregando…</div></div>`;
  atualizarLive();
  $('#u-novo').addEventListener('click', () => formUsuario(null));
  const { data, error } = await sb.from('perfis').select('*').order('ativo', { ascending: false }).order('nome');
  if (error) return $('#u-tab').innerHTML = `<div class="msg erro">${esc(erroTexto(error))}</div>`;
  $('#u-tab').innerHTML = `<table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Situação</th><th></th></tr></thead><tbody>
    ${data.map(u => `<tr><td><b>${esc(u.nome)}</b>${u.id === S.perfil.id ? ' <span class="muted">(você)</span>' : ''}</td><td>${esc(u.email)}</td><td>${PAPEL_NOME[u.papel]}</td>
      <td>${u.ativo ? '<span class="tag in">Ativo</span>' : '<span class="tag out">Sem acesso</span>'}</td><td class="r"><button class="btn sm" data-u="${u.id}">Editar</button></td></tr>`).join('')}</tbody></table>`;
  $$('[data-u]').forEach(b => b.addEventListener('click', () => formUsuario(data.find(u => u.id === b.dataset.u))));
}
function formUsuario(u) {
  const papeis = Object.entries(PAPEL_NOME).map(([k, v]) => `<option value="${k}" ${(u?.papel || 'ENCARREGADO') === k ? 'selected' : ''}>${v}</option>`).join('');
  modal(`<h3>${u ? 'Editar usuário' : 'Novo usuário'}</h3><form id="f-u" class="grid">
    <label class="campo"><span>Nome</span><input class="inp" name="nome" required minlength="2" value="${esc(u?.nome || '')}"></label>
    ${u ? `<div class="campo"><span>E-mail</span><div>${esc(u.email)}</div></div>` : `<label class="campo"><span>E-mail (usado para entrar)</span><input class="inp" name="email" type="email" required autocomplete="off"></label>`}
    <label class="campo"><span>Perfil</span><select class="inp" name="papel">${papeis}</select></label>
    ${u ? `<label class="check"><input type="checkbox" name="ativo" ${u.ativo ? 'checked' : ''} style="accent-color:var(--brand)"><span>Acesso liberado</span></label>
           <label class="campo"><span>Nova senha (deixe em branco para não alterar)</span><input class="inp" name="senha" type="password" minlength="8" autocomplete="new-password"></label>`
        : `<label class="campo"><span>Senha inicial (mínimo 8 caracteres)</span><input class="inp" name="senha" type="text" minlength="8" required autocomplete="off"></label>
           <div class="muted" style="font-size:13px">Entregue a senha à pessoa. Ela pode trocar depois em "Minha senha".</div>`}
    <div class="acoes"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn pri">${u ? 'Salvar alterações' : 'Criar usuário'}</button></div></form>`, {
    onMount: (el, close) => $('#f-u', el).addEventListener('submit', async e => {
      e.preventDefault(); const f = e.target; const btn = $('button.pri', f); btn.disabled = true;
      try {
        if (!u) {
          const { data, error } = await sb.functions.invoke('admin-usuarios', { body: { acao: 'criar', nome: f.nome.value.trim(), email: f.email.value.trim(), senha: f.senha.value, papel: f.papel.value } });
          const msg = error ? (await error.context?.json?.().catch(() => null))?.erro || erroTexto(error) : data?.erro;
          if (msg) throw new Error(msg);
          toast(`Usuário ${f.nome.value.trim()} criado.`, 'ok');
        } else {
          const { error } = await sb.rpc('admin_atualizar_usuario', { p_id: u.id, p_nome: f.nome.value.trim(), p_papel: f.papel.value, p_ativo: f.ativo.checked });
          if (error) throw error;
          if (f.senha.value) {
            const { data, error: e2 } = await sb.functions.invoke('admin-usuarios', { body: { acao: 'redefinir_senha', id: u.id, senha: f.senha.value } });
            const msg = e2 ? (await e2.context?.json?.().catch(() => null))?.erro || erroTexto(e2) : data?.erro;
            if (msg) throw new Error(msg);
          }
          toast('Usuário atualizado.', 'ok');
        }
        close(); renderUsuarios();
      } catch (err) { toast(erroTexto(err), 'erro'); btn.disabled = false; }
    })
  });
}

iniciar();
</script>
</body>
</html>
